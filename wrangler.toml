name = "weauto-license"
main = "weauto_license/cf_worker.js"
compatibility_date = "2024-09-23"

# 使用 Cloudflare 默认域名 https://weauto-license.<你的cf子域>.workers.dev
# （不绑自定义域名）。wrangler deploy 后终端会打印实际地址，填进 config.py 的 CREEM_WORKER_URL。
# 注意：*.workers.dev 在中国大陆可能不可达，买家需自行代理；如需大陆直连再绑自定义域名。

[vars]
CREEM_MODE = "test"                       # 上线切 "prod"
CREEM_PRODUCT_ID = "prod_xxx"             # Creem 后台 License 产品 ID
CREEM_CHECKOUT_URL = "https://www.creem.io/checkout/xxxx"  # 后台「复制结账链接」粘贴这里（买家点开即收银台，支持支付宝）
