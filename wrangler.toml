name = "weauto-license"
main = "weauto_license/cf_worker.js"
compatibility_date = "2024-09-23"

# workers.dev 显式开启：仅供 Creem 官方回调 Webhook 用（服务器在海外，可达 workers.dev）；
# 买家页面(/buy)和 bot 的 AI 代理(/ai/v1)走自定义域名 wetech.jukuai.net（大陆可达）。
workers_dev = true

# 已绑定自定义域名 wetech.jukuai.net（见下方 [[routes]]）。
# 原因：实测 *.workers.dev 在中国大陆不可达（DNS 被污染 + 代理 502），买家打不开购买页、也无法激活。
# config.py 的 CREEM_WORKER_URL 已指向 https://wetech.jukuai.net

[vars]
CREEM_PRODUCTS = '[{"tier": "normal", "label": "初级 套餐费", "price_text": "¥29.9", "product_id": "prod_2oyeDnQx6eWqmDpVvDRfC3", "billing": "once", "voluntary": false, "valid_days": 30, "features": "基础自动回复 + 授权管理 + 标准 AI 额度"}, {"tier": "premium", "label": "中级 套餐费", "price_text": "¥39.9", "product_id": "prod_mYzCeNE1MvRPo6DFt2ZmZ", "billing": "once", "voluntary": false, "valid_days": 30, "features": "全部功能 + 优先支持 + 更高 AI 额度"}, {"tier": "lifetime", "label": "高级 套餐费", "price_text": "¥199", "product_id": "prod_OkTJwM4Od9maNxP8b6vNc", "billing": "once", "voluntary": true, "valid_days": 365, "features": "一次购买 · 365天全功能 · 优先支持"}]'

# ---- Creem 模式：prod = 真实收款；test = 沙箱 ----
CREEM_MODE = "prod"                       # 3 档套餐均为一次性（one-time）：初级/中级/高级 套餐费；高级复用已建一次性产品，初级/中级待 create_creem_product.py 重新铸币

# ---- 卡密网站文案（/buy 页面显示，随手改）----
SITE_TITLE    = "WeAuto 授权中心"
SUPPORT_EMAIL = "weetech@foxmail.com"     # 售后邮箱（Creem 收款账户同款）

# ---- AI 双供应商（彻底去掉 vg.v1api.cc，反破解核心：真实 key 放 Worker secret，客户端只拿卡密）----
#   客户端所有 LLM 调用 -> <worker>/ai/v1/* -> 这里路由到 Workers AI 或火山方舟。
#   ① Workers AI：env.AI binding（下方 [ai] 已绑定），免密钥、有免费额度，默认走它。
#   ② 火山方舟（Volcano Engine / 火山）：OpenAI 兼容，需配 VOLCANO_API_KEY（secret 注入）。
#      火山 key 用 secret 注入（不入仓库）：
#        wrangler secret put VOLCANO_API_KEY     # 粘贴火山方舟 API Key
#      未配 VOLCANO_API_KEY 时 /ai 回落到 Workers AI；两家都没有才 503。
#   优先级：主用 Workers AI，火山(failover)备用。
#   模型路由（resolveProvider）：
#     - 以 @cf/ 开头                       -> Workers AI（主用）
#     - 模型名像火山(doubao / ep- / ark-)  -> 火山（显式指定时主用；未配 VOLCANO_API_KEY 则回落 Workers AI）
#     - 其余（无前缀）                     -> 由 AI_DEFAULT_PROVIDER 决定（默认 workers）
#     - X-WeAuto-Provider: workers|volcano 头可强制指定供应商
#     - 主供应商不可用时自动 failover 到另一家（最大化在线率）
AI_DEFAULT_PROVIDER = "workers"                                       # workers | volcano（默认走 Workers AI）
AI_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"           # Workers AI 聊天模型
VOLCANO_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"        # 火山方舟 OpenAI 兼容基址
# VOLCANO_MODEL：火山方舟模型接入点 ID，由环境变量注入，不在仓库硬编码（避免被密钥扫描误拦）；未配置时回落 Workers AI。
# 兼容回退（不推荐）：若未配 VOLCANO_*，仍可用旧 AI_UPSTREAM_* 充当火山配置。
# AI_UPSTREAM_URL = "https://ark.cn-beijing.volces.com/api/v3"

# ---- Jev 判断模型（/ai/jev/decisions 默认模型，客户端可在 body 里覆盖）----
# 实测对比（2026-09-28，同一句"算了，我习惯了"）：
#   8B   llama-3.1-8b-instruct          -> danger 0 / casual_chat  ← 判错，话里有话没读出来
#   70B  llama-3.3-70b-instruct-fp8-fast -> danger 2 / vent_anger  ← 意图判对，1.4s
# 判断质量是本功能的核心，8B 省下的几百毫秒不值当，默认用 70B。
JEV_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# ---- Workers AI：Jev 判断式 AI 的推理后端（/ai/jev/decisions）----
# 走 Cloudflare 自有推理，不出 CF、不依赖 OpenRouter（免美元结算）。
# 免费额度：Workers AI 每天 10,000 Neurons（见 Cloudflare 控制台）。
[ai]
binding = "AI"

# ---- KV：付款后卡密暂存（webhook 写入，本机轮询读取，7 天自动过期）----
# 命名空间 ID 由 `wrangler kv namespace create LICENSE_KV` 生成后回填到 id 字段。
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "b9359d143ab04b549500066b467e3011"

# ---- KV：token 计费记账（APK 账户令牌的用量/账户档案，跨月自动归零）----
[[kv_namespaces]]
binding = "BILLING_KV"
id = "8d92f8ae61f948b9a17fdfd6239c8dd0"

# ---- 自定义域名（已绑定 wetech.jukuai.net）----
# 实测：*.workers.dev 在中国大陆不可达（DNS 被污染到 Facebook 段 IP，代理亦 502），
# 导致买家打不开购买页、且首次激活无法联网。绑定自有域名后国内可直连。
# wetech.jukuai.net（2026-09-28 起主用，新 Creem 账户 weetech@foxmail.com 配套）。
[[routes]]
pattern = "wetech.jukuai.net"
custom_domain = true
