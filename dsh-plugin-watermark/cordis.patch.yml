# DSH Watermark Removal Plugin
# 视频去水印插件 - 支持 FFT-KCF 自动检测和 LaMA AI 修复
# 【铁律】UI 入口通过 slots 系统注册，不在此处配置
- insert:
    - id: dsh-plugin-watermark
      name: dsh-plugin-watermark
      config:
        # 去水印方法: fft_kcf (轻量级) 或 lama (AI高质量)
        defaultMethod: fft_kcf
        # FFT-KCF 模型 (~200MB) - 首次使用自动下载
        fftKcf:
          autoDownload: true
          modelUrl: "https://github.com/whitelok/watermark-remover/releases/download/v1.0/fft_kcf_model.pth"
        # LaMA 模型 (~1.5GB) - 用户切换时下载
        lama:
          autoDownload: false
          modelUrl: "https://github.com/advimman/lama/releases/download/v1.0.0/best.ckpt"
        # 模型存储路径
        modelDir: "~/.dsh/models"
