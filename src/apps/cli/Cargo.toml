[package]
name = "dsh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
autobins = false
description = "dsh command-line launcher and ACP stdio entry"

[lints]
workspace = true

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
dsh-core = { workspace = true, features = ["headless", "llm-mock"] }
dsh-acp = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
dsh-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
