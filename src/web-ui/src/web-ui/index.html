<!doctype html>
<html lang="zh-CN" data-scheme="cyberpunk-cyan">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo-ICON-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>tupai - AI Workspace</title>
    <script>
      // ── Windows WebView2 process.env polyfill ──────────────────────────
      // Vite's `define` replaces process.env.NODE_ENV at build time, but
      // some third-party libraries or dynamically-imported chunks may still
      // reference `process.env` at runtime. In WebView2 (and any browser
      // environment) `process` is undefined, causing a ReferenceError that
      // kills the entire startup — the #root div stays empty and the user
      // sees a white/blank screen. This minimal polyfill ensures any
      // runtime reference resolves gracefully instead of crashing.
      if (typeof window !== 'undefined' && typeof (window).process === 'undefined') {
        (window).process = {
          env: {
            NODE_ENV: 'production',
          },
          platform: 'browser',
          version: '',
          nextTick: function (fn) { setTimeout(fn, 0); },
        };
      }
    </script>
    <script>
      // ── Early error trap ──────────────────────────────────────────────
      // Catch errors that fire *before* main.tsx's registerGlobalErrorHandlers
      // runs (e.g. a syntax error in the Vite-generated module prelude, a
      // failed dynamic import of a critical chunk, or a top-level ReferenceError
      // from a third-party library). Without this trap, the user sees only
      // a white screen because the splash overlay hides #root and nothing
      // ever calls hideStartupOverlay().
      //
      // We store the first error so the watchdog (below) can display a more
      // specific message instead of the generic "WebView2 missing" text.
      window.__BITFUN_STARTUP_ERROR__ = null;
      window.addEventListener('error', function (evt) {
        var msg = '';
        if (evt instanceof ErrorEvent) {
          msg = evt.message || '';
        } else {
          // Resource load error (script/link/img)
          var target = evt.target || evt.srcElement;
          if (target && target.tagName) {
            msg = 'Failed to load ' + target.tagName.toLowerCase() +
              (target.src ? ': ' + target.src : target.href ? ': ' + target.href : '');
          }
        }
        if (msg && !window.__BITFUN_STARTUP_ERROR__) {
          window.__BITFUN_STARTUP_ERROR__ = msg;
        }
      }, true /* capture phase */);
      window.addEventListener('unhandledrejection', function (evt) {
        var reason = evt.reason;
        var msg = '';
        if (reason instanceof Error) {
          msg = reason.message;
        } else if (typeof reason === 'string') {
          msg = reason;
        } else if (reason && typeof reason.message === 'string') {
          msg = reason.message;
        }
        if (msg && !window.__BITFUN_STARTUP_ERROR__) {
          window.__BITFUN_STARTUP_ERROR__ = msg;
        }
      });
    </script>
    <script>
      (function () {
        // tupai 赛博朋克底色（与 tauri.conf.json backgroundColor 一致）
        var dark = '#0a0a12';
        /* Keep in sync with presets/light-theme.ts colors.background.primary */
        var light = '#f3f3f5';
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var root = document.documentElement;
        var fallbackMessages = {
          'en-US': {
            loadingApp: 'Starting tupai...',
            minimize: 'Minimize',
            maximize: 'Maximize',
            close: 'Close',
            petLoading: 'Loading companion...'
          },
          'zh-CN': {
            loadingApp: '正在启动...',
            minimize: '最小化',
            maximize: '最大化',
            close: '关闭',
            petLoading: '正在加载助手...'
          },
          'zh-TW': {
            loadingApp: '正在啟動 tupai...',
            minimize: '最小化',
            maximize: '最大化',
            close: '關閉',
            petLoading: '正在載入助手...'
          }
        };
        function resolveLocale() {
          var injected = window.__BITFUN_BOOTSTRAP_LOCALE__;
          var lang = typeof injected === 'string' && injected ? injected : navigator.language;
          if (/^zh-(tw|hk|mo|hant)/i.test(lang)) return 'zh-TW';
          if (/^en/i.test(lang)) return 'en-US';
          return 'zh-CN';
        }
        function resolveMessages() {
          var locale = resolveLocale();
          var injected = window.__BITFUN_BOOTSTRAP_MESSAGES__;
          return Object.assign({}, fallbackMessages[locale], injected || {});
        }
        window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__ = resolveMessages;
        window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__ = resolveLocale;
        window.__BITFUN_STARTUP_OVERLAY_STARTED_AT__ = performance.now();
        root.setAttribute('lang', resolveLocale());
        var bg = root.style.backgroundColor || (m && m.matches ? dark : light);
        root.style.setProperty('--bitfun-startup-bg', bg);
        root.style.backgroundColor = bg;
        function paintBody() {
          if (document.body) document.body.style.backgroundColor = bg;
        }
        paintBody();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', paintBody);
        } else {
          paintBody();
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      /* Fallback before inline script runs; align with dark / light theme primaries */
      html {
        background-color: #0a0a12;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: #f3f3f5;
        }
      }
      
      body {
        background-color: inherit;
      }

      #root,
      #bitfun-startup-overlay {
        width: 100%;
        height: 100%;
      }

      #bitfun-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
      }

      .bitfun-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .splash-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bitfun-startup-bg, inherit);
        color: rgba(143, 143, 153, 0.56);
        font-family: "Rajdhani", "Noto Sans SC", "Inter", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        pointer-events: none;
      }

      #bitfun-startup-overlay.bitfun-startup-overlay--exiting {
        animation: bitfun-startup-overlay-exit 0.5s ease-in-out both;
      }

      .bitfun-startup-window-controls {
        position: fixed;
        top: 8px;
        right: 10px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 2px;
        opacity: 0.72;
        pointer-events: auto;
      }

      .bitfun-startup-window-controls[hidden] {
        display: none;
      }

      .bitfun-startup-window-controls__btn {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: rgba(143, 143, 153, 0.9);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .bitfun-startup-window-controls__btn:hover {
        background: rgba(143, 143, 153, 0.12);
        color: rgba(143, 143, 153, 1);
      }

      .bitfun-startup-window-controls__btn--close:hover {
        color: #ef4444;
      }

      .bitfun-startup-window-controls__glyph {
        position: relative;
        width: 12px;
        height: 12px;
        display: block;
      }

      .bitfun-startup-window-controls__glyph--minimize::before {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 6px;
        height: 1.5px;
        border-radius: 999px;
        background: currentColor;
      }

      .bitfun-startup-window-controls__glyph--maximize::before {
        content: "";
        position: absolute;
        inset: 2px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
      }

      .bitfun-startup-window-controls__glyph--close::before,
      .bitfun-startup-window-controls__glyph--close::after {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 5px;
        height: 1.5px;
        border-radius: 999px;
        background: currentColor;
      }

      .bitfun-startup-window-controls__glyph--close::before {
        transform: rotate(45deg);
      }

      .bitfun-startup-window-controls__glyph--close::after {
        transform: rotate(-45deg);
      }

      .splash-screen__center {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-screen__logo-wrap {
        animation: splash-logo-idle 3.2s ease-in-out infinite;
        -webkit-animation: splash-logo-idle 3.2s ease-in-out infinite;
        will-change: filter, opacity, transform;
      }

      .splash-screen__logo,
      .bitfun-preload__logo {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 16px;
        user-select: none;
        -webkit-user-select: none;
      }

      .splash-screen__message {
        position: absolute;
        top: calc(100% + 16px);
        left: 50%;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 48px));
        color: rgba(143, 143, 153, 0.72);
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        opacity: 0;
        transform: translate(-50%, -2px);
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        pointer-events: none;
      }

      .splash-screen__message--visible {
        opacity: 0.62;
        transform: translate(-50%, 0);
      }

      @keyframes splash-logo-idle {
        0%, 100% {
          opacity: 0.42;
          transform: scale(0.985);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes bitfun-startup-overlay-exit {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-screen__logo-wrap {
          animation: none;
        }

        .splash-screen__logo {
          filter: none;
        }

        .splash-screen__message {
          transition: none;
        }
      }

      .bitfun-pet-preload-body {
        background: transparent !important;
      }

      .bitfun-pet-preload-body #root {
        background: transparent;
      }

      .bitfun-pet-preload {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        pointer-events: none;
      }

      .bitfun-pet-preload__sprite {
        position: relative;
        width: 48px;
        height: 48px;
        transform-origin: center bottom;
        animation: bitfun-pet-preload-breathe 1.8s ease-in-out infinite;
      }

      @keyframes bitfun-pet-preload-breathe {
        0%, 100% {
          opacity: 0.58;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.92;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bitfun-pet-preload__sprite {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <div id="bitfun-startup-overlay">
      <div class="splash-screen" aria-hidden="true">
        <div class="bitfun-startup-window-controls" data-startup-window-controls hidden>
          <button class="bitfun-startup-window-controls__btn" type="button" data-startup-window-action="minimize">
            <span class="bitfun-startup-window-controls__glyph bitfun-startup-window-controls__glyph--minimize" aria-hidden="true"></span>
          </button>
          <button class="bitfun-startup-window-controls__btn" type="button" data-startup-window-action="toggle_maximize">
            <span class="bitfun-startup-window-controls__glyph bitfun-startup-window-controls__glyph--maximize" aria-hidden="true"></span>
          </button>
          <button class="bitfun-startup-window-controls__btn bitfun-startup-window-controls__btn--close" type="button" data-startup-window-action="close">
            <span class="bitfun-startup-window-controls__glyph bitfun-startup-window-controls__glyph--close" aria-hidden="true"></span>
          </button>
        </div>
        <div class="splash-screen__center">
          <div class="splash-screen__logo-wrap">
            <img
              class="bitfun-preload__logo"
              src="/Logo-ICON-128.png"
              alt=""
              draggable="false"
              decoding="async"
              fetchpriority="low"
            />
          </div>
          <div class="splash-screen__message">Starting tupai...</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isPetWindow = params.get('bitfunWindow') === 'agent-companion';
        var messages = window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__
          ? window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__()
          : { loadingApp: 'Starting tupai...', minimize: 'Minimize', maximize: 'Maximize', close: 'Close', petLoading: 'Loading companion...' };
        var locale = window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__
          ? window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__()
          : 'en-US';
        document.documentElement.setAttribute('lang', locale);

        if (isPetWindow) {
          document.body.classList.add('bitfun-pet-preload-body');
          var startupOverlay = document.getElementById('bitfun-startup-overlay');
          if (startupOverlay) startupOverlay.remove();
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div class="bitfun-pet-preload"><div class="bitfun-pet-preload__sprite" aria-hidden="true"></div><span class="bitfun-sr-only"></span></div>';
            var petStatus = root.querySelector('.bitfun-sr-only');
            if (petStatus) petStatus.textContent = messages.petLoading;
          }
          return;
        }

        var hint = document.querySelector('.splash-screen__message');
        if (hint) {
          hint.textContent = messages.loadingApp;
          window.setTimeout(function () {
            hint.classList.add('splash-screen__message--visible');
          }, 1200);
        }

        var controls = document.querySelector('[data-startup-window-controls]');
        if (controls && window.__BITFUN_SHOW_STARTUP_WINDOW_CONTROLS__) {
          controls.hidden = false;
          var labels = {
            minimize: messages.minimize,
            toggle_maximize: messages.maximize,
            close: messages.close
          };
          controls.querySelectorAll('[data-startup-window-action]').forEach(function (button) {
            var action = button.getAttribute('data-startup-window-action');
            var label = labels[action] || action;
            button.setAttribute('aria-label', label);
            button.setAttribute('title', label);
            button.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopPropagation();
              var tauri = window.__TAURI_INTERNALS__;
              if (!tauri || typeof tauri.invoke !== 'function') return;
              tauri.invoke('startup_window_control', { request: { action: action } }).catch(function () {});
            });
          });
        }
      })();

      // ── White-screen watchdog ────────────────────────────────────────
      // If the main JS bundle fails to load/execute or React never mounts
      // (e.g. a runtime error before ReactDOM.createRoot().render()), the
      // #root div stays empty and the user sees only the splash overlay.
      //
      // We check at two timepoints:
      //   8s  — fast check: catches obvious crashes (syntax errors, module
      //         load failures) without making the user wait too long.
      //   30s — slow check: catches hangs where the bundle loaded but
      //         React never mounted (slow IPC, theme init timeout, etc).
      //
      // If a startup error was captured by the early error trap (above),
      // we include the first line of that error in the message so the user
      // has a clue beyond "something went wrong".
      function showWatchdogError(phase) {
        var rootEl = document.getElementById('root');
        var overlay = document.getElementById('bitfun-startup-overlay');
        if (rootEl && rootEl.childElementCount > 0) return; // App rendered OK
        var locale = window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__
          ? window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__()
          : 'zh-CN';
        var startupErr = window.__BITFUN_STARTUP_ERROR__;
        var errLine = '';
        if (startupErr) {
          // Show only the first line to avoid flooding the UI with minified stack.
          errLine = startupErr.split('\n')[0];
          if (errLine.length > 200) errLine = errLine.substring(0, 200) + '…';
        }
        var msgs = {
          'en-US': {
            title: 'Startup failed',
            detail: 'The application failed to start.' +
              (phase === 'fast' ? ' A critical loading error occurred.' :
                ' The application did not respond in time.') +
              ' This may be caused by a missing or incompatible WebView2 runtime, or a corrupted installation.',
            reload: 'Reload',
            errorPrefix: 'Error: ',
          },
          'zh-CN': {
            title: '启动失败',
            detail: '应用启动失败。' +
              (phase === 'fast' ? '检测到关键加载错误。' :
                '应用在规定时间内未响应。') +
              '可能是 WebView2 运行时缺失、版本不兼容，或安装文件损坏导致。',
            reload: '重新加载',
            errorPrefix: '错误: ',
          },
          'zh-TW': {
            title: '啟動失敗',
            detail: '應用啟動失敗。' +
              (phase === 'fast' ? '偵測到關鍵載入錯誤。' :
                '應用在規定時間內未回應。') +
              '可能是 WebView2 運行時缺失、版本不相容，或安裝檔案損壞導致。',
            reload: '重新載入',
            errorPrefix: '錯誤: ',
          },
        };
        var m = msgs[locale] || msgs['zh-CN'];
        var errHtml = errLine
          ? '<p style="margin:8px 0 0;font-size:12px;font-family:monospace;opacity:0.6;word-break:break-all">' + m.errorPrefix + errLine + '</p>'
          : '';
        var html =
          '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0a12;color:#e5e7eb;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box">' +
            '<div style="max-width:560px;text-align:center">' +
              '<h2 style="margin:0 0 12px;font-size:18px;font-weight:600">' + m.title + '</h2>' +
              '<p style="margin:0 0 20px;opacity:0.8;font-size:14px;line-height:1.6">' + m.detail + '</p>' +
              errHtml +
              '<div style="margin-top:20px;display:flex;gap:8px;justify-content:center">' +
                '<button onclick="window.location.reload()" style="padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">' + m.reload + '</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        if (overlay) {
          overlay.innerHTML = html;
        } else if (rootEl) {
          rootEl.innerHTML = html;
        }
      }

      // Fast watchdog: 8s — catches immediate crashes (module load / syntax errors)
      // Only triggers if we already captured a startup error.
      window.setTimeout(function () {
        if (window.__BITFUN_STARTUP_ERROR__) {
          showWatchdogError('fast');
        }
      }, 8000);

      // Slow watchdog: 30s — catches hangs (slow IPC, theme init timeout, etc)
      window.setTimeout(function () {
        showWatchdogError('slow');
      }, 30000);
    </script>
  </body>
</html>
