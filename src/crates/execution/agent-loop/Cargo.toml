[package]
name = "dsh-agent-loop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Default turn/step agent driver. Every request is derived from the session log."

[lints]
workspace = true

[dependencies]
dsh-core-types = { workspace = true }
dsh-events = { workspace = true }
dsh-runtime-ports = { workspace = true }
dsh-agent-stream = { workspace = true }
dsh-session = { workspace = true }
dsh-system-prompt = { workspace = true }
dsh-tool-contracts = { workspace = true }
dsh-agent-runtime = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
