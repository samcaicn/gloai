[package]
name = "dsh-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Local filesystem provider and model-facing read/write/edit/glob/grep tools"

[lints]
workspace = true

[dependencies]
dsh-core-types = { workspace = true }
dsh-events = { workspace = true }
dsh-runtime-ports = { workspace = true }
dsh-tool-contracts = { workspace = true }
dsh-system-prompt = { workspace = true }
async-trait = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "io-util"] }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
