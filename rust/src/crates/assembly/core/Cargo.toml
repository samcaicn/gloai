[package]
name = "dsh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Delivery-profile assembly: resolve a RuntimeSpec, then boot a ProductRuntime"

[lints]
workspace = true

[features]
default = ["headless", "llm-mock"]
headless = ["llm-deepseek"]
test = ["llm-mock"]
llm-deepseek = ["dep:dsh-llm-deepseek"]
llm-mock = ["dep:dsh-llm-mock"]

[dependencies]
dsh-core-types = { workspace = true }
dsh-events = { workspace = true }
dsh-runtime-ports = { workspace = true }
dsh-session = { workspace = true }
dsh-system-prompt = { workspace = true }
dsh-tool-contracts = { workspace = true }
dsh-agent-runtime = { workspace = true }
dsh-agent-loop = { workspace = true }
dsh-credentials = { workspace = true }
dsh-fs = { workspace = true }
dsh-shell = { workspace = true }
dsh-subprocess = { workspace = true }
dsh-persist = { workspace = true }
dsh-llm-deepseek = { workspace = true, optional = true }
dsh-llm-mock = { workspace = true, optional = true }
chrono = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
