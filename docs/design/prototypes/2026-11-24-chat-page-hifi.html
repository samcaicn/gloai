<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天页高保真</title>
<!--
  聊天页高保真原型(2026-11-24)。颜色、字号、圆角、图标都取自 app 里的 ui/theme(Colors.kt / Tokens.kt / Icons.kt),
  组件形状照 ChatComposer、VoiceHold、VoiceCallPage、VoiceCallBar、VoiceCallRecords、ChatEmptyState 画。
  要看的改动:所有回复一样的灰底块、不要头部和尾部按钮、完整正文、输入框上方进度条、虚拟屏照旧、⋯ 移到聊天页。
-->
<style>
:root{
  --bg:#F7F7F8;--surface:#FFFFFF;--fill:rgba(0,0,0,.039);--ink:#1C1C1E;--ink2:#5F6068;--ink3:#9A9BA3;--inkSoft:#4A4A50;
  --hair:rgba(0,0,0,.07);--edge:rgba(0,0,0,.05);--accent:#0A7CFF;--accentSoft:rgba(10,124,255,.10);--userBub:rgba(10,124,255,.14);
  --ok:#1F9D55;--okSoft:rgba(31,157,85,.12);--warn:#B86E00;--warnSolid:#FF9F0A;--warnSoft:rgba(255,159,10,.12);
  --bad:#E5483D;--badSoft:rgba(229,72,61,.10);--answer:rgba(0,0,0,.035);--neutralSoft:rgba(0,0,0,.043);
  --glass:rgba(255,255,255,.72);--glassEdge:rgba(0,0,0,.06);--float:0 6px 22px rgba(0,0,0,.09),0 1px 3px rgba(0,0,0,.05);
  --page:#E8E8EC;--pageInk:#1C1C1E;--pageInk2:#5F6068;--pageCard:#fff;--bezel:#111;
}
:root[data-theme="dark"]{
  --bg:#0E0E10;--surface:#1A1A1D;--fill:rgba(255,255,255,.059);--ink:#F2F2F4;--ink2:#A4A5AD;--ink3:#6C6D75;--inkSoft:#C6C6CD;
  --hair:rgba(255,255,255,.08);--edge:rgba(255,255,255,.06);--accent:#3D97FF;--accentSoft:rgba(61,151,255,.16);--userBub:rgba(61,151,255,.14);
  --ok:#3CCF7A;--okSoft:rgba(60,207,122,.14);--warn:#FFB340;--warnSolid:#FF9F0A;--warnSoft:rgba(255,159,10,.16);
  --bad:#FF6961;--badSoft:rgba(255,105,97,.14);--answer:rgba(255,255,255,.05);--neutralSoft:rgba(255,255,255,.07);
  --glass:rgba(26,26,29,.72);--glassEdge:rgba(255,255,255,.08);--float:0 6px 22px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --page:#050506;--pageInk:#F2F2F4;--pageInk2:#A4A5AD;--pageCard:#151517;--bezel:#2a2a2e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--pageInk);font-family:-apple-system,"PingFang SC","Noto Sans SC","Roboto","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}

/* ---------- 外层:左边场景表,中间手机,右边说明 ---------- */
.wrap{display:grid;grid-template-columns:250px auto minmax(240px,320px);gap:28px;justify-content:center;align-items:start;padding:24px 20px 40px;min-height:100vh}
.side{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;padding-right:4px}
.side h1{font-size:18px;font-weight:700;margin-bottom:4px}
.side .sub{font-size:12.5px;color:var(--pageInk2);line-height:18px;margin-bottom:14px}
.grp{font-size:11.5px;color:var(--pageInk2);font-weight:600;letter-spacing:.04em;margin:14px 0 6px}
.sc{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;margin-bottom:2px}
.sc b{display:block;font-size:13.5px;font-weight:600;line-height:19px}
.sc span{display:block;font-size:11.5px;color:var(--pageInk2);line-height:16px;margin-top:1px}
.sc:hover{background:rgba(127,127,127,.10)}
.sc.on{background:var(--pageCard);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.theme{margin-top:14px;display:flex;gap:6px}
.theme button{flex:1;padding:7px 0;border-radius:9px;font-size:12.5px;background:rgba(127,127,127,.12)}
.theme button.on{background:var(--pageCard);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
.notes{position:sticky;top:24px;background:var(--pageCard);border-radius:16px;padding:16px 16px 14px;font-size:13px;line-height:20px;color:var(--pageInk)}
.notes h2{font-size:15px;font-weight:700;margin-bottom:2px}
.notes .d{color:var(--pageInk2);font-size:12.5px;margin-bottom:10px}
.notes h3{font-size:12px;color:var(--pageInk2);font-weight:600;margin:10px 0 4px}
.notes ul{padding-left:16px}
.notes li{margin-bottom:4px}
.notes .ask li::marker{content:"？ ";color:#FF9F0A;font-weight:700}
.notes .try{margin-top:10px;padding-top:10px;border-top:1px solid rgba(127,127,127,.18);font-size:12px;color:var(--pageInk2)}

/* ---------- 手机 ---------- */
.phone{width:390px;height:844px;border-radius:48px;padding:10px;background:var(--bezel);box-shadow:0 30px 70px rgba(0,0,0,.22)}
.scr{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:22px}
.status{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 28px;font-size:14px;font-weight:600;z-index:30;color:var(--ink)}
.status .si{display:flex;gap:5px;align-items:center}
.status.green{background:var(--ok);color:#fff}
.navh{position:absolute;bottom:7px;left:50%;width:108px;height:4px;margin-left:-54px;border-radius:4px;background:var(--ink);opacity:.85;z-index:40}

.feed{position:absolute;inset:0;overflow-y:auto;padding:0 16px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}

/* 顶栏:浮着的玻璃圆钮 + 中间标题胶囊 */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:.5px solid var(--glassEdge);box-shadow:var(--float)}
.top{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:20;pointer-events:none}
.top>*{pointer-events:auto}
.rb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tpill{height:36px;padding:0 18px;border-radius:18px;display:flex;align-items:center;font-size:17px;line-height:22px;font-weight:600}
.topfade{position:absolute;left:0;right:0;top:0;height:96px;background:linear-gradient(var(--bg) 42%,transparent);z-index:15;pointer-events:none}

.callbar{position:absolute;left:0;right:0;top:40px;height:36px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;line-height:18px;font-weight:500;z-index:30;cursor:pointer}
.callbar .ck{opacity:.85;font-variant-numeric:tabular-nums}

/* 对话内容 */
.tm{text-align:center;font-size:12px;line-height:17px;color:var(--ink3);margin:18px 0 10px;font-variant-numeric:tabular-nums}
.urow{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:12px 0 14px}
.ububble{max-width:80%;background:var(--userBub);border-radius:20px 20px 6px 20px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.uimg{width:132px;height:132px;border-radius:16px;overflow:hidden;border:.5px solid var(--edge)}
.reply{background:var(--answer);border-radius:20px 20px 20px 6px;padding:12px 14px;margin-bottom:8px;max-width:100%;text-align:justify;word-break:break-word}
.reply.fit{width:fit-content}
.md p+p,.md p+ul,.md ul+p,.md p+ol,.md ol+p,.md h4+p,.md p+h4,.md ul+h4,.md ol+h4,.md table+p,.md p+table,.md pre+p,.md p+pre,.md blockquote+p,.md p+blockquote,.md h4+ul,.md h4+ol,.md h4+table{margin-top:8px}
.md h4{font-size:16px;line-height:22px;font-weight:600}
.md ul,.md ol{padding-left:20px}
.md li{margin:3px 0}
.md li::marker{color:var(--ink3)}
.md strong{font-weight:600}
.md code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px;word-break:break-all;background:var(--fill);padding:1px 5px;border-radius:5px}
.md pre{background:var(--surface);border:.5px solid var(--edge);border-radius:12px;padding:10px 12px;overflow-x:auto;text-align:left}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:19px;white-space:pre}
.md table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:19px;text-align:left}
.md th{font-weight:600;color:var(--ink2);font-size:12.5px}
.md th,.md td{padding:6px 8px 6px 0;border-bottom:.5px solid var(--hair);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md blockquote{border-left:3px solid var(--hair);padding-left:10px;color:var(--ink2)}
.caret{display:inline-block;width:8px;height:16px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.think{display:inline-flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px;line-height:18px;padding:12px 16px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.cline{display:flex;justify-content:center;align-items:center;gap:6px;padding:10px 0;color:var(--ink3);font-size:12px;line-height:17px}
.cline.hl{background:var(--accentSoft);border-radius:10px}

/* 要你处理的卡片 */
.need{background:var(--surface);border:.5px solid var(--edge);border-radius:16px;padding:14px;margin:4px 0 8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.nh{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;font-weight:500;color:var(--warn)}
.nh .dt{width:8px;height:8px;border-radius:50%;background:var(--warnSolid)}
.nh .tt{color:var(--ink3);font-weight:400}
.nq{margin-top:8px}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 14px;border-radius:14px;background:var(--fill);font-size:15px;color:var(--ink);text-align:left}
.opt:hover{background:var(--accentSoft)}
.opt .sm{color:var(--ink3);font-size:12px}
.nbtns{display:flex;gap:8px;margin-top:12px}
.btn{height:40px;padding:0 16px;border-radius:14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--fill);color:var(--ink)}
.nfoot{margin-top:10px;font-size:12px;line-height:17px;color:var(--ink3)}

/* 空对话 */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 0 40px}
.empty h2{font-size:28px;line-height:35px;font-weight:700}
.empty .lead{margin-top:11px;font-size:16px;line-height:23px;color:var(--ink2)}
.rec{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.rcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:.5px solid var(--edge);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.rcard .ti{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.rcard b{display:block;font-size:15.5px;line-height:22px;font-weight:600}
.rcard span{display:block;font-size:13px;line-height:18px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .tx{min-width:0;flex:1}

/* 底部:托盘 + 输入框 */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 12px 22px;z-index:25;display:flex;flex-direction:column;gap:8px}
.comp{border-radius:24px;padding:0}
.cin{min-height:46px;padding:12px 16px 2px;color:var(--ink3);white-space:pre-wrap}
.cin.has{color:var(--ink)}
.crow{display:flex;align-items:center;height:50px;padding:0 6px 6px}
.cb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sp{flex:1}
.send{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--neutralSoft);color:var(--ink3);margin-left:4px}
.send.go{background:var(--ink);color:var(--bg)}
.mic.hold{background:var(--accentSoft);color:var(--accent)}

/* 进度条(在办的事) */
.tray{border-radius:16px;overflow:hidden}
.trow{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 14px;cursor:pointer}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;position:relative}
.sdot.run::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 1.6s infinite}
.sdot.wt{background:var(--warnSolid)}
.sdot.wt::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--warnSolid);opacity:.25;animation:breathe 1.8s infinite}
@keyframes ring{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.4);opacity:0}}
@keyframes breathe{50%{opacity:.05;transform:scale(1.3)}}
.tline{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.tline b{font-size:13px;line-height:18px;font-weight:500;color:var(--ink);flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis}
.tline span{font-size:13px;line-height:18px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.tline span.w{color:var(--warn)}
.tmeta{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.plus{font-size:11px;line-height:16px;padding:0 6px;border-radius:8px;background:var(--neutralSoft);color:var(--ink2);flex:none}
.chev{color:var(--ink3);transition:transform .2s}
.tbody{border-top:.5px solid var(--hair);max-height:330px;overflow-y:auto;padding:4px 0 6px}
.tk{padding:10px 14px 6px}
.tk+.tk{border-top:.5px solid var(--hair)}
.tkh{display:flex;align-items:center;gap:8px}
.tkh b{font-size:15px;line-height:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{font-size:11.5px;line-height:17px;padding:0 7px;border-radius:7px;font-weight:500;flex:none}
.ph.run{background:var(--accentSoft);color:var(--accent)}
.ph.wt{background:var(--warnSoft);color:var(--warn)}
.ph.q{background:var(--neutralSoft);color:var(--ink2)}
.ph.ok{background:var(--okSoft);color:var(--ok)}
.ph.bad{background:var(--badSoft);color:var(--bad)}
.goal{font-size:12px;line-height:17px;color:var(--ink3);margin-top:2px}
.steps{margin-top:8px;position:relative}
.st{display:flex;gap:10px;position:relative;padding:3px 0 5px}
.st .rail{width:8px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.st .rail i{width:7px;height:7px;border-radius:50%;background:var(--ink3);opacity:.55;flex:none}
.st .rail u{flex:1;width:1px;background:var(--hair);margin-top:4px;min-height:8px}
.st:last-child .rail u{display:none}
.st.cur .rail i{background:var(--accent);opacity:1;box-shadow:0 0 0 3px var(--accentSoft)}
.st.wait .rail i{background:var(--warnSolid);opacity:1;box-shadow:0 0 0 3px var(--warnSoft)}
.st .sx{flex:1;font-size:13px;line-height:18px;color:var(--ink2)}
.st.cur .sx{color:var(--ink)}
.st.wait .sx{color:var(--warn)}
.st .stt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:18px}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-bottom:4px}
.tfoot button{font-size:13px;line-height:18px;font-weight:500;padding:6px 0}
.tfoot .stop{color:var(--bad)}
.tfoot .more{color:var(--accent)}

/* 待发的图片 */
.pend{display:flex;gap:8px;padding:8px;border-radius:16px}
.pth{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;border:.5px solid var(--edge)}
.pth .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}

/* 按住说话 */
.hint{align-self:center;height:30px;padding:0 14px;border-radius:15px;display:flex;align-items:center;font-size:12px;color:var(--ink2)}
.hint.bad{background:var(--bad);color:#fff;border-color:transparent;box-shadow:none}
.listen{border-radius:20px;padding:8px 12px 7px}
.listen.armb{outline:1.5px solid var(--bad)}
.lh{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink2)}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--accent);position:relative;flex:none}
.rdot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);animation:ring 1.4s infinite}
.rdot.bad{background:var(--bad)}.rdot.bad::after{display:none}
.eng{font-size:11px;line-height:16px;background:var(--fill);padding:1px 8px;border-radius:9px;color:var(--ink2);font-weight:400}
.lclock{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:400}
.ltext{margin-top:10px;min-height:54px;font-size:17px;line-height:25px;color:var(--ink)}
.ltext .tail{color:var(--ink3)}
.ltext.x{text-decoration:line-through;opacity:.4}
.lfoot{margin-top:8px;font-size:12px;line-height:17px;color:var(--ink3)}
.cover{height:96px;border-radius:24px;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:500;transition:background .15s}
.cover.bad{background:var(--bad)}
.wave{display:flex;gap:4px;align-items:center;height:26px}
.wave i{width:3px;border-radius:2px;background:#fff;animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:var(--h)}}
.cover.bad .wave i{animation:none;height:5px}

/* 虚拟屏小窗 */
.pip{position:absolute;right:12px;z-index:22;border-radius:14px;overflow:hidden;cursor:pointer;background:#000;transition:width .25s,height .25s}
.pip.run{box-shadow:0 0 0 2px var(--ok),0 8px 24px rgba(0,0,0,.25)}
.pip.wt{box-shadow:0 0 0 2px var(--warnSolid),0 8px 24px rgba(0,0,0,.25);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--warnSolid),0 0 0 9px rgba(255,159,10,.28),0 8px 24px rgba(0,0,0,.25)}}
.pip .vs{position:absolute;left:0;top:0;width:360px;height:780px;transform-origin:0 0}
.pipbadge{position:absolute;right:12px;z-index:23;font-size:11.5px;line-height:17px;padding:2px 8px;border-radius:9px;background:var(--warnSolid);color:#fff;font-weight:600}
.pipctl{position:absolute;right:12px;z-index:23;display:flex;gap:6px}
.pipctl .rb{width:32px;height:32px}

/* 虚拟屏里的假画面(通用安卓应用样子) */
.vs{font-family:Roboto,"Noto Sans SC",sans-serif;color:#fff;line-height:1.3}
.vs .vst{height:30px;display:flex;justify-content:space-between;padding:8px 18px 0;font-size:13px;opacity:.9}
.vcard{margin:12px 16px;background:rgba(255,255,255,.18);border-radius:18px;padding:14px 16px}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:16px}
.vrow+.vrow{border-top:1px solid rgba(255,255,255,.16)}
.tap{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.45);border:3px solid #fff;animation:tap 1.4s infinite}
@keyframes tap{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.3);opacity:0}}
.vsl{background:#F3F4F7;color:#1b1b1f}
.vsl .vst{color:#1b1b1f}
.vlist{margin:8px 14px;background:#fff;border-radius:20px;overflow:hidden}
.vli{display:flex;align-items:center;gap:14px;padding:15px 16px;font-size:16px}
.vli+.vli{border-top:1px solid #eceef2}
.vli i{width:34px;height:34px;border-radius:50%;flex:none}
.vdlg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.vdlg>div{width:300px;background:#fff;color:#1b1b1f;border-radius:26px;padding:22px 22px 14px}

/* 菜单和底部面板 */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.0)}
.scrim.dim{background:rgba(0,0,0,.32)}
.menu{position:absolute;right:10px;min-width:188px;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08);padding:6px 0;z-index:51}
.mi{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;width:100%;font-size:15.5px;color:var(--ink);text-align:left}
.mi:hover{background:var(--fill)}
.mi svg{color:var(--ink2)}
.mdiv{height:.5px;background:var(--hair);margin:4px 0}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:51;padding:10px 0 26px}
.handle{width:32px;height:4px;border-radius:2px;background:var(--ink3);opacity:.4;margin:0 auto 16px}
.sht{padding:0 16px;font-size:15.5px;line-height:22px;font-weight:600}
.shh{padding:4px 16px 8px;font-size:13px;line-height:18px;color:var(--ink3)}
.lr{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left}
.lr+.lr::before{content:"";position:absolute;left:58px;right:0;top:0;height:.5px;background:var(--hair)}
.lr .tile{width:30px;height:30px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.lr .tx{flex:1;min-width:0}
.lr b{display:block;font-size:15px;line-height:20px;font-weight:400;color:var(--ink)}
.lr span{display:block;font-size:12.5px;line-height:17px;color:var(--ink3);margin-top:1px}
.lr .live{color:var(--ok)}

/* ---------- 通话页 ---------- */
.call{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.chdr{margin-top:40px;height:56px;display:flex;align-items:center;padding:0 8px;flex:none}
.cav{width:40px;height:40px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;margin-left:4px;color:var(--accent)}
.ctt{flex:1;margin-left:12px;min-width:0}
.ctt b{display:block;font-size:15.5px;line-height:22px;font-weight:600}
.cst{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--ink2)}
.cst i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chair{height:1px;background:var(--hair);flex:none}
.cfeed{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.cfeed::-webkit-scrollbar{display:none}
.lcl{align-self:center;font-size:12px;line-height:17px;color:var(--accent);padding:4px 10px}
.spill{align-self:center;font-size:12px;line-height:17px;color:var(--ink3);background:var(--fill);padding:4px 10px;border-radius:12px}
.said{max-width:80%;padding:10px 14px;border-radius:20px 20px 6px 20px;align-self:flex-end;background:var(--userBub)}
.said.m{align-self:flex-start;background:var(--surface);border:.5px solid var(--hair);border-radius:20px 20px 20px 6px}
.said.part{opacity:.55}
.ctask{background:var(--surface);border:.5px solid var(--hair);border-radius:16px;padding:12px 14px}
.cth{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;font-weight:500}
.cth .ph2{color:var(--ink2)}
.watch{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);background:var(--accentSoft);padding:3px 8px;border-radius:12px;font-weight:400}
.cstep{display:flex;align-items:center;gap:10px;padding-top:8px;color:var(--ink2)}
.cstep.r{color:var(--ink)}
.ok16{width:16px;height:16px;border-radius:50%;background:var(--okSoft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 1px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accentSoft);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 2px}
@keyframes spin{to{transform:rotate(360deg)}}
.cdock{margin:8px 12px 24px;background:var(--surface);border:.5px solid var(--hair);border-radius:24px;padding:12px;flex:none}
.lvl{height:30px;display:flex;align-items:center;justify-content:center;gap:3px}
.lvl i{width:3px;border-radius:2px;background:var(--accent);animation:wv 1s ease-in-out infinite}
.crow2{display:flex;align-items:center;margin-top:8px}
.tog{width:48px;height:48px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tog.on{background:var(--ink);color:var(--bg)}
.hang{height:48px;border-radius:24px;background:var(--bad);color:#fff;display:flex;align-items:center;gap:6px;padding:0 20px;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 窄屏:场景表变成上面一条 ---------- */
@media (max-width:1060px){
  .wrap{grid-template-columns:230px auto}
  .notes{grid-column:2;position:static;max-width:390px}
}
@media (max-width:760px){
  .wrap{display:block;padding:12px 16px 32px}
  .side{position:static;max-height:none;overflow:visible;padding:0}
  .side .sub{margin-bottom:8px}
  .grp{display:none}
  .sclist{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .sclist::-webkit-scrollbar{display:none}
  .sc{flex:none;width:auto;padding:6px 12px;border-radius:16px;background:rgba(127,127,127,.12)}
  .sc span{display:none}
  .sc b{font-size:13px;white-space:nowrap}
  .theme{margin:6px 0 12px}
  .phone{width:100%;max-width:390px;height:780px;margin:0 auto;padding:8px;border-radius:44px}
  .scr{border-radius:36px}
  .notes{margin:16px auto 0;max-width:390px}
}
</style>

/* ---------- 状态 ---------- */
let cur = 'run', st = {};
function load(id) {
  cur = id;
  const sc = SC.find(x => x.id === id);
  st = {...BASE, ...sc.s, trayOpen: !!sc.s.trayOpen, pipBig: !!sc.s.pipBig};
  st.heard = sc.s.heard || ['明早七点提醒我带伞', '，放在门口那把'];
  render(true);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function feedItem(it) {
  switch (it.t) {
    case 'time': return `<div class="tm">${it.v}</div>`;
    case 'user': return `<div class="urow">${it.img ? `<div class="uimg">${plantSvg()}</div>` : ''}<div class="ububble">${esc(it.v)}</div></div>`;
    case 'reply': return `<div class="reply md${it.fit ? ' fit' : ''}">${it.html}</div>`;
    case 'think': return `<div class="reply think"><span class="dots"><i></i><i></i><i></i></span>在想</div>`;
    case 'stream': return `<div class="reply md">${it.html.replace(/<\/p>$/, '<span class="caret"></span></p>')}</div>`;
    case 'call': return `<div class="cline${it.hl ? ' hl' : ''}">${ic('Handset', 13)}<span>${it.v}</span></div>`;
    case 'need': return needCard(it);
  }
  return '';
}
function needCard(it) {
  if (it.kind === 'ask') return `<div class="need"><div class="nh"><span class="dt"></span>要你选<span class="tt">· ${it.task}</span></div>
    <div class="nq">${it.q}</div>
    <div class="opts">${it.opts.map(o => `<button class="opt" data-act="pick"><span>${o[0]}</span><span class="sm">${o[1]}</span></button>`).join('')}</div>
    <div class="nfoot">都不是？直接在下面打字或按住说。</div></div>`;
  return `<div class="need"><div class="nh"><span class="dt"></span>要你接管<span class="tt">· ${it.task}</span></div>
    <div class="nq">${it.q}</div>
    <div class="nbtns"><button class="btn pri" data-act="takeover">${ic('Screens', 16)}去处理</button><button class="btn sec" data-act="stopTask">停止这件事</button></div>
    <div class="nfoot">你在画面里点完，我接着往下办。</div></div>`;
}

function trayHtml() {
  const ts = st.tray; if (!ts) return '';
  const a = ts[0];
  const need = a.phase === 'need';
  const head = `<div class="trow" data-act="tray"><span class="sdot ${need ? 'wt' : 'run'}"></span>
    <div class="tline"><b>${a.title}</b><span class="${need ? 'w' : ''}">${a.step}</span></div>
    ${ts.length > 1 ? `<span class="plus">+${ts.length - 1}</span>` : ''}<span class="tmeta">${a.clock}</span>
    <span class="chev" style="transform:rotate(${st.trayOpen ? 90 : -90}deg)">${ic('Chevron', 16)}</span></div>`;
  if (!st.trayOpen) return `<div class="tray glass">${head}</div>`;
  const phase = {run:['run','在办'], need:['wt','要你处理'], q:['q','排队中 · 第 2 个']};
  const body = ts.map(t => `<div class="tk"><div class="tkh"><b>${t.title}</b><span class="ph ${phase[t.phase][0]}">${phase[t.phase][1]}</span></div>
     <div class="goal">${t.goal}</div>
     ${t.steps.length ? `<div class="steps">${t.steps.map(s => `<div class="st ${s[2] || ''}"><div class="rail"><i></i><u></u></div><div class="sx">${s[0]}</div><div class="stt">${s[1]}</div></div>`).join('')}</div>
     <div class="tfoot"><button class="stop" data-act="stopTask">停止</button><button class="more">查看详细过程 ›</button></div>` : ''}</div>`).join('');
  return `<div class="tray glass">${head}<div class="tbody">${body}</div></div>`;
}

function composerHtml() {
  if (st.hold) {
    const x = st.hold === 'cancel';
    const bars = Array.from({length: 14}, (_, i) => `<i style="--h:${[10,16,22,14,24,18,26,20,24,15,22,12,18,9][i]}px;animation-delay:${(i * 0.07).toFixed(2)}s"></i>`).join('');
    const title = st.holdTo ? `插话给『${st.holdTo}』` : '在听';
    return `<div class="hint ${x ? 'bad' : 'glass'}">${x ? '松开 取消' : '上滑 发送/取消'}</div>
      <div class="listen glass${x ? ' armb' : ''}"><div class="lh"><span class="rdot${x ? ' bad' : ''}"></span>${title}<span class="eng">本机识别</span><span class="lclock">0:04</span></div>
      <div class="ltext${x ? ' x' : ''}">${st.heard[0]}<span class="tail">${st.heard[1]}</span></div>
      <div class="lfoot">松开 · 字填进输入框，可以再改</div></div>
      <div class="cover${x ? ' bad' : ''}"><div class="wave">${bars}</div>${x ? '松开 取消' : '松开 填入'}</div>`;
  }
  const ph = {idle:'打字，或按住说话', busy:'打字插话，或按住说话', answer:'打字回答，或按住说话'}[st.mode];
  const has = !!st.text;
  const right = has || st.pend
    ? `<button class="send go">${ic('Up', 20)}</button>`
    : st.mode === 'busy' ? `<button class="send go" title="停止">${ic('Stop', 20)}</button>`
    : `<button class="send">${ic('Up', 20)}</button>`;
  return `<div class="comp glass"><div class="cin${has ? ' has' : ''}">${has ? esc(st.text) : ph}</div>
    <div class="crow"><button class="cb">${ic('Plus', 22)}</button><div class="sp"></div>
    <button class="cb" data-act="call" title="语音通话">${ic('Handset', 22)}</button>
    <button class="cb mic" data-act="mic" title="按住说话">${ic('Mic', 22)}</button>${right}</div></div>`;
}

function pendHtml() {
  if (!st.pend) return '';
  return `<div class="pend glass"><div class="pth">${shotSvg()}<span class="x">${ic('Close', 11)}</span></div></div>`;
}

function pipHtml(dockH) {
  if (!st.pip) return '';
  const big = st.pipBig;
  const w = big ? 200 : 104, h = Math.round(w * 780 / 360);
  const bottom = dockH + 10;
  const scale = w / 360;
  const screen = st.pip === 'need' ? (cur === 'take' ? vsDialog() : vsPick()) : vsWeather();
  let extra = '';
  if (st.pip === 'need') extra += `<div class="pipbadge" style="bottom:${bottom + h + 8}px">等你处理</div>`;
  if (big) extra += `<div class="pipctl" style="bottom:${bottom + h - 40}px;right:18px"><button class="rb glass" title="静音">${ic('Sound', 16)}</button><button class="rb glass" data-act="pipClose" title="关掉小窗">${ic('Close', 15)}</button></div>`;
  return `<div class="pip ${st.pip === 'need' ? 'wt' : st.pip}" data-act="pip" style="width:${w}px;height:${h}px;bottom:${bottom}px"><div class="vs" style="transform:scale(${scale})">${screen}</div></div>${extra}`;
}

  return `<div class="vsl" style="position:absolute;inset:0"><div class="vst"><span>14:02</span><span>▮▮▮ 86%</span></div>
   <div style="margin:14px;background:#fff;border-radius:28px;padding:14px 18px;font-size:17px;color:#1b1b1f">🔍 上海</div>
   <div class="vlist"><div class="vli"><i style="background:#DCE7FA"></i><div>上海<div style="font-size:13px;color:#777">中国 · 上海市</div></div></div><div class="vli"><i style="background:#DCE7FA"></i><div>崇明<div style="font-size:13px;color:#777">中国 · 上海市</div></div></div></div></div>`;
}
function vsDialog() {
  return `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#4F7FC4,#8FB0DD)"><div class="vst"><span>14:02</span><span>▮▮▮ 86%</span></div>
   <div class="vdlg"><div><div style="font-size:21px;font-weight:500;margin-bottom:12px">隐私条款</div><div style="font-size:15px;line-height:1.5;color:#444">使用天气服务前，请阅读并同意《用户协议》和《隐私政策》。我们会获取你的位置以提供本地天气……</div>
   <div style="display:flex;justify-content:flex-end;gap:22px;margin-top:20px;font-size:15px;color:#2f62c9;font-weight:500"><span>不同意</span><span>同意</span></div></div></div></div>`;
}
function plantSvg() {
  return `<svg viewBox="0 0 132 132" width="132" height="132"><rect width="132" height="132" fill="#E9E4DA"/><rect x="0" y="96" width="132" height="36" fill="#D8CFC0"/>
   <path d="M50 132 L56 104 L76 104 L82 132Z" fill="#B66A45"/>
   <g fill="#2F7A43"><path d="M66 104 C30 96 18 60 40 40 C58 52 66 78 66 104Z"/><path d="M66 104 C100 98 114 66 96 42 C78 54 68 80 66 104Z"/><path d="M66 104 C56 70 62 36 78 20 C90 42 82 78 66 104Z"/></g>
   <g fill="#E9E4DA"><ellipse cx="40" cy="62" rx="4" ry="7" transform="rotate(30 40 62)"/><ellipse cx="96" cy="64" rx="4" ry="7" transform="rotate(-30 96 64)"/><ellipse cx="74" cy="46" rx="3" ry="6"/></g></svg>`;
}
function shotSvg() {
  return `<svg viewBox="0 0 58 58" width="58" height="58"><rect width="58" height="58" fill="#1E1E22"/><rect x="6" y="8" width="30" height="4" rx="2" fill="#E5483D"/><rect x="6" y="17" width="44" height="3" rx="1.5" fill="#888"/><rect x="6" y="24" width="38" height="3" rx="1.5" fill="#888"/><rect x="6" y="31" width="42" height="3" rx="1.5" fill="#666"/><rect x="6" y="38" width="26" height="3" rx="1.5" fill="#666"/></svg>`;
}

function overlayHtml(topY) {
  if (st.overlay === 'menu') return `<div class="scrim" data-act="close"></div><div class="menu" style="top:${topY + 50}px">
    <button class="mi" data-act="goEmpty">${ic('New', 18)}新对话</button>
    <button class="mi" data-act="records">${ic('Clock', 18)}通话记录</button>
    <button class="mi" data-act="tasks">${ic('ListChecks', 18)}这个对话里的事</button>
    <div class="mdiv"></div>
    <button class="mi">${ic('Handset', 18)}通话设置</button></div>`;
  if (st.overlay === 'records') {
    const row = (t, s, live) => `<button class="lr" data-act="close"><span class="tile">${ic('Handset', 16)}</span><span class="tx"><b>${t}</b><span class="${live ? 'live' : ''}">${s}</span></span>${ic('Chevron', 14, 'style="color:var(--ink3)"')}</button>`;
    return `<div class="scrim dim" data-act="close"></div><div class="sheet"><div class="handle"></div><div class="sht">通话记录</div><div class="shh">点一条，到聊天里看那段</div>
     ${row('今天 14:20', '3:12')}${row('今天 09:20', '0:05 · 没有说话')}${row('昨天 21:40', '6:48')}</div>`;
  }
  if (st.overlay === 'tasks') {
    const row = (t, ph, cls, s) => `<button class="lr" data-act="close"><span class="tile">${ic('ListChecks', 16)}</span><span class="tx"><b>${t}</b><span>${s}</span></span><span class="ph ${cls}">${ph}</span>${ic('Chevron', 14, 'style="color:var(--ink3)"')}</button>`;
    return `<div class="scrim dim" data-act="close"></div><div class="sheet"><div class="handle"></div><div class="sht">这个对话里的事</div><div class="shh">点一件看详细进展和每一步</div>
     ${row('看明天上海的天气', '办好了', 'ok', '今天 14:02 · 用时 0:41 · 6 步')}${row('看看还剩多少存储空间', '办好了', 'ok', '今天 14:03 · 用时 0:22 · 4 步')}${row('看后天上海的天气', '已取消', 'q', '今天 14:10 · 停在第 2 步')}${row('查明早路况', '办好了', 'ok', '昨天 21:30 · 用时 1:05')}</div>`;
  }
  return '';
}

function callPage() {
  const bars = Array.from({length: 28}, (_, i) => { const c = 1 - Math.abs(i - 13.5) / 17.5; return `<i style="--h:${Math.round(6 + 22 * c)}px;animation-delay:${(i * 0.05).toFixed(2)}s"></i>`; }).join('');
  return `<div class="call"><div class="chdr"><button class="rb" data-act="collapse" title="收起">${ic('Chevron', 22, 'style="transform:rotate(90deg);color:var(--ink2)"')}</button>
    <div class="cav">${ic('Spark', 22)}</div><div class="ctt"><b>和 Mika 通话中</b><div class="cst"><i></i>正在办事 · 可以接着聊</div></div></div>
    <div class="chair"></div>
    <div class="cfeed">
      <div class="lcl">上次通话 · 昨天 21:40 ›</div>
      <div class="spill">已接通 · 14:20</div>
      <div class="said">明天上海下雨吗</div>
      <div class="said m">明天下午三点到七点有小雨，上午没事，下午出门带把伞。</div>
      <div class="said">那后天呢，帮我去天气 App 里确认一下</div>
      <div class="said m">好，我去天气 App 看一眼后天的，你可以接着说。</div>
      <div class="ctask"><div class="cth"><span style="flex:1">看后天上海的天气</span><span class="ph2">在办</span><span class="watch">${ic('Screens', 13)}看画面</span>${ic('Chevron', 14, 'style="color:var(--ink3)"')}</div>
        <div class="cstep"><span class="ok16">${ic('Check', 11)}</span>打开天气 App</div>
        <div class="cstep r"><span class="spin"></span>往后翻到周四的预报</div></div>
      <div class="said part">顺便看看风大不大…</div>
    </div>
    <div class="cdock"><div class="lvl">${bars}</div>
      <div class="crow2"><button class="tog">${ic('Mic', 22)}</button><span style="width:8px"></span><button class="tog">${ic('Keyboard', 22)}</button>
      <div class="sp"></div><button class="hang">${ic('HangUp', 22)}3:12</button><div class="sp"></div><span style="width:56px"></span><button class="tog on">${ic('Sound', 22)}</button></div></div></div>`;
}

function render(scrollEnd) {
  const ph = document.getElementById('ph');
  const prevScroll = ph.querySelector('.feed')?.scrollTop;
  let h = '';
  if (st.page === 'call') {
    h = `<div class="status">${'<span>14:23</span>'}${statusIcons()}</div>${callPage()}<div class="navh"></div>`;
    ph.innerHTML = h;
  } else {
    const topY = 40 + (st.callBar ? 36 : 0);
    const feed = st.empty ? emptyState() : st.feed.map(feedItem).join('');
    h = `<div class="feed" style="padding-top:${topY + 64}px${st.empty ? ";display:flex;flex-direction:column" : ""}">${feed}</div>
      <div class="topfade" style="top:${st.callBar ? 36 : 0}px"></div>
      <div class="status${st.callBar ? ' green' : ''}"><span>14:23</span>${statusIcons()}</div>
      ${st.callBar ? `<div class="callbar" data-act="toCall">${ic('Handset', 15)}<span>通话中 · 回到通话</span><span class="ck">3:12</span></div>` : ''}
      <div class="top" style="top:${topY}px"><button class="rb glass" title="菜单">${ic('Menu', 22)}</button><div class="tpill glass">Mika</div><button class="rb glass" data-act="menu" title="更多">${ic('More', 22)}</button></div>
      <div class="dock" id="dock">${trayHtml()}${pendHtml()}${composerHtml()}</div>
      <div id="pipslot"></div>${overlayHtml(topY)}<div class="navh"></div>`;
    ph.innerHTML = h;
    const dockH = document.getElementById('dock').offsetHeight;
    const f = ph.querySelector('.feed');
    f.style.paddingBottom = (dockH + (st.pip ? 24 : 16)) + 'px';
    document.getElementById('pipslot').outerHTML = pipHtml(dockH);
    if (scrollEnd && !st.empty) f.scrollTop = f.scrollHeight; else if (prevScroll != null) f.scrollTop = prevScroll;
    if (st.overlay === 'records') { const hl = f.querySelector('.cline.hl'); if (hl) f.scrollTop = hl.offsetTop - topY - 80; }
  }
  drawList(); drawNotes();
}

function drawList() {
  let html = '', g = '';
  SC.forEach(s => { if (s.g !== g) { g = s.g; html += `<div class="grp">${g}</div>`; } html += `<button class="sc${s.id === cur ? ' on' : ''}" data-sc="${s.id}"><b>${s.n}</b><span>${s.d}</span></button>`; });
  const l = document.getElementById('list');
  if (l.dataset.cur !== cur) { l.innerHTML = html; l.dataset.cur = cur; l.querySelector('.on')?.scrollIntoView({block:'nearest', inline:'nearest'}); }
}
function drawNotes() {
  const s = SC.find(x => x.id === cur);
  document.getElementById('notes').innerHTML = `<h2>${s.n}</h2><div class="d">${s.g} · ${s.d}</div>
    <h3>这一屏看什么</h3><ul>${s.look.map(x => `<li>${x}</li>`).join('')}</ul>
    ${s.ask ? `<h3>想听你的意见</h3><ul class="ask">${s.ask.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    <div class="try">样子照 app 现在的主题画；手机里能点的：进度条、小窗、⋯、绿条、按住麦克风。</div>`;
}

/* ---------- 交互 ---------- */
document.getElementById('list').addEventListener('click', e => { const b = e.target.closest('[data-sc]'); if (b) load(b.dataset.sc); });
document.getElementById('ph').addEventListener('click', e => {
  const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
  if (a === 'tray') { st.trayOpen = !st.trayOpen; render(); }
  else if (a === 'pip') { st.pipBig = !st.pipBig; render(); }
  else if (a === 'pipClose') { st.pip = null; render(); }
  else if (a === 'menu') { st.overlay = 'menu'; render(); }
  else if (a === 'close') { st.overlay = null; render(); }
  else if (a === 'records') { st.overlay = 'records'; render(); }
  else if (a === 'tasks') { st.overlay = 'tasks'; render(); }
  else if (a === 'goEmpty') load('empty');
  else if (a === 'toCall' || a === 'call') load('callPage');
  else if (a === 'collapse') load('inCall');
  else if (a === 'pick') load('run');
  else if (a === 'takeover') { st.pipBig = true; render(); }
  else if (a === 'stopTask') load('fail');
});
let holdY = null, holdPrev = null;
document.getElementById('ph').addEventListener('pointerdown', e => {
  if (!e.target.closest('[data-act="mic"]')) return;
  e.preventDefault(); holdY = e.clientY; holdPrev = st.hold; st.hold = 'listen'; render();
});
window.addEventListener('pointermove', e => {
  if (holdY == null) return;
  const next = holdY - e.clientY > 70 ? 'cancel' : 'listen';
  if (next !== st.hold) { st.hold = next; render(); }
});
window.addEventListener('pointerup', () => { if (holdY == null) return; holdY = null; st.hold = holdPrev; render(); });

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('tl').classList.toggle('on', t === 'light');
  document.getElementById('td').classList.toggle('on', t === 'dark');
  try { localStorage.setItem('mika-proto-theme', t); } catch (e) {}
}
document.getElementById('tl').onclick = () => setTheme('light');
document.getElementById('td').onclick = () => setTheme('dark');
let saved = null; try { saved = localStorage.getItem('mika-proto-theme'); } catch (e) {}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
const start = location.hash.slice(1);
load(SC.some(s => s.id === start) ? start : 'run');
</script>
