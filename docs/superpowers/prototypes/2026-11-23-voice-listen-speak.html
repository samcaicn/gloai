<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音听和说原型</title>
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --fill: rgba(0,0,0,.04);
    --ink: #1C1C1E; --ink2: #5F6068; --ink3: #9A9BA3; --hair: rgba(0,0,0,.07);
    --accent: #0A7CFF; --accent-soft: rgba(10,124,255,.10); --on-accent: #fff;
    --ok: #1F9D55; --ok-soft: rgba(31,157,85,.12);
    --warn: #B86E00; --warn-soft: rgba(255,159,10,.14);
    --bad: #E5483D; --bad-soft: rgba(229,72,61,.10);
    --page: #ECECEF; --frame: #1C1C1E; --note: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E0E10; --surface: #1A1A1D; --fill: rgba(255,255,255,.06);
      --ink: #F2F2F4; --ink2: #A4A5AD; --ink3: #6C6D75; --hair: rgba(255,255,255,.08);
      --accent: #3D97FF; --accent-soft: rgba(61,151,255,.16);
      --ok: #3CCF7A; --ok-soft: rgba(60,207,122,.14);
      --warn: #FFB340; --warn-soft: rgba(255,159,10,.16);
      --bad: #FF6961; --bad-soft: rgba(255,105,97,.14);
      --page: #050506; --frame: #2A2A2E; --note: #1A1A1D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0E10; --surface: #1A1A1D; --fill: rgba(255,255,255,.06);
    --ink: #F2F2F4; --ink2: #A4A5AD; --ink3: #6C6D75; --hair: rgba(255,255,255,.08);
    --accent: #3D97FF; --accent-soft: rgba(61,151,255,.16);
    --ok: #3CCF7A; --ok-soft: rgba(60,207,122,.14);
    --warn: #FFB340; --warn-soft: rgba(255,159,10,.16);
    --bad: #FF6961; --bad-soft: rgba(255,105,97,.14);
    --page: #050506; --frame: #2A2A2E; --note: #1A1A1D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  .top h1 { font-size: 22px; margin: 0 0 4px; }
  .top p { margin: 0 0 18px; color: var(--ink2); font-size: 14px; }
  .principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .pr { background: var(--note); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--ink2); }
  .pr b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
  .stage { display: flex; gap: 28px; align-items: flex-start; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { border: 0; background: var(--note); color: var(--ink2); border-radius: 20px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tab.on { background: var(--ink); color: var(--bg); }

  /* phone */
  .phone { flex: 0 0 auto; width: 372px; height: 780px; background: var(--frame); border-radius: 44px; padding: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .screen { width: 100%; height: 100%; background: var(--bg); border-radius: 35px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .status { height: 30px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 12px; font-weight: 600; color: var(--ink); }
  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px; }
  .back { width: 40px; height: 40px; border: 0; background: transparent; color: var(--ink); border-radius: 20px; cursor: pointer; font-size: 22px; line-height: 1; }
  .back:hover { background: var(--fill); }
  .bar h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .body { flex: 1; overflow-y: auto; padding: 0 16px 28px; }
  .body::-webkit-scrollbar { width: 0; }
  .lead { font-size: 13px; color: var(--ink2); margin: 0 4px 12px; }
  .label { font-size: 12.5px; color: var(--ink3); margin: 18px 6px 6px; font-weight: 600; }
  .card { background: var(--surface); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; cursor: default; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--hair); }
  .row.plain + .row.plain::before { left: 14px; }
  .row.tap { cursor: pointer; }
  .row.tap:hover { background: var(--fill); }
  .ico { flex: 0 0 26px; height: 26px; border-radius: 8px; background: var(--fill); display: grid; place-items: center; color: var(--ink2); }
  .ico svg { width: 16px; height: 16px; }
  .txt { flex: 1; min-width: 0; }
  .t { font-size: 15px; color: var(--ink); }
  .s { font-size: 12.5px; color: var(--ink2); margin-top: 1px; }
  .chev { color: var(--ink3); font-size: 18px; }
  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.mute { color: var(--ink2); background: var(--fill); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--fill); color: var(--ink2); }
  .tag.good { background: var(--ok-soft); color: var(--ok); }
  .radio { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink3); display: grid; place-items: center; }
  .radio.on { border-color: var(--accent); }
  .radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .mini { border: 0; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 14px; cursor: pointer; white-space: nowrap; }
  .mini:disabled { opacity: .5; cursor: default; }
  .probe { margin: 0 14px 12px 52px; font-size: 12.5px; border-radius: 10px; padding: 8px 10px; background: var(--fill); color: var(--ink2); display: none; }
  .probe.show { display: block; }
  .probe.ok { background: var(--ok-soft); color: var(--ok); }
  .foot { font-size: 12px; color: var(--ink3); margin: 10px 6px 0; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.ghost { background: var(--surface); color: var(--accent); }
  .switch { flex: 0 0 44px; height: 26px; border-radius: 13px; background: var(--ink3); position: relative; cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--ok); }
  .switch.on::after { left: 21px; }
  .field { padding: 10px 14px; position: relative; }
  .field + .field::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--hair); }
  .field label { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 4px; }
  .field input { width: 100%; border: 0; background: transparent; color: var(--ink); font-size: 15px; padding: 2px 0; outline: none; font-family: inherit; }
  .field input::placeholder { color: var(--ink3); }
  .seg { display: flex; gap: 6px; margin-top: 2px; }
  .seg button { flex: 1; border: 1px solid var(--hair); background: transparent; color: var(--ink2); border-radius: 10px; padding: 7px; font-size: 13px; cursor: pointer; }
  .seg button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .unlock { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; }
  .unlock b { font-size: 14.5px; }
  .unlock span { font-size: 12px; color: var(--ink2); }
  .where { font-size: 12px; color: var(--accent); padding: 0 14px 12px; cursor: pointer; }
  .preset { display: flex; gap: 12px; align-items: center; }
  .logo { flex: 0 0 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
  .slider { width: 100%; accent-color: var(--accent); }
  .empty { background: var(--surface); border-radius: 14px; padding: 18px 16px; text-align: center; }
  .empty .big { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .empty p { margin: 0; font-size: 13px; color: var(--ink2); }
  .result { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; position: relative; }
  .result + .result::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--hair); }
  .mark { flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .mark.ok { background: var(--ok-soft); color: var(--ok); }
  .mark.no { background: var(--fill); color: var(--ink3); }
  select.sel { border: 0; background: transparent; color: var(--ink2); font-size: 14px; font-family: inherit; text-align: right; cursor: pointer; }
  .toast { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 18px; opacity: 0; transition: all .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* notes */
  .notes { flex: 1; min-width: 0; }
  .note { background: var(--note); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
  .note h3 { margin: 0 0 8px; font-size: 16px; }
  .note p, .note li { font-size: 13.5px; color: var(--ink2); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }
  .note li { margin: 3px 0; }
  .note b { color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  th { color: var(--ink3); font-weight: 600; font-size: 12px; }
  td:first-child { color: var(--ink); white-space: nowrap; }
  td { color: var(--ink2); }
  @media (max-width: 860px) {
    .stage { flex-direction: column; align-items: center; }
    .phone { width: 100%; max-width: 372px; height: 760px; }
    .notes { width: 100%; }
  }
  .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vcard { background: var(--surface); border-radius: 14px; padding: 12px; cursor: pointer; }
  .vcard:hover { background: var(--fill); }
  .vcard .nm { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .caps { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .cap { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--fill); color: var(--ink3); }
  .cap.y { background: var(--accent-soft); color: var(--accent); }
  .done { margin-left: auto; white-space: nowrap; font-size: 10.5px; color: var(--ok); font-weight: 600; }
  .pipe { display: flex; align-items: center; gap: 4px; padding: 14px; font-size: 12px; color: var(--ink2); }
  .pipe .st { flex: 1; text-align: center; background: var(--fill); border-radius: 10px; padding: 8px 4px; }
  .pipe .st b { display: block; color: var(--ink); font-size: 13px; }
  .pipe .ar { color: var(--ink3); }
  .vhead { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
  .vhead .logo { flex-basis: 26px; height: 26px; border-radius: 8px; font-size: 12px; }
  .vhead b { font-size: 14.5px; }
  .vhead span { font-size: 11.5px; color: var(--ink3); }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 9px 14px 9px 50px; cursor: pointer; }
  .mrow:hover { background: var(--fill); }
  .mrow .radio { flex-basis: 20px; height: 20px; }
  .card + .card.grp { margin-top: 10px; }
  .now { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .now .k { font-size: 11.5px; color: var(--ink3); }
  .now .v { font-size: 15px; font-weight: 600; }
  .legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink2); margin: 0 4px 10px; }
  .legend i { font-style: normal; background: var(--surface); border-radius: 6px; padding: 1px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>语音 + AI 接打电话 · 原型</h1>
    <p>和大模型一样分两层：<b>服务商</b>是你填 Key 的账号，<b>模型</b>是这家账号下能用的具体模型。一家服务商下面可能同时有识别模型、合成模型、实时模型。</p>
  </div>
  <div class="principles">
    <div class="pr"><b>服务商填一次 Key</b>在「语音服务」里接入一家，它下面所有识别、合成、实时模型就都能用了。</div>
    <div class="pr"><b>选的是模型</b>「听」「说」页里按服务商分组列模型，组头是服务商，下面一行一个模型，选中的是模型。</div>
    <div class="pr"><b>通话 = 听 → 想 → 说</b>对方静音几秒没新字算说完 → 聊天模型出文字 → 按逗号句号分段合成播放。</div>
    <div class="pr"><b>实时语音收进高级</b>通话方式默认「标准」；要能随时打断的实时模型再切「实时」。</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<script>
const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6.4 5.2a9.1 9.1 0 0 1 12.4 12.4 2.5 2.5 0 0 1-2.5-4.3 4.1 4.1 0 0 0-5.6-5.6 2.5 2.5 0 0 1-4.3-2.5z"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1 4.5 1 6 0"/></svg>',
  device: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
};

/* ---------- 内置服务商，每家下面挂模型。live=边说边出字/边生成边读 ---------- */
const L = (name, live) => ({ name, live });
const VENDORS = [
  { id: 'device', name: '本机', c: '#8E8E93', builtin: true, fields: [],
    stt: [L('手机自带识别', 1)], tts: [L('手机自带合成', 0)], rt: [], voices: ['默认'] },
  { id: 'bailian', name: '阿里云百炼', c: '#FF6A00', chat: true, fields: ['API Key', '地域'],
    stt: [L('Fun-ASR 实时', 1), L('Paraformer 实时 v2', 1), L('千问 ASR', 0)], tts: [L('CosyVoice v3', 1), L('千问 TTS', 1)], rt: [L('千问 Omni 实时', 1)], voices: ['龙小淳', '龙婉', '龙城'] },
  { id: 'volc', name: '火山引擎', c: '#3370FF', fields: ['API Key'],
    stt: [L('豆包流式识别 2.0', 1), L('豆包录音文件识别', 0)], tts: [L('豆包语音合成 2.0', 1)], rt: [L('豆包实时语音', 1)], voices: ['温柔女声', '沉稳男声', '活泼少女'] },
  { id: 'minimax', name: 'MiniMax', c: '#E5484D', fields: ['API Key', '国内 / 海外'],
    stt: [], tts: [L('Speech 2.6 HD', 1), L('Speech 2.6 Turbo', 1)], rt: [], voices: ['青涩青年', '成熟女性', '甜美女性'] },
  { id: 'openai', name: 'OpenAI', c: '#10A37F', chat: true, fields: ['API Key'],
    stt: [L('gpt-4o-transcribe', 0), L('gpt-4o-mini-transcribe', 0), L('whisper-1', 0)], tts: [L('gpt-4o-mini-tts', 1), L('tts-1', 1)], rt: [L('gpt-realtime', 1)], voices: ['alloy', 'nova', 'verse'] },
  { id: 'gemini', name: 'Gemini', c: '#4285F4', chat: true, fields: ['API Key'],
    stt: [L('2.5 Flash', 0)], tts: [L('2.5 Flash TTS', 0), L('2.5 Pro TTS', 0)], rt: [L('Live 2.5 Flash', 1)], voices: ['Kore', 'Puck', 'Charon'] },
  { id: 'silicon', name: '硅基流动', c: '#7C3AED', fields: ['API Key'],
    stt: [L('SenseVoiceSmall', 0)], tts: [L('CosyVoice2', 1)], rt: [], voices: ['alex', 'anna', 'bella'] },
  { id: 'zhipu', name: '智谱', c: '#2D5BFF', fields: ['API Key'],
    stt: [L('GLM-ASR', 0)], tts: [L('GLM-TTS', 0)], rt: [], voices: ['彤彤', '小陈'] },
  { id: 'tencent', name: '腾讯云', c: '#006EFF', fields: ['SecretId', 'SecretKey'],
    stt: [L('实时识别 16k', 1), L('实时识别 8k 电话', 1)], tts: [L('精品音色合成', 1)], rt: [], voices: ['智瑜', '智聆'] },
  { id: 'xfyun', name: '讯飞开放平台', c: '#1E66F5', fields: ['APPID', 'APIKey', 'APISecret'],
    stt: [L('实时语音转写', 1)], tts: [L('超拟人合成', 1)], rt: [], voices: ['小燕', '许久'] },
  { id: 'azure', name: 'Azure 语音', c: '#0078D4', fields: ['Key', '区域'],
    stt: [L('实时转写', 1)], tts: [L('神经网络语音', 1)], rt: [], voices: ['晓晓', '云希'] },
  { id: 'eleven', name: 'ElevenLabs', c: '#111111', fields: ['API Key'],
    stt: [L('Scribe v1', 0)], tts: [L('Multilingual v2', 1), L('Flash v2.5', 1)], rt: [], voices: ['Rachel', 'Adam'] },
  { id: 'deepgram', name: 'Deepgram', c: '#13A870', fields: ['API Key'],
    stt: [L('Nova-3', 1)], tts: [L('Aura 2', 1)], rt: [], voices: ['asteria', 'orion'] },
  { id: 'groq', name: 'Groq', c: '#F55036', fields: ['API Key'],
    stt: [L('whisper-large-v3', 0), L('whisper-large-v3-turbo', 0)], tts: [], rt: [], voices: [] },
];
const V = id => VENDORS.find(v => v.id === id);
const BUILTIN = VENDORS.filter(v => !v.builtin);

/* 选中项 = { v: 服务商, m: 模型下标 } */
const state = {
  added: {}, stt: { v: 'device', m: 0 }, tts: { v: 'device', m: 0 }, rt: { v: 'openai', m: 0 },
  voice: '默认', speed: 1.0, autoRead: false,
  engine: 'standard', think: 'light', silence: 1.5, bargeIn: true,
  callFollow: true, callEngine: 'standard',
  form: 'minimax', vendor: 'bailian',
};
const usable = v => v.builtin || v.chat || state.added[v.id];
const src = v => v.builtin ? '免费' : v.chat ? '用聊天账号的 Key' : '已接入';
const modelOf = (kind, sel = state[kind]) => V(sel.v)[kind][sel.m];
const selName = kind => `${V(state[kind].v).name} · ${modelOf(kind).name}`;
const liveTag = (kind, m) => kind === 'stt' ? (m.live ? ['边说边出字', 'good'] : ['说完再转']) : kind === 'tts' ? (m.live ? ['边生成边读', 'good'] : ['按句合成']) : ['能打断', 'good'];

const SCREENS = {
  home: { title: '模型', tab: '① 总入口' },
  stt: { title: '听 · 语音识别', tab: '② 听：选模型' },
  tts: { title: '说 · 语音合成', tab: '③ 说：选模型' },
  talk: { title: '通话方式', tab: '④ 通话方式' },
  rt: { title: '实时语音模型', tab: '⑤ 实时（高级）' },

  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1600);
}
function row({ icon, title, sub, right = '', tap, cls = '' }) {
  return `<div class="row ${tap ? 'tap' : ''} ${icon ? '' : 'plain'} ${cls}" ${tap ? `onclick="${tap}"` : ''}>

}

function modelPicker(kind, label) {
  return VENDORS.filter(v => usable(v) && v[kind].length).map(v => `
    <div class="card grp">
      <div class="vhead">${logo(v)}<b>${v.name}</b><span>${src(v)}</span></div>
      ${v[kind].map((m, i) => {

        const [t, c] = liveTag(kind, m);
        return `<div class="mrow" onclick="pick('${kind}','${v.id}',${i})"><div class="radio ${on ? 'on' : ''}"></div>

    </div>`).join('');

function pick(kind, v, m) {
  state[kind] = { v, m };

function probe(btn, kind) {
  const old = btn.textContent; btn.disabled = true;
  btn.textContent = kind === 'stt' ? '请说一句…' : kind === 'tts' ? '播放中…' : '连接中…';
  setTimeout(() => { btn.textContent = '✓ 正常'; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1400); }, 1100);
}

    <tr><td>声音</td><td>只能实时语音，要单独配火山</td><td>默认跟随语音设置的听和说</td></tr>
    <tr><td>开场白、时长</td><td>设置里「通话配置」弹窗</td><td>开场白放进接电话；时长放进「接起来怎么说」</td></tr></table></div>`,
  phoneLive: `<div class="note"><h3>⑫ 通话中</h3><ul>
    <li>顶上「听 / 想 / 说」三格亮哪格，就是 Mika 现在在干什么，等的时候不会以为卡住了。</li>
    <li>按钮还是「我来接 / 按键 / 挂断」。</li></ul></div>`,
  phoneSetup: `<div class="note"><h3>⑬ 准备清单</h3><ul>
    <li>听和说、电话权限和通知、音频助手、实测一通电话、后台待命，一页按顺序列完，每项旁边就是去做的按钮。</li>
    <li><b>新的坑</b>：手机自带识别只能听麦克风，<b>听不到电话里对方的声音</b>。「听」是手机自带时这里会提示给电话换一个在线识别模型。</li>
    <li>点「去设置」能模拟完成，看就绪卡怎么变。</li></ul></div>`,
  phoneSettings: `<div class="note"><h3>⑭ 电话设置（⚙）</h3><ul>
    <li>只放不常动的：电话用的听和说、准备清单、通话音频、默认 SIM、摘要开关、清空记录、停用。</li>
    <li>不再有「启用 AI 电话」大开关：做完准备清单就是启用；不想用了在最下面停用。</li></ul></div>`,
  callVoice: `<div class="note"><h3>⑮ 电话用的听和说</h3><ul>
    <li>默认跟随语音设置。选「电话单独设置」后，下拉框按服务商分组选模型。</li>
    <li>电话的「听」不列手机自带识别。</li></ul></div>`,
  callAudio: `<div class="note"><h3>⑯ 通话音频</h3><ul>
    <li>多一个「自动」：按系统公开能力检测，检测不到用转接。</li>
    <li>实测按钮直接写成结论句「打完测试电话，两边都听得见」，点了就算实测通过。</li></ul></div>`,
  phoneRules: `<div class="note"><h3>⑰ 接谁的电话</h3><ul>
    <li>范围四选一、响几秒后接、始终由本人接听，都在一页。</li></ul></div>`,
  phoneTalk: `<div class="note"><h3>⑱ 接起来怎么说</h3><ul>
    <li>开场白、接听交代、最长时长放一起，都是「AI 在电话里怎么表现」。</li></ul></div>`,
  phoneRecord: `<div class="note"><h3>⑲ 记录详情</h3><ul>
    <li>摘要（结论 / 待办 / 未确认）在上，原文在下。</li>
    <li>「回拨并交代」把这通电话带进打电话的任务单。</li></ul></div>`,
};

function render() {
  const s = SCREENS[current];
  const body = RENDER[current]();
  document.getElementById('screen').innerHTML = `
    <div class="status"><span>9:41</span><span>●●● 100%</span></div>
    <div class="bar">${current === 'home' ? '<span style="width:8px"></span>' : '<button class="back" onclick="back()" aria-label="返回">‹</button>'}<h2 style="flex:1">${s.title}</h2>${s.gear ? `<button class="back" onclick="go('phoneSettings')" aria-label="设置" style="font-size:18px">⚙</button>` : ''}</div>
    <div class="body">${body}</div>
    <div class="toast"></div>`;
  document.getElementById('notes').innerHTML = NOTES[current];
  document.getElementById('tabs').innerHTML = Object.entries(SCREENS).map(([id, v]) =>
    `<button class="tab ${id === current ? 'on' : ''}" onclick="navStack.length=0;go('${id}',false)">${v.tab}</button>`).join('');
}
render();
</script>
</body>
</html>
