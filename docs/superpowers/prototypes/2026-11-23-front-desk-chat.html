<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前台聊天原型</title>
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --fill: rgba(0,0,0,.04);
    --ink: #1C1C1E; --ink2: #5F6068; --ink3: #9A9BA3; --hair: rgba(0,0,0,.07);
    --accent: #0A7CFF; --accent-soft: rgba(10,124,255,.10); --on-accent: #fff;
    --ok: #1F9D55; --ok-soft: rgba(31,157,85,.12);
    --warn: #B86E00; --warn-soft: rgba(255,159,10,.14);
    --bad: #E5483D; --bad-soft: rgba(229,72,61,.10);
    --page: #ECECEF; --frame: #1C1C1E; --note: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E0E10; --surface: #1A1A1D; --fill: rgba(255,255,255,.06);
      --ink: #F2F2F4; --ink2: #A4A5AD; --ink3: #6C6D75; --hair: rgba(255,255,255,.08);
      --accent: #3D97FF; --accent-soft: rgba(61,151,255,.16);
      --ok: #3CCF7A; --ok-soft: rgba(60,207,122,.14);
      --warn: #FFB340; --warn-soft: rgba(255,159,10,.16);
      --bad: #FF6961; --bad-soft: rgba(255,105,97,.14);
      --page: #050506; --frame: #2A2A2E; --note: #1A1A1D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0E10; --surface: #1A1A1D; --fill: rgba(255,255,255,.06);
    --ink: #F2F2F4; --ink2: #A4A5AD; --ink3: #6C6D75; --hair: rgba(255,255,255,.08);
    --accent: #3D97FF; --accent-soft: rgba(61,151,255,.16);
    --ok: #3CCF7A; --ok-soft: rgba(60,207,122,.14);
    --warn: #FFB340; --warn-soft: rgba(255,159,10,.16);
    --bad: #FF6961; --bad-soft: rgba(255,105,97,.14);
    --page: #050506; --frame: #2A2A2E; --note: #1A1A1D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  .top h1 { font-size: 22px; margin: 0 0 4px; }
  .top p { margin: 0 0 18px; color: var(--ink2); font-size: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { border: 0; background: var(--note); color: var(--ink2); border-radius: 20px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tab.on { background: var(--ink); color: var(--bg); }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }

  .phone { flex: 0 0 auto; width: 372px; max-width: 100%; height: 780px; background: var(--frame); border-radius: 44px; padding: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .screen { width: 100%; height: 100%; background: var(--bg); border-radius: 35px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .status { height: 30px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 12px; font-weight: 600; }
  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 4px 14px 8px; font-weight: 600; font-size: 16px; }
  .bar .sp { flex: 1; }
  .ico { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; color: var(--ink2); }
  .feed { flex: 1; overflow-y: auto; padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }

  .me { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 18px 18px 6px 18px; font-size: 14.5px; }
  .desk { align-self: flex-start; max-width: 88%; font-size: 14.5px; color: var(--ink); }
  .desk .tool { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink3); background: var(--fill); border-radius: 10px; padding: 1px 8px; margin-bottom: 4px; }
  .typing::after { content: "▍"; color: var(--ink3); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--hair); background: var(--surface); border-radius: 16px; padding: 4px 10px; font-size: 13px; color: var(--ink); cursor: pointer; }

  .card { align-self: stretch; background: var(--surface); border-radius: 14px; padding: 10px 12px; border: 1px solid var(--hair); font-size: 13px; }
  .card .h { display: flex; align-items: center; gap: 8px; }
  .card .t { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 11.5px; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .p-run { background: var(--accent-soft); color: var(--accent); }
  .p-ask { background: var(--warn-soft); color: var(--warn); }
  .p-ok { background: var(--ok-soft); color: var(--ok); }
  .p-q { background: var(--fill); color: var(--ink2); }
  .card .line { color: var(--ink2); margin-top: 4px; }
  .card .steer { margin-top: 6px; font-size: 12px; color: var(--ink3); }
  .card .steer b { color: var(--ink2); font-weight: 500; }
  .card .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btn { border: 0; border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .btn.pri { background: var(--accent); color: var(--on-accent); }
  .btn.sec { background: var(--fill); color: var(--ink); }
  .spin { width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: rot .9s linear infinite; flex: 0 0 auto; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .tray { flex: 0 0 auto; padding: 0 14px 6px; display: flex; gap: 6px; }
  .tray .chip { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .composer { flex: 0 0 auto; margin: 0 10px 14px; background: var(--surface); border-radius: 24px; border: 1px solid var(--hair); display: flex; align-items: center; padding: 6px 6px 6px 14px; gap: 6px; }
  .composer .in { flex: 1; color: var(--ink3); font-size: 14.5px; }
  .round { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; background: var(--fill); color: var(--ink2); font-size: 15px; }
  .round.go { background: var(--accent); color: var(--on-accent); }

  .side { flex: 1; min-width: 280px; max-width: 560px; }
  .note { background: var(--note); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 14px; color: var(--ink2); }
  .note b { color: var(--ink); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }
  .ctrl { display: flex; gap: 8px; margin-bottom: 12px; }
  .ctrl button { border: 0; border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; background: var(--ink); color: var(--bg); }
  .ctrl button.ghost { background: var(--note); color: var(--ink2); }
  .ctrl .n { align-self: center; font-size: 13px; color: var(--ink3); }

  /* call */
  .call { background: #101014; color: #F2F2F4; }
  .call .feed { gap: 8px; }
  .call .me { background: rgba(255,255,255,.14); color: #fff; }
  .call .desk { color: #F2F2F4; }
  .call .card { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.08); color: #ddd; }
  .call .card .line { color: #aaa; }
  .ball { flex: 0 0 auto; display: grid; place-items: center; padding: 10px 0 4px; }
  .ball div { width: 88px; height: 88px; border-radius: 44px; background: radial-gradient(circle at 35% 35%, #6AB4FF, #0A5CCF); box-shadow: 0 0 40px rgba(61,151,255,.45); }
  .callbar { flex: 0 0 auto; display: flex; justify-content: center; gap: 28px; padding: 10px 0 24px; }
  .callbar span { width: 54px; height: 54px; border-radius: 27px; display: grid; place-items: center; background: rgba(255,255,255,.12); font-size: 20px; }
  .callbar span.end { background: #E5483D; }
  .hint { text-align: center; font-size: 12px; color: #8a8b93; padding-bottom: 4px; }
  @media (max-width: 420px) { .phone { width: 100%; height: 720px; border-radius: 30px; } .screen { border-radius: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>前台聊天原型</h1>
    <p>你在对话里只跟前台说话：它当场回你，要动手机的事派给后台，后台以任务卡的形式穿插在对话里。点「下一步」一步步看。</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>
    <div class="side">
      <div class="ctrl"><button id="next">下一步</button><button class="ghost" id="reset">从头看</button><span class="n" id="count"></span></div>
      <div class="note" id="note"></div>
      <div class="note">
        <b>和现在比，聊天页变了什么</b>
        <ul>
          <li>气泡里说话的是前台。<b>它先回话</b>，不再只是一张任务卡在跑。</li>
          <li>后台任务是对话里的一张<b>任务卡</b>：在做什么、要你回答、做完的结果都在卡上，点开就是现在的任务详情。</li>
          <li><b>输入框旁边去掉了「插话 / 排队」开关。</b>你说的话交给前台，由它判断是补给正在办的事、新开一件，还是自己就能答。</li>
          <li>输入框上方有一条「<b>N 件在办</b>」，点开是任务列表；没有任务时不出现。</li>
          <li>需要确认、接管的步骤，<b>卡片和按钮跟现在一样</b>，前台只负责提醒你。</li>
        </ul>
      </div>
    </div>
  </div>
</div>
<script>
const SC = {
  chat: {
    name: "办事时接着聊",
    note: "<b>派活以后可以接着聊。</b>前台回一句，任务卡开始跑；你接着问汇率，前台自己联网查了直接答，不开新任务。后来你说「改成三个人」，前台判断这是补给正在办的那件事。",
    steps: [
      { me: "帮我在美团订明天中午 12 点的日料，两个人，附近评分高的" },
      { desk: "好，我让后面去订，先挑附近评分高的几家。" , card: { id: "a", t: "订明天 12:00 日料 · 2 人", s: "run", line: "正在美团搜索附近日料…" } },
      { me: "对了，今天美元汇率多少？" },
      { desk: "今天 1 美元约合 7.12 元人民币（中间价）。订餐那边还在挑店。", tool: "联网搜索" },
      { me: "订餐改成三个人吧" },
      { desk: "好，已经告诉后面改成 3 个人。", update: { id: "a", t: "订明天 12:00 日料 · 3 人", line: "比较 3 家店的空位…", steer: "改成三个人" } },
    ],
  },
  ask: {
    name: "后台要你回答",
    note: "<b>后台卡住要人回答时，前台直接在对话里问你。</b>卡片变成「要你回答」，可选项做成按钮，点了或者直接打字回都行。你的原话会原样交回后台。",
    steps: [
      { pre: [{ me: "帮我在美团订明天中午 12 点的日料，三个人" }, { desk: "好，我让后面去订。", card: { id: "a", t: "订明天 12:00 日料 · 3 人", s: "run", line: "比较 3 家店的空位…" } }] },
      { desk: "有两家明天 12 点有空位：鮨一（4.8 分，人均 260）和 隐泉（4.6 分，人均 180）。订哪家？", chips: ["鮨一", "隐泉"], update: { id: "a", s: "ask", line: "等你选店" } },
      { me: "鮨一" },
      { desk: "好，订鮨一。", update: { id: "a", s: "run", line: "正在提交预订…" } },
    ],
  },
  confirm: {
    name: "要你确认 / 办完",
    note: "<b>确认、付款这类步骤走原来的卡片按钮</b>，前台不替你同意，只提醒一句。办完后由前台说一次结果，卡片收起来显示结论。",
    steps: [
      { pre: [{ desk: "好，订鮨一。", card: { id: "a", t: "订明天 12:00 日料 · 3 人", s: "run", line: "正在提交预订…" } }] },
      { desk: "要付 100 元订金，这一步需要你在卡片上点确认。", update: { id: "a", s: "ask", line: "等你确认付订金 ¥100", confirm: true } },
      { update: { id: "a", s: "run", line: "已确认，正在付款…", confirm: false } },
      { desk: "订好了：鮨一，明天 12:00，3 位，已付订金 100 元。订单详情在卡片里。", update: { id: "a", s: "ok", line: "已预订 · 鮨一 明天 12:00 · 3 位" } },
    ],
  },
  multi: {
    name: "同时办两件",
    note: "<b>一个对话可以同时挂几件事。</b>输入框上方出现「2 件在办」。手机同时只能跑一件时（安卓 14 以下或内存小），第二件显示「排队中」，前台会告诉你排在第几个。",
    steps: [
      { pre: [{ me: "帮我在美团订明天中午 12 点的日料，三个人" }, { desk: "好，我让后面去订。", card: { id: "a", t: "订明天 12:00 日料 · 3 人", s: "run", line: "比较 3 家店的空位…" } }] },
      { me: "再帮我给王姐发微信，说明天的会改到下午三点" },
      { desk: "好，这件也交给后面了。订餐那件还在办，这件排在它后面，第 2 个。", card: { id: "b", t: "微信告诉王姐：会议改到 15:00", s: "q", line: "排队中 · 第 2 个" } },
      { update: { id: "a", s: "ok", line: "已预订 · 鮨一 明天 12:00 · 3 位" }, desk: "订餐办好了：鮨一，明天 12:00。现在开始发微信。" },
      { update: { id: "b", s: "run", line: "正在打开微信…" } },
    ],
  },
  call: {
    name: "语音通话里",
    call: true,
    note: "<b>语音通话是同一个前台</b>，只是说出来。你说话只会打断它这句话，不会取消后台的任务。进度挑重点讲，卡片显示在通话的对话流里。挂断以后任务继续，结果写回这条会话。",
    steps: [
      { me: "帮我订明天中午的日料，三个人" },
      { desk: "好，我让后面去订。", card: { id: "a", t: "订明天 12:00 日料 · 3 人", s: "run", line: "比较几家店的空位…" } },
      { me: "今天天气怎么样？" },
      { desk: "今天多云，15 到 22 度，下午可能有小雨。", tool: "联网搜索" },
      { desk: "订餐那边问：鮨一和隐泉都有位，订哪家？", update: { id: "a", s: "ask", line: "等你选店" } },
      { me: "鮨一" },
      { desk: "好的。", update: { id: "a", s: "run", line: "正在提交预订…" } },
    ],
  },
};
const ORDER = ["chat", "ask", "confirm", "multi", "call"];
let cur = "chat", step = 0, feed = [], cards = {};

function pillOf(s) {
  return { run: '<span class="pill p-run">在办</span>', ask: '<span class="pill p-ask">要你处理</span>', ok: '<span class="pill p-ok">办完了</span>', q: '<span class="pill p-q">排队中</span>' }[s];
}
function cardHtml(c) {
  return `<div class="card"><div class="h">${c.s === "run" ? '<div class="spin"></div>' : ""}<div class="t">${c.t}</div>${pillOf(c.s)}</div>
    <div class="line">${c.line}</div>${c.steer ? `<div class="steer">已加入：<b>${c.steer}</b></div>` : ""}
    ${c.confirm ? '<div class="btns"><button class="btn pri">确认付款</button><button class="btn sec">不付</button></div>' : ""}</div>`;
}
function apply(st) {
  (st.pre || []).forEach(apply);
  if (st.me) feed.push({ k: "me", v: st.me });
  if (st.update) Object.assign(cards[st.update.id], st.update);
  if (st.desk) feed.push({ k: "desk", v: st.desk, tool: st.tool, chips: st.chips });
  if (st.card) { cards[st.card.id] = { ...st.card }; feed.push({ k: "card", id: st.card.id }); }
}
function render() {
  const sc = SC[cur];
  feed = []; cards = {};
  for (let i = 0; i < step; i++) apply(sc.steps[i]);
  const lastDesk = feed.map(f => f.k).lastIndexOf("desk");
  const rows = feed.map((f, i) => {
    if (f.k === "me") return `<div class="me">${f.v}</div>`;
    if (f.k === "card") return cardHtml(cards[f.id]);
    return `<div class="desk">${f.tool ? `<div class="tool">🔍 ${f.tool}</div><br>` : ""}<span class="${i === lastDesk && step < sc.steps.length ? "" : ""}">${f.v}</span>
      ${f.chips ? `<div class="chips">${f.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>` : ""}</div>`;
  }).join("");
  const active = Object.values(cards).filter(c => c.s !== "ok").length;
  const ask = Object.values(cards).some(c => c.s === "ask");
  const tray = active ? `<div class="tray"><span class="chip">${ask ? "⚠️" : '<span class="spin"></span>'} ${active} 件在办${ask ? " · 1 件要你处理" : ""} ›</span></div>` : "";
  const s = document.getElementById("screen");
  if (sc.call) {
    s.className = "screen call";
    s.innerHTML = `<div class="status"><span>9:41</span><span>通话中 01:12</span></div>
      <div class="ball"><div></div></div><div class="hint">${step && feed[feed.length - 1]?.k === "me" ? "在想…" : "在听…"}</div>
      <div class="feed" id="f">${rows}</div>${tray}
      <div class="callbar"><span>🔇</span><span>⌨️</span><span class="end">📞</span></div>`;
  } else {
    s.className = "screen";
    s.innerHTML = `<div class="status"><span>9:41</span><span>●●● 5G</span></div>
      <div class="bar"><span class="ico">☰</span><span>Mika</span><span class="sp"></span><span class="ico">🎧</span></div>
      <div class="feed" id="f">${rows || '<div class="desk" style="color:var(--ink3)">有什么要我做的？</div>'}</div>${tray}
      <div class="composer"><span class="round">＋</span><span class="in">和 Mika 说点什么</span><span class="round">🎤</span><span class="round go">↑</span></div>`;
  }
  const f = document.getElementById("f"); f.scrollTop = f.scrollHeight;
  document.getElementById("note").innerHTML = sc.note;
  document.getElementById("count").textContent = `${step} / ${sc.steps.length}`;
  document.getElementById("next").disabled = step >= sc.steps.length;
  document.getElementById("next").style.opacity = step >= sc.steps.length ? .4 : 1;
  document.getElementById("tabs").innerHTML = ORDER.map(k => `<button class="tab ${k === cur ? "on" : ""}" data-k="${k}">${SC[k].name}</button>`).join("");
}
document.getElementById("tabs").onclick = e => { const k = e.target.dataset.k; if (k) { cur = k; step = SC[k].steps[0].pre ? 1 : 0; render(); } };
document.getElementById("next").onclick = () => { if (step < SC[cur].steps.length) { step++; render(); } };
document.getElementById("reset").onclick = () => { step = SC[cur].steps[0].pre ? 1 : 0; render(); };
render();
</script>
</body>
</html>
