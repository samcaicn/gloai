[package]
name = "bbt-zb-tauri"
version = "0.2.5"
description = "BBT-ZB 控制台 — 基于 WeAuto 骨架的 Tauri 2 桌面客户端"
authors = ["zhifu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bbt_zb_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ed25519-dalek = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# iLink 协议（移植自 openilink/openilink-sdk-go，MIT）
aes = "0.8"
ecb = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
base64 = "0.22"
md-5 = "0.10"
rand = "0.8"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hmac = "0.12"

# 防破解：设备指纹读 MachineGuid（仅 Windows）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
default = []
# 生产模式开关：启用后 Tauri 内嵌 frontendDist（否则 dev 模式加载 devUrl localhost:5173，
# 直接 cargo run 会白屏/显示"localhost 拒绝连接"错误页）。tauri build 会自动带上。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
