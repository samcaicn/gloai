<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="1"/>
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGlow)"/>

  <!-- Neon ring -->
  <rect x="48" y="48" width="928" height="928" rx="190" ry="190"
        fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.55"/>

  <!-- T letter (chunky, chamfered) -->
  <g filter="url(#neonGlow)">
    <!-- Horizontal bar with chamfered inner corners -->
    <path d="
      M 200 256
      L 824 256
      L 824 392
      L 612 392
      L 612 824
      L 412 824
      L 412 392
      L 200 392
      Z" fill="url(#tgrad)"/>
  </g>

  <!-- Inner highlight stroke -->
  <path d="
    M 200 256
    L 824 256
    L 824 392
    L 612 392
    L 612 824
    L 412 824
    L 412 392
    L 200 392
    Z"
    fill="none" stroke="#e6fcff" stroke-width="3" opacity="0.55"/>

  <!-- Top accent line -->
  <rect x="216" y="226" width="592" height="6" rx="3" fill="#00f0ff" opacity="0.7" filter="url(#softGlow)"/>

  <!-- Vertical spine inner accent -->
  <rect x="503" y="412" width="18" height="382" rx="9" fill="#f0fdff" opacity="0.42"/>

  <!-- Subtle base shadow -->
  <ellipse cx="512" cy="852" rx="220" ry="14" fill="#000000" opacity="0.45"/>
</svg>
