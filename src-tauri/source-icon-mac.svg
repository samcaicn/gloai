<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background: macOS Big Sur+ squircle mask applies automatically -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- Soft glow halo behind T (so the icon isn't lost on dark macOS tintables) -->
  <ellipse cx="512" cy="500" rx="440" ry="380" fill="#0a0a12" opacity="0.55" filter="url(#softGlow)"/>

  <!-- T letter (large, chamfered) -->
  <g filter="url(#neonGlow)">
    <path d="
      M 140 180
      L 884 180
      L 884 320
      L 612 320
      L 612 860
      L 412 860
      L 412 320
      L 140 320
      Z" fill="url(#tgrad)"/>
  </g>

  <!-- Inner highlight stroke -->
  <path d="
    M 140 180
    L 884 180
    L 884 320
    L 612 320
    L 612 860
    L 412 860
    L 412 320
    L 140 320
    Z"
    fill="none" stroke="#e6fcff" stroke-width="3" opacity="0.55"/>

  <!-- Top accent line -->
  <rect x="156" y="148" width="712" height="7" rx="3.5" fill="#00f0ff" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Vertical spine inner accent -->
  <rect x="503" y="340" width="18" height="500" rx="9" fill="#f0fdff" opacity="0.42"/>

  <!-- Subtle base shadow -->
  <ellipse cx="512" cy="880" rx="240" ry="14" fill="#000000" opacity="0.4"/>
</svg>
