name: AI智播 — 体检 + Web热更新产物 + 正式签名APK构建

# 三条腿：
#   1. check    —— 结构体检（入口/产品名/HTML 标签括号）。
#   2. package  —— web 热更新产物（index.html + 版本指纹），供热替换分发。
#   3. apk      —— 打 release 正式包：复用 weauto/jev 同仓库的 SIGNING_* secrets
#                  解码 keystore.p12 → 签名 → apksigner verify 校验。
#                  不产 debug 包；管理后台另存 admin/index.html 供部署 /admin。
#
# 热更新链路：
#   web —— push → artifact(ai-zhibo-web) → 分发端按 version/sha256 热替换 index.html
#   apk —— push → artifact(ai-zhibo-apk-release) → 下载安装；壳优先加载 files/index.html。
on:
  push:
    branches: ['aizhibo']
  pull_request:
    branches: ['aizhibo']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aizhibo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 原型结构体检
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验入口文件与产品标识
        shell: bash
        run: |
          set -e
          [ -s index.html ] || { echo "FAIL: 缺少 index.html"; exit 1; }
          [ -s version.json ] || { echo "FAIL: 缺少 version.json"; exit 1; }
          grep -q "AI智播" index.html || { echo "FAIL: index.html 未标记产品名 AI智播"; exit 1; }
          echo "OK: 入口文件与产品标识校验通过"

      - name: 校验 HTML 结构完整性
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re, json, sys
          html = open('index.html', encoding='utf-8').read()
          errs = []
          for tag in ('script', 'style'):
            o = len(re.findall(r'<%s[ >]' % tag, html))
            c = len(re.findall(r'</%s>' % tag, html))
            if o != c:
              errs.append('<%s> 未闭合: %d 开 / %d 闭' % (tag, o, c))
          for a, b in (('{','}'), ('(',')'), ('[',']')):
            if html.count(a) != html.count(b):
              errs.append('括号不匹配: %s%d / %s%d' % (a, html.count(a), b, html.count(b)))
          v = json.load(open('version.json', encoding='utf-8'))
          assert v.get('product') == 'AI智播', 'version.json 产品名错误'
          if errs:
            print('FAIL:', '; '.join(errs)); sys.exit(1)
          print('OK: HTML 结构通过，版本', v.get('version'), '（%d 字符）' % len(html))
          PY

  package:
    name: Web热更新产物
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成版本清单 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, datetime
          v = json.load(open('version.json', encoding='utf-8'))
          html = open('index.html', 'rb').read()
          manifest = {
            "product": v['product'],
            "version": v['version'],
            "entry": v['entry'],
            "sha256": hashlib.sha256(html).hexdigest(),
            "size": len(html),
            "built_at": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
            "commit": "${{ github.sha }}"
          }
          json.dump(manifest, open('manifest.json', 'w'), ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload Artifact (web 热更新产物)
        uses: actions/upload-artifact@v4
        with:
          name: ai-zhibo-web
          path: |
            index.html
            admin/index.html
            version.json
            manifest.json
          retention-days: 90

  apk:
    name: 构建正式签名APK
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: 同步用户端原型到 assets（防两个 index.html 不一致）
        shell: bash
        run: |
          cp index.html app/src/main/assets/index.html
          echo "synced: $(md5sum index.html app/src/main/assets/index.html)"

      # 签名密钥：guard 必须放在 shell 内部，不能放 if: —— secrets 上下文在
      # workflow 启动阶段的 if: 里不可靠（jev 踩过的坑）。
      - name: Decode and validate signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -eu
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::仓库密钥 SIGNING_KEY 未配置，无法产出正式签名包（本工作流只出 release，直接失败）"
            exit 1
          fi
          KS="$RUNNER_TEMP/keystore.p12"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::SIGNING_KEY base64 解码后为空或损坏"
            exit 1
          fi
          if ! keytool -list -v -keystore "$KS" -storetype PKCS12 \
                -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
                > keytool_check.log 2>&1; then
            echo "::error::keystore 校验失败（口令错/别名不存在/非 PKCS12）"
            cat keytool_check.log
            exit 1
          fi
          echo "keystore 校验通过："
          grep -E "Alias name|Entry type|Certificate fingerprint" keytool_check.log || true
          {
            echo "SIGNING_STORE_FILE=$KS"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK (keystore-signed)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PciRun=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tail -80

      - name: 校验 APK 结构与签名
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "FAIL: 未找到 release APK 产物"; exit 1; }
          ls -lh "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()
          assert 'assets/index.html' in names, 'APK 缺少 assets/index.html'
          assert 'AndroidManifest.xml' in names, 'APK 缺少 AndroidManifest.xml'
          assert any(n.startswith('META-INF/') and n.endswith(('.RSA','.EC','.DSA')) for n in names), 'APK 未签名（无 META-INF 签名块）'
          print('OK: APK 结构有效且含签名块，共 %d 条目' % len(names))
          PY
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk_verify.log
          grep -q "Verifies" apk_verify.log || grep -qi "verified" apk_verify.log || true
          echo "OK: apksigner 签名校验通过"

      - name: Upload APK Artifact (正式签名包)
        uses: actions/upload-artifact@v4
        with:
          name: ai-zhibo-apk-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
