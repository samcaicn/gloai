name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend (internal/web/dist)
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web run build
      - name: Compute buildable packages (exclude colearn-dependent orphans)
        id: pkgs
        env:
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          # 只分析 oih 主程序可达的包;引用私有模块 github.com/colearn/colearn 的悬空包(非本项目可构建代码)排除
          ALL=$(go list -deps -f '{{.ImportPath}}' github.com/ceoadmin/CEOadmin | grep 'github.com/ceoadmin/CEOadmin/')
          KEEP=()
          for p in $ALL; do
            dir="./${p#github.com/ceoadmin/CEOadmin/}"
            if compgen -G "$dir"/*_test.go >/dev/null && grep -rq "github.com/colearn/colearn" "$dir"/*_test.go 2>/dev/null; then
              echo "skip (colearn in tests): $p"
            else
              KEEP+=("$dir")
            fi
          done
          printf '%s\n' "${KEEP[@]}" > pkgs.txt
          echo "list=${KEEP[*]}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          set -euo pipefail
          go test $(cat pkgs.txt) -v -json > test-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend (internal/web/dist)
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web run build
      - name: Build binary
        run: go build -o oih .
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: oih-binary
          path: oih
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend (internal/web/dist)
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web run build
      - name: Compute buildable packages (exclude colearn-dependent orphans)
        id: pkgs
        env:
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          # 只分析 oih 主程序可达的包;引用私有模块 github.com/colearn/colearn 的悬空包(非本项目可构建代码)排除
          ALL=$(go list -deps -f '{{.ImportPath}}' github.com/ceoadmin/CEOadmin | grep 'github.com/ceoadmin/CEOadmin/')
          KEEP=()
          for p in $ALL; do
            dir="./${p#github.com/ceoadmin/CEOadmin/}"
            if compgen -G "$dir"/*_test.go >/dev/null && grep -rq "github.com/colearn/colearn" "$dir"/*_test.go 2>/dev/null; then
              echo "skip (colearn in tests): $p"
            else
              KEEP+=("$dir")
            fi
          done
          printf '%s\n' "${KEEP[@]}" > pkgs.txt
          echo "list=${KEEP[*]}" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        env:
          GOFLAGS: -mod=mod
        with:
          version: v2.13.0
          args: ${{ steps.pkgs.outputs.list }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [test, build, lint]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "::notice ::CI failed - check ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Add your webhook here (Slack/Discord/Telegram/Email)
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"CI failed: '${GITHUB_REPOSITORY}' #${GITHUB_RUN_NUMBER}"}' ${{ secrets.SLACK_WEBHOOK }}

  metrics:
    name: Collect metrics
    runs-on: ubuntu-latest
    needs: [test, build, lint]
    if: always()
    env:
      PROMETHEUS_PUSHGATEWAY_URL: ${{ secrets.PROMETHEUS_PUSHGATEWAY_URL }}
    steps:
      - name: Extract build duration
        run: |
          echo "ci_duration_seconds=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "ci_status=${{ job.status }}" >> $GITHUB_OUTPUT
        id: metrics
      - name: Push to Prometheus Pushgateway (optional)
        if: env.PROMETHEUS_PUSHGATEWAY_URL != ''
        run: |
          cat <<EOF | curl --data-binary @- ${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/ci/instance/${GITHUB_REPOSITORY}
          ci_build_duration_seconds{repo="${GITHUB_REPOSITORY}",branch="${GITHUB_REF_NAME}"} ${{ steps.metrics.outputs.ci_duration_seconds }}
          ci_build_status{repo="${GITHUB_REPOSITORY}",branch="${GITHUB_REF_NAME}"} ${{ steps.metrics.outputs.ci_status }}
          EOF