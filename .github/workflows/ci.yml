name: AI智播 — 体检 + Web热更新产物 + APK构建

# 三条腿：
#   1. check    —— 原型结构体检（秒级，最早暴露漏改产品名/标签不闭合）。
#   2. package  —— web 热更新产物（index.html + 版本指纹），供热替换分发。
#   3. apk      —— Android WebView 壳打 debug APK，把原型装进手机。
#                  用 debug 而非 release：无需签名密钥，CI 一定能出包。
#                  参考 jev-chat-jarvis/.github/workflows/build.yml 的 Android 构建流程。
#
# 热更新链路：
#   web —— push → artifact(ai-zhibo-web) → 分发端按 version/sha256 热替换 index.html
#   apk —— push → artifact(ai-zhibo-apk) → 下载安装；壳优先加载 files/index.html，
#          因此 APK 装一次后，后续只热替换 index.html 即可，无需重装（与 web 同源）。
on:
  push:
    branches: ['aizhibo']
  pull_request:
    branches: ['aizhibo']
  workflow_dispatch:

permissions:
  contents: read

# 同分支连续推送只保留最新构建，避免排队烧分钟数。
concurrency:
  group: aizhibo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 原型结构体检
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验入口文件与产品标识
        shell: bash
        run: |
          set -e
          [ -s index.html ] || { echo "FAIL: 缺少 index.html"; exit 1; }
          [ -s version.json ] || { echo "FAIL: 缺少 version.json"; exit 1; }
          grep -q "AI智播" index.html || { echo "FAIL: index.html 未标记产品名 AI智播"; exit 1; }
          echo "OK: 入口文件与产品标识校验通过"

      - name: 校验 HTML 结构完整性
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re, json, sys
          html = open('index.html', encoding='utf-8').read()
          errs = []
          for tag in ('script', 'style'):
            o = len(re.findall(r'<%s[ >]' % tag, html))
            c = len(re.findall(r'</%s>' % tag, html))
            if o != c:
              errs.append('<%s> 未闭合: %d 开 / %d 闭' % (tag, o, c))
          for a, b in (('{','}'), ('(',')'), ('[',']')):
            if html.count(a) != html.count(b):
              errs.append('括号不匹配: %s%d / %s%d' % (a, html.count(a), b, html.count(b)))
          v = json.load(open('version.json', encoding='utf-8'))
          assert v.get('product') == 'AI智播', 'version.json 产品名错误'
          if errs:
            print('FAIL:', '; '.join(errs)); sys.exit(1)
          print('OK: HTML 结构通过，版本', v.get('version'), '（%d 字符）' % len(html))
          PY

  package:
    name: Web热更新产物
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成版本清单 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, datetime
          v = json.load(open('version.json', encoding='utf-8'))
          html = open('index.html', 'rb').read()
          manifest = {
            "product": v['product'],
            "version": v['version'],
            "entry": v['entry'],
            "sha256": hashlib.sha256(html).hexdigest(),
            "size": len(html),
            "built_at": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
            "commit": "${{ github.sha }}"
          }
          json.dump(manifest, open('manifest.json', 'w'), ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload Artifact (web 热更新产物)
        uses: actions/upload-artifact@v4
        with:
          name: ai-zhibo-web
          path: |
            index.html
            version.json
            manifest.json
          retention-days: 90

  apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK，只需接受许可证，AGP 会按需拉平台。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: 同步原型到 assets（防两个 index.html 不一致）
        shell: bash
        run: |
          cp index.html app/src/main/assets/index.html
          echo "synced: $(md5sum index.html app/src/main/assets/index.html)"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PciRun=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tail -60

      - name: 校验 APK 产物
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "FAIL: 未找到 APK 产物"; exit 1; }
          ls -lh "$APK"
          # PE/zip 头校验：APK 本质是 zip，确认不是空文件/损坏。
          python3 - "$APK" <<'PY'
          import sys, zipfile
          p = sys.argv[1]
          z = zipfile.ZipFile(p)
          names = z.namelist()
          assert 'assets/index.html' in names, 'APK 缺少 assets/index.html'
          assert 'AndroidManifest.xml' in names, 'APK 缺少 AndroidManifest.xml'
          print('OK: APK 结构有效，含 assets/index.html，共 %d 条目' % len(names))
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-zhibo-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
