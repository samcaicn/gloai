name: CI

on:
  push:
    branches: [dshrs]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build dsh.exe (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Upload dsh.exe
        uses: actions/upload-artifact@v4
        with:
          name: dsh-windows-x86_64
          path: target/release/dsh.exe
