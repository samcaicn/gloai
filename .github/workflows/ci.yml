name: CI — 语法体检 + EXE 实测

# 每次 push / 任意分支 PR 都跑。三条腿：
#   1. syntax —— 全量 compileall，纯语法门禁，秒级，最早暴露缩进/编码错误。
#   2. ux-e2e —— Flask test_client 打真实路由，验界面精简 + 保存零回归 + CLI/授权/MCP 业务流程。
#   3. exe    —— 真正构建 PyInstaller onefile EXE 并**解包实测**。
#
# ⭐ 为什么 EXE 这条腿不可省（2026-10-05 立规：CI EXE 测试每次都要）：
#   只做 compileall 会漏掉一整类最常见的假绿 —— **改了源码但没重新打包**。
#   那种情况下所有 .py 都能编译通过、CI 全绿，但用户拿到的 EXE 里还是旧模板
#   （实测踩过：源码价格已改成 ¥19.9，打包产物里仍是 ¥29.9）。
#   所以必须构建真 EXE，并把它当 zip 解开、断言**资源内容**真的更新了。
#
# build.yml 只在 weauto 分支跑（产物分发用）；本文件负责「每次改动都验」，
# 两者不重复：这里不传 Artifact，只判定成败。
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# 【2026-10-14 安全收紧】全链路只读：语法体检 / e2e / EXE 解包断言均只读源码，
# 失败诊断输出到 Actions 日志（不再 gh issue create，避免需要 issues:write）。
permissions:
  contents: read

jobs:
  syntax:
    name: Compile all .py (compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile-check every Python file (exclude venv / git / caches)
        shell: bash
        run: |
          # compileall 对任一语法错误返回非 0；-q 静默，只在出错时打印。
          # 排除：.venv_bot(本地 venv，含大量无关第三方源码)、.git、__pycache__、node_modules。
          python -m compileall -q \
            -x '(\.venv_bot|__pycache__|\.git|node_modules)' \
            .

      - name: Report
        if: success()
        run: echo "✅ 全部 Python 文件编译通过，无语法/缩进错误。"

  ux-e2e:
    name: UI + 业务流程端到端实测 (Flask test_client)
    runs-on: windows-latest
    timeout-minutes: 15
    # ⭐ 为什么要有这条腿（2026-10-12 立规）：
    #   「语法体检」只能证明 .py 能编译，「EXE 解包断言」只能证明打包产物里带了新模板。
    #   两者都**证明不了业务流程还通**——尤其删了 UI 配置项之后，保存会不会把用户
    #   真实设置静默写成 False（本项目踩过的真坑：submit_config / index 两处
    #   boolean_fields 对「表单里没出现」的开关写 False）。
    #   本 job 直接 import config_editor 用 Flask test_client 打真实路由，从渲染出的
    #   HTML 里解析 configForm 真实字段来构造 POST（界面上有什么就提交什么），
    #   并先改动一个可见字段断言它真写回（保存确证），再断言已删字段原值不变——
    #   否则「字段没变」可能只是保存根本没成功（假阳性）。
    #   平台选 windows：与开发实测环境一致，避免模板/路径的平台差异造成假红。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install minimal deps for test_client
        shell: bash
        run: |
          # 刻意**不装 requirements.txt 全量**：那里面 uiautomation / pywin32 /
          # pythonnet / pywebview 等 Windows 微信引擎重包与本测试无关，装了白白多花几分钟。
          # 这里只装 config_editor.py 顶层真正 import 的包（已核对：顶层无 wxauto/uiautomation
          # /webview 依赖，webview 只在打开桌面窗口的函数内部 import）。
          python -m pip install --upgrade pip
          pip install flask flask-cors flask-wtf flask-limiter waitress \
                      werkzeug "openai==1.84.0" requests psutil filelock sqlalchemy \
                      cryptography

      - name: Run UI / save-zero-regression e2e
        shell: bash
        env:
          # Windows runner 控制台默认非 UTF-8，断言里全是中文，不设会 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
        run: |
          python _ux_e2e_test.py

      - name: Run business-flow e2e (CLI / license / MCP)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python _flow_e2e_test.py

      - name: Run full business-module e2e (15 个环节)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 覆盖面最广的一条：页面渲染 / 机器人控制 / 提醒 / 核心记忆 / 聊天上下文 /
          # AI分身 / 朋友圈 / 固定转发 / Jev / 人设 / 授权拒绝路径 / 配置导入 /
          # 恢复默认配置 / 心跳日志。整体备份可变数据 → finally 全量还原。
          # ⚠️ 刻意不测 /start_bot 成功路径（会真起微信 bot）与 /api/jev/test（真调 AI 烧额度）。
          python _full_e2e_test.py

      - name: Run jev_guard offline unit tests (mock decisions server)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # jev_guard 是纯标准库模块（无第三方依赖）：在本机 mock 一个 decisions
          # 服务，覆盖解析 / guidance 注入（含语言跟随）/ 收声 / 降级 / 超时重试
          # （5xx 重试、4xx 不重试、每次尝试重签）/ 熔断 / 候选 1~3 / HMAC 签名。
          # ⚠️ 刻意不连线上 Worker：会烧 Workers AI 额度且依赖本机网络。
          # 线上闸门行为（Android 墙 + EXE 双凭证）由下面的 node 测试离线覆盖。
          python _jev_exe_test.py

      - name: Run self-replace bat regression tests (Windows, real cmd)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 防的是真实事故：旧版自替换 bat 只 copy 不校验，磁盘写满/中断会把
          # EXE 写成截断文件，用户下次启动解压到一半就缺 base_library.zip。
          # 这里用临时目录里的假文件真实执行 bat，覆盖成功/回滚/放弃三条分支。
          python _updater_replace_test.py

      - name: Run worker dual-credential gate tests (node, mock env)
        shell: bash
        run: |
          # worker_fix/cf_worker.js = 线上部署的合并版（Android L3 完整性墙 + WeAuto
          # 基线，2026-10-14 从 Cloudflare API 拉回）+ 双凭证闸门补丁。本测试零依赖
          # （仅 node 内置模块），mock env/fetch 确定性覆盖：
          #   fail-open / 无凭证落 Android 墙 / Android 五头该过过该拦拦
          #   （含「五头合法+计费令牌过期不误杀」回归）/ EXE 三凭证
          #   （HMAC 签名 / 卡密+实例 / 计费令牌）/ 精确错误码 / 闸门 clone 不消耗 body /
          #   e2e worker.fetch。⚠️ 不连线上：HMAC 密钥与 ts 窗口只能在 mock 里构造。
          node _worker_gate_test.mjs

      - name: Run updater hot-update channel tests (offline mocks)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # updater 热更新通道（2026-10-15 efbbc3a 加固）离线单测，mock requests.get /
          # subprocess.Popen / time.sleep，覆盖：
          #   _http_get 死代理回退直连（proxies 全置 None）/ 两轮全败抛异常
          #   检查更新 3 次退避重试 / 版本比较矩阵 / 状态读写往返
          #   下载 3 次重试后成功 / 3 次全败 / Ed25519 验签双路径（篡改拒绝 + 真签通过）
          #   发行版缺 .sig 拒绝 / 非 exe 环境拒绝 / 构件无 WeAuto.exe。
          # ⚠️ 刻意不跑 --live：会真下载 83MB CI 构件并依赖线上 Worker / azure 直链。
          python _updater_e2e_test.py

      - name: Assert config.py not polluted by tests
        if: always()
        shell: bash
        run: |
          # 两个脚本都会为「保存确证」临时改写 config.py，并在 finally 里从
          # config.py.bak_test 还原。这里兜底断言仓库出厂 config.py 没被留在改动状态，
          # 否则说明还原逻辑失效（本地跑会污染用户配置，比测试失败更严重）。
          if [ -n "$(git diff --name-only -- config.py)" ]; then
            echo "❌ config.py 被测试污染且未还原："
            git diff -- config.py | head -40
            exit 1
          fi
          echo "✅ config.py 未被污染（测试还原逻辑有效）"

  exe:
    name: Build EXE + unpack assertions
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 与 build.yml 保持一致：PyInstaller 6.22.3 在 3.10 上构建成功。
          python-version: '3.10'

      - name: Enable long paths (Windows MAX_PATH=260 workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
            Write-Host "LongPathsEnabled=1 applied"
          } catch { Write-Host "LongPathsEnabled set skipped: $_" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Build onefile EXE
        shell: bash
        run: |
          # 用**全新目录名**构建：workpath/distpath 复用旧目录时，
          # PyInstaller 的 --clean 偶尔会把上次的中间产物带进新包（假绿来源之一）。
          # 极短路径（C:/_ciwb、C:/_ciwd）同时规避 windows runner 未开长路径时的 MAX_PATH。
          {
            set -x
            set +e
            add_data() { if [ -e "$1" ]; then ARGS+=(--add-data "$1;$2"); fi; }
            ARGS=(--name WeAuto --onefile --noupx --noconsole --paths vendor
                  --workpath C:/_ciwb --distpath C:/_ciwd
                  --hidden-import bot --hidden-import wechat_compat --hidden-import wechatauto
                  --hidden-import forward_hub
                  --hidden-import jev_guard
                  --hidden-import weauto_stdio
                  --hidden-import cli --hidden-import weauto_mcp
                  --hidden-import weauto_license --hidden-import weauto_license.guard
                  --hidden-import mcp --collect-all mcp
                  --hidden-import uiautomation --hidden-import comtypes --hidden-import colorama
                  --collect-all wechatauto
                  --collect-all webview --collect-all clr_loader --collect-all pythonnet
                  --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms
                  --version-file version_info.txt --manifest manifest.xml
                  # 启动画面：splash.png 转成 Splash-*.res 打进归档，_exe_ci_test.py 有对应断言
                  --splash splash.png)
            add_data config.py "."
            add_data templates templates
            add_data emojis emojis
            add_data prompts prompts
            add_data static static
            add_data Demo_Image Demo_Image
            python -m PyInstaller --noconfirm --clean "${ARGS[@]}" config_editor.py
          } > build.log 2>&1
          rc=$?
          echo "BUILD_RC=$rc"
          if [ "$rc" != "0" ]; then tail -c 40000 build.log; fi
          exit $rc

      - name: Unpack-and-assert the EXE
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 真正解包实测：PE 头 + 归档内容断言（价格文案、付款浮层、密钥出厂值等）。
          # 具体断言见 _exe_ci_test.py 的 REQUIRED_TOKENS —— 改了 UI/价格要往那里加条目。
          ls -lh C:/_ciwd/WeAuto.exe
          python _exe_ci_test.py C:/_ciwd/WeAuto.exe

      - name: Publish failure detail (print to logs)
        if: failure()
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 权限收紧为只读：报错直接输出到 Actions 日志，不再建公开 Issue。
          {
            echo "===== build.log (tail 40k) ====="
            tail -c 40000 build.log 2>/dev/null || echo "(build.log missing)"
            echo "===== Unpack-and-assert re-run (断言真实输出) ====="
            ls -lh C:/_ciwd/WeAuto.exe 2>/dev/null || echo "(EXE missing)"
            python _exe_ci_test.py C:/_ciwd/WeAuto.exe 2>&1 || true
          } > _diag.txt
          cat _diag.txt
