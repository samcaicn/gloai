name: Sync Tencent → GitHub CI

# 自动同步（多项目矩阵，复用同一对工蜂/GitHub 密钥）：
#   - git.code.tencent.com:AImarketing/weauto.git     android → GitHub jev-chat-jarvis
#   - git.code.tencent.com:AImarketing/buddybuddy.git main    → GitHub main
# 各自在推送后自动触发对应仓库的 build.yml 构建 APK。
#
# 触发方式：
#   - 定时（每 10 分钟轮询一次，发现有新提交即同步）
#   - 手动 workflow_dispatch（立即可跑一次）
#   - repository_dispatch（type=tencent-sync）：
#     预留给腾讯工蜂的 Webhook 直接回调，可去掉轮询延迟。
#     配置方式：工蜂项目 → Webhooks → 填
#       https://api.github.com/repos/samcaicn/gloai/dispatches
#     并用 PAT 做 Bearer 鉴权，body = {"event_type":"tencent-sync"}
# 注意：刻意不监听 push，避免「同步 push → 触发本工作流」的死循环。
# 另外：schedule 只在**默认分支**生效，本工作流必须留在默认分支 tmp-empty 上。
#
# 需要的仓库密钥（GitHub 仓库 Settings → Secrets）：
#   TENCENT_SSH_KEY = 本地 ~/.ssh/id_rsa_tencent 的私钥全文（含 BEGIN/END 行）
#   SYNC_PAT       = 有 repo/workflow 权限的 GitHub PAT（用于推送以触发下游构建）

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tencent-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: weauto
            branch: android
            target: jev-chat-jarvis
            dest_repo: gloai
            depth: 1
          - repo: buddybuddy
            branch: main
            target: main
            dest_repo: buddybuddy
            depth: 0
    # 同一时刻每个项目只允许一个同步任务（避免两次 cron 重叠时并发 force-push 互相打架）
    concurrency:
      group: sync-tencent-${{ matrix.repo }}
      cancel-in-progress: false
    steps:
      - name: Check required secrets
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -u
          missing=0
          if [ -z "${TENCENT_SSH_KEY:-}" ]; then
            echo "::error::仓库密钥 TENCENT_SSH_KEY 未配置，无法 clone 腾讯工蜂"
            missing=1
          fi
          if [ -z "${SYNC_PAT:-}" ]; then
            echo "::error::仓库密钥 SYNC_PAT 未配置，无法推送到 GitHub（GITHUB_TOKEN 的 push 不会触发下游构建）"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "两个密钥均已配置"

      - name: Prepare SSH for Tencent
        run: |
          set -eu
          mkdir -p ~/.ssh
          # 腾讯 git 服务器只提供 ssh-rsa 主机密钥；现代 OpenSSH（含 GitHub
          # runner）默认禁用了该算法，必须显式重新开启，否则 clone 协商失败：
          #   no matching host key type found. Their offer: ssh-rsa
          ssh-keyscan -H -t rsa git.code.tencent.com >> ~/.ssh/known_hosts 2>/dev/null || true
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/id_rsa_tencent
          chmod 600 ~/.ssh/id_rsa_tencent
          # IdentityFile 必须显式写：密钥文件名不是 ssh 默认尝试的 id_rsa/id_ed25519，
          # 不指定会导致无密钥可提供 → Permission denied (publickey)。
          cat > ~/.ssh/config <<'EOF'
          Host git.code.tencent.com
              IdentityFile ~/.ssh/id_rsa_tencent
              IdentitiesOnly yes
              HostKeyAlgorithms +ssh-rsa
              PubkeyAcceptedAlgorithms +ssh-rsa,ssh-ed25519
          EOF
          chmod 600 ~/.ssh/config
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}

      - name: Clone Tencent ${{ matrix.repo }} ${{ matrix.branch }}
        run: |
          set -eu
          # depth=0 → 完整 clone（buddybuddy 首次同步要跨无关历史 force push，
          # shallow pack 缺 parent 对象会被 GitHub index-pack 拒）；
          # depth=1 → shallow（weauto 增量同步，省流量）。
          if [ "${{ matrix.depth }}" = "0" ]; then
            git clone --branch ${{ matrix.branch }} --single-branch \
              git@git.code.tencent.com:AImarketing/${{ matrix.repo }}.git _tencent
          else
            git clone --branch ${{ matrix.branch }} --single-branch --depth 1 \
              git@git.code.tencent.com:AImarketing/${{ matrix.repo }}.git _tencent
          fi
          echo "TENCENT_HEAD=$(git -C _tencent rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compare with GitHub ${{ matrix.target }} HEAD
        id: cmp
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          # 必须用 SYNC_PAT：GITHUB_TOKEN 只对当前仓库（gloai）有权限，
          # 跨仓库读 samcaicn/buddybuddy 会 not found。
          # fail-closed：ls-remote 网络抖动时 $() 管道退出码取的是 cut（恒 0），
          # set -e 不拦 → GH_HEAD 为空 → 误判"不同步" → force push 相同 sha，
          # GitHub 对 ref 更新一律触发 push event → 下游 Build APK 无谓重建，
          # artifact updated_at 刷新 → 客户端把同代码当新版本重复下载。
          # 因此：ls-remote 失败或 HEAD 不是 40 位 hex，直接报错退出，绝不 Push。
          if ! GH_REFS=$(git ls-remote \
            "https://x-access-token:${SYNC_PAT}@github.com/samcaicn/${{ matrix.dest_repo }}.git" \
            "refs/heads/${{ matrix.target }}" 2>&1); then
            echo "::error::ls-remote GitHub ${{ matrix.target }} 失败，放弃本次同步: $GH_REFS"
            exit 1
          fi
          GH_HEAD=$(printf '%s\n' "$GH_REFS" | awk '{print $1}' | head -1)
          if ! printf '%s' "$GH_HEAD" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::GitHub ${{ matrix.target }} HEAD 解析失败（'$GH_HEAD'），放弃本次同步"
            exit 1
          fi
          if ! printf '%s' "$TENCENT_HEAD" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::工蜂 HEAD 异常（'$TENCENT_HEAD'），放弃本次同步"
            exit 1
          fi
          echo "github_head=$GH_HEAD"
          echo "tencent_head=$TENCENT_HEAD"
          {
            echo "### 同步比对（${{ matrix.repo }} ${{ matrix.branch }} → ${{ matrix.target }}）"
            echo ""
            echo "| 端 | HEAD |"
            echo "|---|---|"
            echo "| 腾讯 ${{ matrix.branch }} | \`$TENCENT_HEAD\` |"
            echo "| GitHub ${{ matrix.target }} | \`$GH_HEAD\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GH_HEAD" = "$TENCENT_HEAD" ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "already in sync, nothing to do"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            echo "diff detected, will sync"
          fi

      - name: Push Tencent ${{ matrix.repo }} → GitHub ${{ matrix.target }}
        if: steps.cmp.outputs.in_sync == 'false'
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          cd _tencent
          # 必须用 PAT（而非 GITHUB_TOKEN）推送：GitHub 规定用 GITHUB_TOKEN
          # 发起的 push 不会再触发任何工作流（防死循环），只有 PAT 的 push
          # 才会真正触发下游的 Build APK 构建。
          # Push 前二次读取远端 HEAD 再确认一次（Compare 与 Push 之间有分钟级
          # 间隔，期间远端可能已被别的同步/人工推送改变）：
          #   - 已相同 → 什么都不做（相同 sha 的 force push 也会触发下游重建）；
          #   - 仍不同 → --force-with-lease 锁定 Compare 读到的 old 值，
          #     远端若在两步之间被改过则拒绝推送，避免误覆盖。
          DEST="https://x-access-token:${SYNC_PAT}@github.com/samcaicn/${{ matrix.dest_repo }}.git"
          if ! REMOTE_REFS=$(git ls-remote "$DEST" "refs/heads/${{ matrix.target }}" 2>&1); then
            echo "::error::Push 前二次 ls-remote 失败，放弃推送: $REMOTE_REFS"
            exit 1
          fi
          REMOTE_HEAD=$(printf '%s\n' "$REMOTE_REFS" | awk '{print $1}' | head -1)
          T_HEAD=$(git rev-parse HEAD)
          if [ "$REMOTE_HEAD" = "$T_HEAD" ]; then
            echo "push-time re-check: already in sync at $T_HEAD, nothing to do"
            exit 0
          fi
          git remote add github "$DEST"
          if [ -n "$REMOTE_HEAD" ]; then
            git push github "HEAD:refs/heads/${{ matrix.target }}" \
              "--force-with-lease=refs/heads/${{ matrix.target }}:$REMOTE_HEAD"
          else
            git push github "HEAD:refs/heads/${{ matrix.target }}"
          fi
          echo "synced: tencent ${{ matrix.repo }} ${{ matrix.branch }} -> github ${{ matrix.target }} ($T_HEAD)"
