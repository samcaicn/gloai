name: build-aibuddy

# 智创协同 AI 工作台（mu-desktop / AiBuddy）GitHub 构建载体。
#
# 三条硬规矩（用户 2026-10-18 立规）：
#   1) 源码唯一事实源在腾讯工蜂 clawclaw/aibuddy，**绝不上 GitHub**——
#      本工作流在 runner 临时目录里 git clone 工蜂，源码不写入本仓库任何
#      分支 / commit / artifact（artifact 只含编译产物，非源码）。
#   2) 不创建 GitHub Release（release 会强制附带 "Source code (zip/tar.gz)"，
#      来源是 tag 指向的 commit 树，一旦该 commit 含源码即泄露）。热更新包
#      只以 **GitHub Actions artifact** 形式留存（artifact 不会自动挂源码包）。
#   3) 节省流量费：exe 走 GitHub Actions artifact 带宽（免费），由 aibuddy-update
#      worker 用**只读 token** 读 Actions 把 exe 流式吐给客户端，不落地 Cloudflare
#      R2（R2 出流量要钱）。几乎零成本、零泄露。
#
# 触发：repository_dispatch(event_type=aibuddy-build) 或手动 workflow_dispatch。
# 工蜂提交版本后运行 ci-artifacts/trigger_build.sh 发送 dispatch 即可，无需
# 把任何源码 push 到本仓库。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号覆盖（可选，如 1.1.18；不填则用工蜂 desktop/package.json 的版本）'
        required: false
  repository_dispatch:
    types: [aibuddy-build]

# 不写分支、不建 Release、不推代码：contents 仅读；artifact 上传需 actions:write。
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 克隆工蜂源码（仅 runner 临时目录，永不落 GitHub 仓库）
        shell: bash
        env:
          TENCENT_TOKEN: ${{ secrets.TENCENT_TOKEN }}
        run: |
          git clone --depth 1 "https://oauth2:${TENCENT_TOKEN}@git.code.tencent.com/clawclaw/aibuddy.git" _src
          echo "cloned HEAD: $(git -C _src rev-parse HEAD)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # hoisted 布局：bun 隔离布局下 electron 的 postinstall 找不到 @electron/get
      # （作用域里只建空目录不建链接，bun 1.4.2 已知问题），装完会崩。
      - name: 安装依赖（hoisted 布局）
        working-directory: _src/desktop
        run: bun install --frozen-lockfile --linker=hoisted

      # bun 1.4.2 hoisted 布局不建工作区链接（@mu/@aionui 是空目录），
      # 而 src/index.ts 按包名 import '@aionui/web-host'，必须补 junction。
      - name: 补齐工作区链接
        working-directory: _src/desktop
        shell: cmd
        run: |
          if not exist node_modules\@mu mkdir node_modules\@mu
          if not exist node_modules\@aionui mkdir node_modules\@aionui
          if not exist node_modules\@mu\desktop mklink /J node_modules\@mu\desktop packages\desktop
          if not exist node_modules\@aionui\shared-scripts mklink /J node_modules\@aionui\shared-scripts packages\shared-scripts
          if not exist node_modules\@aionui\web-host mklink /J node_modules\@aionui\web-host packages\web-host

      # 快速无签名构建：压缩级别 1 + 跳过签名。electron 二进制由 postinstall
      # 从 GitHub releases 下载（runner 网络无墙）；aioncore 后端二进制由
      # prepare-aioncore 从 iOfficeAI/AionCore 公开 releases 下载。
      - name: 构建 Windows x64 安装包（快速 · 无签名）
        working-directory: _src/desktop
        run: bun run build-win:x64:fast

      # 生成 electron-updater 通用源 latest.yml（sha512/size 由 CI 现算，避免本地预生成错位）。
      - name: 生成 latest.yml（electron-updater 通用源）
        working-directory: _src/desktop/out
        shell: bash
        run: |
          node -e '
            const fs=require("fs");
            const f=fs.readdirSync(".").find(x=>/^AiBuddy-.*-win-x64\.exe$/.test(x));
            if(!f){console.error("no exe found");process.exit(1);}
            const data=fs.readFileSync(f);
            const sha=crypto.createHash("sha512").update(data).digest("base64");
            const size=data.length;
            const ver=f.match(/AiBuddy-(.+)-win-x64\.exe/)[1];
            const d=new Date().toISOString();
            const yml=`version: ${ver}\nfiles:\n  - url: ${f}\n    sha512: ${sha}\n    size: ${size}\npath: ${f}\nsha512: ${sha}\nreleaseDate: '\''${d}'\''\n`;
            fs.writeFileSync("latest.yml",yml);
            console.log(yml);
          '

      # 只发 NSIS（exe ~404MB）。不发 msi——electron-updater 的通用/NSIS 自动更新
      # 链路只认 NSIS 安装包。artifact 仅含编译产物，不含源码，作为 Actions 运行
      # 记录保留（retention 设长，保证"最新版"长期可取）。
      - name: 上传只读升级包 · NSIS 安装程序（Actions artifact，免费带宽，留 action 记录）
        uses: actions/upload-artifact@v4
        with:
          name: aibuddy-exe
          path: _src/desktop/out/AiBuddy-*-win-x64.exe
          retention-days: 365
          if-no-files-found: error

      - name: 上传 latest.yml（Actions artifact，极小，供 worker 只读读取）
        uses: actions/upload-artifact@v4
        with:
          name: aibuddy-latest-yml
          path: _src/desktop/out/latest.yml
          retention-days: 365
          if-no-files-found: error

      # 清理旧 artifact（仅保留本次，避免长期堆积；失败不阻断主流程）。
      - name: 清理旧 artifact（仅保留本次 run）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          RUN_ID="${{ github.run_id }}"
          echo "保留 run=$RUN_ID，删除其余 artifact"
          gh api -X GET "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            | python -c "
          import sys,json,os
          d=json.load(sys.stdin)
          run_id=os.environ['RUN_ID']
          for a in d.get('artifacts',[]):
              if a['name'] in ('aibuddy-exe','aibuddy-latest-yml') and str(a['run_id'])!=run_id:
                  print('DELETE', a['id'], a['name'])
          " | while read _ id _name; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
          echo "cleanup done"
