name: 🐳 Build & Push oih-multica-full

on:
  push:
    branches: ["ceo"]
    paths:
      - "Dockerfile"
      - "deploy/**"
      - "docker-compose.yml"
      - "internal/builtin/multica/**"
      - ".github/workflows/oih-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # 顺序执行各 stage 并开启 GC，避免构建期磁盘溢出（与本地 kc2 builder 一致）
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
              gc = true
              gc-keepstorage = "2g"

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:oih-multica-full
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max