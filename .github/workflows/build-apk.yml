name: Build Android APK

on:
  push:
    branches: [dsh]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-tauri
        run: cargo install cargo-tauri

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dsh-desktop/src-tauri -> ../target
            dsh-core -> ../target

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Init & Build Tauri Android
        working-directory: dsh-desktop/src-tauri
        run: |
          cargo tauri android init
          cargo tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimarketing-android-apk
          path: |
            target/android/app/build/outputs/apk/**/*.apk
            dsh-desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
