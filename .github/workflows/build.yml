name: Build BBT-ZB EXE (Tauri 2) + 发布升级包

"on":
  push:
    branches: [pcapp]
  workflow_dispatch:

# weauto 模式（2026-10-14 收紧版）：构建后仅签名 + 发 GitHub Release 作为升级源；
# 版本清单 updates/version.json 提交回 pcapp 分支，供客户端 raw 读取（含 gh-proxy 镜像回退）。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout contains real bbt-zb wiring (anti stale-checkout)
        shell: bash
        run: |
          for f in src-tauri/src/bbt.rs src-tauri/src/update.rs src-tauri/src/guard.rs src/config.ts tools/sign_release.py tools/make_version.py; do
            [ -s "$f" ] || { echo "FAIL: checkout 缺少 $f（疑似旧树）"; exit 1; }
          done
          grep -q "account/login" src-tauri/src/bbt.rs || { echo "FAIL: bbt.rs 无 account/login"; exit 1; }
          grep -q "chat/configSave" src-tauri/src/bbt.rs || { echo "FAIL: bbt.rs 无 chat/configSave"; exit 1; }
          grep -q "UPDATER_VERIFY_KEY" src-tauri/src/update.rs || { echo "FAIL: update.rs 无验签公钥"; exit 1; }
          echo "checkout 校验 OK @ $(git rev-parse --short HEAD)"

      - name: Read version
        id: ver
        shell: bash
        run: |
          VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        # esbuild 的 build script 批准写在 pnpm-workspace.yaml 的 allowBuilds 中，
        # 故 --frozen-lockfile 可直接通过（无需额外 flag）。
        run: pnpm install --frozen-lockfile

      - name: Resolve build secrets (CONFIG_SIG_KEY 必须跨版本稳定)
        id: secrets
        shell: bash
        env:
          BBT_BUILD_SECRETS_SECRET: ${{ secrets.BBT_BUILD_SECRETS }}
        run: |
          # 关键约束：CONFIG_SIG_KEY 决定 config.json 的 HMAC 信封签名。若每次构建都
          # 随机生成，用户升级后旧版写出的 config.json 在新版下验签必失败 → state.init
          # 回退默认配置 → 连接地址/桥接/自动回复/wxauto/成员映射等全部丢失。
          # 故 CONFIG_SIG_KEY 必须跨版本稳定。
          # 策略：
          #   1) 优先使用仓库 Secret BBT_BUILD_SECRETS（推荐，密钥不暴露、可随时轮换）；
          #   2) 未配置则回退本脚本内置的固定 CONFIG_SIG_KEY（明文写在 CI，会削弱防
          #      小白改配置的力度，但保证「升级不丢配置」这一更高优先级需求）。
          # DEVICE_SALT / CLOCK_SALT 仍每次随机（仅影响设备指纹/可信时钟，不影响配置）。
          if [ -n "$BBT_BUILD_SECRETS_SECRET" ]; then
            BLOB="$BBT_BUILD_SECRETS_SECRET"
            echo "using repo Secret BBT_BUILD_SECRETS (stable, not exposed in CI)"
          else
            BLOB=$(python - <<'PY'
          import base64, json, secrets
          # 固定 CONFIG_SIG_KEY（跨版本稳定，避免升级丢配置）；其余每次随机。
          FIXED_CONFIG_SIG = "bbtzb_cfg_sig_stable_v1_" + ("0" * 40)
          blob = {
              "DEVICE_SALT":    "bz." + secrets.token_hex(16),
              "CONFIG_SIG_KEY": FIXED_CONFIG_SIG,
              "CLOCK_SALT":     secrets.token_hex(16),
          }
          print(base64.b64encode(json.dumps(blob).encode()).decode())
          PY
            )
            echo "using built-in fixed CONFIG_SIG_KEY fallback (set repo Secret BBT_BUILD_SECRETS to override)"
          fi
          echo "blob=$BLOB" >> "$GITHUB_OUTPUT"
          echo "build secrets resolved (base64 len=${#BLOB})"

      - name: Build EXE (no bundle)
        shell: pwsh
        env:
          # 防破解注入：发行版固杀标记 + 构建期密钥 blob（guard.rs 编译期读取）
          BBT_RELEASE: "1"
          BBT_BUILD_SECRETS: ${{ steps.secrets.outputs.blob }}
        run: |
          pnpm tauri build --no-bundle 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if (Test-Path build-output.log) {
            "### tauri build key lines" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content build-output.log |
              Select-String -Pattern "Built application|Finished|Compiling bbt|error(\[|\b)" |
              ForEach-Object { "``$($_.Line)``" } |
              Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
          exit $code

      - name: Run Rust tests (配置保留 / 签名兼容)
        shell: bash
        run: |
          # 守护「升级后本地配置必须有效保存」：
          #   - config_envelope_roundtrip：正常信封签名/验签往返
          #   - config_envelope_bad_sig_keeps_data：跨版本密钥变更时降级接受、不丢配置
          #   - config_envelope_tamper_is_accepted_but_logged：被篡改信封也降级接受
          cd src-tauri
          cargo test --lib -- --nocapture

      - name: Locate EXE
        id: exe
        shell: bash
        run: |
          # 不预设子目录：全 target 树 find（CI 与本机 target 布局可能不同）
          {
            echo "### exe search (all *.exe under src-tauri/target)"
            echo '```'
            find src-tauri/target -type f -name '*.exe' 2>/dev/null | head -30 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          CAND=$(find src-tauri/target -type f -path '*release*' -name 'bbt-zb-tauri.exe' 2>/dev/null | head -1)
          [ -n "$CAND" ] || CAND=$(find src-tauri/target -type f -name 'bbt-zb-tauri.exe' 2>/dev/null | head -1)
          if [ -z "$CAND" ]; then
            {
              echo "### FAIL: bbt-zb-tauri.exe not found"
              echo '```'
              ls -la src-tauri 2>/dev/null || true
              ls -la src-tauri/target 2>/dev/null || echo "(no target dir)"
              find src-tauri -maxdepth 4 -type d 2>/dev/null | head -40
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
            echo "FAIL: 未找到构建产物 exe"
            exit 1
          fi
          echo "exe=$CAND" >> "$GITHUB_OUTPUT"
          echo "EXE: $CAND ($(stat -c%s "$CAND") bytes)"

      - name: Verify EXE is a GUI (no console) build
        shell: bash
        run: |
          python - <<'PY'
          import struct, sys
          p = "${{ steps.exe.outputs.exe }}"
          with open(p, 'rb') as f:
              dos = f.read(64)
              if dos[:2] != b'MZ': sys.exit('FAIL: not a PE file')
              e_lfanew = struct.unpack_from('<I', dos, 0x3C)[0]
              f.seek(e_lfanew)
              if f.read(4) != b'PE\0\0': sys.exit('FAIL: bad PE signature')
              f.seek(e_lfanew + 4 + 20 + 68)
              subsystem = struct.unpack('<H', f.read(2))[0]
          print('PE subsystem =', subsystem, '(2=GUI, 3=CUI)')
          if subsystem != 2: sys.exit('FAIL: EXE is a console build')
          print('OK: GUI build')
          PY

      - name: Sign EXE (Ed25519)
        shell: bash
        env:
          BBT_SIGN_KEY: ${{ secrets.BBT_SIGN_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # bash -e -o pipefail 陷阱 + runner python 默认 cp1252（print 中文即崩）：
          # 签名与诊断全部在 tools/ci_sign.py 内（ASCII 输出 + 诊断直写 ci-diag.txt）。
          set +e
          python tools/ci_sign.py "${{ steps.exe.outputs.exe }}"
          rc=$?
          [ "$rc" -eq 0 ] || exit 1
          ls -lh "${{ steps.exe.outputs.exe }}" "${{ steps.exe.outputs.exe }}.sig"

      - name: Generate updates/version.json
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          REPO="${{ github.repository }}"
          EXE_URL="https://github.com/${REPO}/releases/download/${TAG}/bbt-zb-tauri.exe"
          SIG_URL="https://github.com/${REPO}/releases/download/${TAG}/bbt-zb-tauri.exe.sig"
          python tools/make_version.py "${{ steps.ver.outputs.version }}" "$EXE_URL" "$SIG_URL"
          echo "--- updates/version.json ---"; cat updates/version.json

      - name: Create GitHub Release (升级源)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # 已存在则删除重建（升级包幂等）
          gh release delete "$TAG" --yes >> ci-diag.txt 2>&1 || true
          gh release create "$TAG" \
            --title "BBT-ZB 控制台 ${{ steps.ver.outputs.version }}" \
            --notes "${{ steps.ver.outputs.version }}" \
            --prerelease=false \
            "${{ steps.exe.outputs.exe }}" \
            "${{ steps.exe.outputs.exe }}.sig" \
            updates/version.json >> ci-diag.txt 2>&1 || { echo "::error::gh release create 失败，详见 ci-diag.txt(已提交回分支)"; exit 1; }

      - name: Commit version.json back to pcapp (raw 升级源)
        shell: bash
        run: |
          git config user.email "ci@bbt-zb.dev"
          git config user.name "bbt-zb CI"
          git add updates/version.json
          git commit -m "chore: bump updates/version.json -> ${{ steps.ver.outputs.version }} [skip ci]" || echo "no change"
          git push origin HEAD:pcapp

      - name: Report build failure (print logs)
        if: failure()
        shell: bash
        run: |
          tail -c 60000 src-tauri/target/x86_64-pc-windows-msvc/release/build/*/output 2>/dev/null || true

      - name: Commit diagnostics to pcapp on failure
        if: failure()
        shell: bash
        run: |
          # 诊断落盘到仓库（git 可读，绕开 logs API 的权限/限流）
          { echo "=== failure @ $(date -u +%FT%TZ) sha=${{ github.sha }}"; tail -c 2500 build-output.log 2>/dev/null; } >> ci-diag.txt 2>/dev/null || true
          git config user.email "ci@bbt-zb.dev"
          git config user.name "bbt-zb CI"
          git add -f ci-diag.txt
          git commit -m "chore: CI failure diagnostics [skip ci]" || { echo "no diag change"; exit 0; }
          git push origin HEAD:pcapp

      - name: Upload Artifact (90d)
        uses: actions/upload-artifact@v4
        with:
          name: bbt-zb-windows-exe
          path: |
            ${{ steps.exe.outputs.exe }}
            ${{ steps.exe.outputs.exe }}.sig
          retention-days: 90
