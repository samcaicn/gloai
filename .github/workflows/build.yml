name: Build WeAuto EXE (obfuscated)

"on":
  push:
    branches: [weauto]
  workflow_dispatch:

# 若仓库 Settings → Actions → General → Workflow permissions 被设为 Read-only，
# 则下面的 write 权限会被忽略，upload-artifact / Create Release / issue 诊断都会失败。
# 需要 Read and write 才能真正产出 Artifact(90天)。
permissions:
  contents: write
  actions: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 本地实测：PyInstaller 6.22.3 在 Python 3.10 上构建成功；对齐该环境。
          python-version: '3.10'

      - name: Enable long paths (Windows MAX_PATH=260 workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
            Write-Host "LongPathsEnabled=1 applied"
          } catch { Write-Host "LongPathsEnabled set skipped: $_" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Stamp release build marker (license guard forced on)
        shell: bash
        run: |
          # 发行版固杀：正式 EXE 里授权门禁强制开启（guard_enabled() 恒 True），
          # 用户改 config.py 的 LICENSE_GUARD_ENABLED=False 也无效。
          # 本地开发无此文件 = 开发态；该文件由 CI 生成、不提交仓库（见 .gitignore）。
          printf 'RELEASE = True  # CI generated release marker: license guard forced on\n' > weauto_license/_release.py
          cat weauto_license/_release.py

      - name: Build obfuscated onefile EXE
        id: build
        shell: bash
        run: |
          # 整个构建块的输出（含 set -x 跟踪 + PyInstaller 全部输出）重定向到 build.log，
          # 避免此前 `| tee` 在 headless runner 上 SIGPIPE 导致 build.log 为空、报错丢失。
          {
            set -x
            set +e  # 关闭 GitHub 自动加的 errexit：任何命令非 0 退出都不中断脚本，
                    # 由末尾 `exit $rc` 依据 PyInstaller 真实返回码决定构建成败。
            # 防御性 add-data：只打包真实存在的资源。
            # 用 if 块确保函数始终返回 0 —— GitHub Actions 给 bash 步骤自动加 set -e，
            # 若用 `[ -e x ] && ARGS+=(...)` 这种写法，目录缺失时函数返回非 0 会触发
            # set -e 直接终止整个脚本（跑不到 PyInstaller），这是此前 11 次构建秒失败的真正根因。
            add_data() { if [ -e "$1" ]; then ARGS+=(--add-data "$1;$2"); fi; }
            # 使用极短的工作/输出路径（C:/_wb、C:/_wd）规避 windows-2022 runner
            # 未开启长路径支持时 PyInstaller --collect-all 产生的深路径超过 MAX_PATH(260)
            # 导致 FileNotFoundError / WinError 206 的构建失败（本地 Win11 默认支持长路径故不报错）。
            # --noconsole：GUI-only 硬要求，双击启动不弹 cmd 黑框。
            # 需要真实 stdio 的子形态（--cli/--mcp/--bot）在 __main__ 里用
            # AttachConsole(ATTACH_PARENT_PROCESS) 重新附着调用方控制台（weauto_stdio.py），
            # 从命令行启动时输出照常回到调用方窗口。
            ARGS=(--name WeAuto --onefile --noupx --noconsole --paths vendor
                  --workpath C:/_wb --distpath C:/_wd
                  --hidden-import bot --hidden-import wechat_compat --hidden-import wechatauto
                  # 固定转发引擎（bot.py / config_editor.py 静态 + 运行期 import），
                  # 显式 hidden-import 兜底，避免后续改为纯动态 import 时被漏打包。
                  --hidden-import forward_hub
                  # Jev 判断式 AI 闸门（回复前的对话体检，跑在自有 CF Worker + Workers AI 上）：
                  # bot.py 顶层 try-import、config_editor.py 运行期 import，显式兜底防漏打包。
                  --hidden-import jev_guard
                  # GUI-only 的 stdio 兜底（noconsole 下 sys.stdout 是 None 的统一处理）：
                  # bot.py 顶层与 config_editor __main__ 都以运行期 import 方式引入。
                  --hidden-import weauto_stdio
                  # 单 EXE 全功能：WebUI / bot / CLI / MCP 四种形态共用同一个 exe，
                  # 靠命令行参数（默认 / --bot / --cli / --mcp）在 __main__ 派发。
                  # 这几个入口是运行时动态 import，必须显式 hidden-import 才会被打进包。
                  --hidden-import cli --hidden-import weauto_mcp
                  # License 门禁（Creem 卡密，仅与自有 CF Worker 通信，不持密钥）：
                  # weauto_license 包是运行期动态 import，必须显式 hidden-import 才会打进包。
                  --hidden-import weauto_license --hidden-import weauto_license.guard
                  # MCP 协议栈（FastMCP 基于 mcp<2）：显式收集，避免动态 import 漏模块。
                  # 注意 requirements.txt 里必须是 mcp[cli]，否则 mcp.cli 需要 typer 会构建失败。
                  --hidden-import mcp --collect-all mcp
                  # vendor/wechatauto 顶层硬依赖（__init__/logger/uia_driver 直接 import），
                  # 显式 hidden-import 兜底，避免 --collect-all 在某些子模块导入失败时被漏掉。
                  --hidden-import uiautomation --hidden-import comtypes --hidden-import colorama
                  --collect-all wechatauto
                  # 桌面窗口模式（pywebview / WebView2，config_editor.py 运行期 import webview）：
                  # collect-all 打包 webview 的 lib（WebView2Loader 等）与 pythonnet/clr_loader
                  # 的运行时 DLL（Python.Runtime 等），缺一个桌面窗口就起不来。
                  --collect-all webview --collect-all clr_loader --collect-all pythonnet
                  --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms
                  # 写入合法的版本信息资源 + 显式 manifest（asInvoker，不请求管理员）：
                  # 降低杀软对「无数字签名 + 未知发布者」的启发式误报评分。根治仍需 EV 代码签名证书。
                  --version-file version_info.txt --manifest manifest.xml)
            add_data config.py "."
            add_data templates templates
            add_data emojis emojis
            add_data prompts prompts
            add_data static static
            add_data Demo_Image Demo_Image
            # PyInstaller 6.x 已移除 --key 字节码加密（v6.0 起）；用 python -m 规避 PATH 问题。
            python -m PyInstaller --noconfirm --clean "${ARGS[@]}" config_editor.py
          } > build.log 2>&1
          rc=$?
          echo "BUILD_RC=$rc"
          exit $rc

      - name: Report build failure (publish build.log to issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把真实报错（build.log 尾部 60k + pip list）写进公开 Issue 正文，
          # 这样即使没有 token 也能通过公开 API/网页读到 CI 真实报错。
          {
            echo "===== build.log (tail 60k) ====="
            tail -c 60000 build.log 2>/dev/null || echo "(build.log missing/empty)"

            echo "===== pip list ====="
            pip list 2>/dev/null
          } > _diag.txt
          gh issue create --repo samcaicn/gloai \
            --title "WeAuto CI Build Failure (run ${{ github.run_number }})" \
            --body-file _diag.txt || true

      - name: Verify EXE
        shell: bash
        run: |
          ls -lh C:/_wd/WeAuto.exe
          if [ ! -s C:/_wd/WeAuto.exe ]; then echo "WeAuto.exe missing"; exit 1; fi
          echo "WeAuto.exe built (single all-in-one): $(stat -c%s C:/_wd/WeAuto.exe) bytes"

      - name: Verify EXE is a GUI (no console) build
        shell: bash
        run: |
          # GUI-only 防回归：noconsole 构建的 EXE，其 PE OptionalHeader.Subsystem
          # 必须是 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI)；console 形态是 3
          # (IMAGE_SUBSYSTEM_WINDOWS_CUI)，那会双击就弹 cmd 黑框。
          # 用 PE 头直接读，不启动程序（headless runner 上没有桌面会话）。
          #
          # 偏移：e_lfanew -> PE签名(4) + COFF头(20) = OptionalHeader 起点；
          #       Subsystem 位于 OptionalHeader + 68（PE32 与 PE32+ 同）。
          # 对照值实测：notepad.exe=2(GUI)，cmd.exe=3(CUI)。
          python - <<'PY'
          import struct, sys
          p = r'C:/_wd/WeAuto.exe'
          with open(p, 'rb') as f:
              dos = f.read(64)
              if dos[:2] != b'MZ':
                  sys.exit('FAIL: not a PE file')
              e_lfanew = struct.unpack_from('<I', dos, 0x3C)[0]
              f.seek(e_lfanew)
              if f.read(4) != b'PE\0\0':
                  sys.exit('FAIL: bad PE signature')
              f.seek(e_lfanew + 4 + 20 + 68)
              subsystem = struct.unpack('<H', f.read(2))[0]
          print('PE subsystem =', subsystem, '(2=GUI, 3=CUI)')
          if subsystem != 2:
              sys.exit('FAIL: EXE is a console build (subsystem=3) -> would show a cmd black box')
          print('OK: GUI build, no console window on launch')
          PY

      - name: Upload Artifact (90d)
        uses: actions/upload-artifact@v4
        with:
          name: weauto-windows-exe
          path: C:/_wd/WeAuto.exe
          retention-days: 90

      # 不再发布公开 Release：EXE 分发改由 GitHub Actions Artifact（保留 90 天）承担，
      # 客户端 updater.py 以 Artifact 为首选升级通道（见 updater.py 注释）。
      # 这样去掉了「公开 Release 托着 EXE」这一暴露面；源码私有化另见仓库可见性设置。
      - name: Skip public Release (rely on Actions Artifact)
        shell: bash
        run: echo "Public Release skipped; distribution via Actions Artifact (90d)."
