name: Build WeAuto EXE (obfuscated)

"on":
  push:
    branches: [weauto]
  workflow_dispatch:

# 若仓库 Settings → Actions → General → Workflow permissions 被设为 Read-only，
# 则下面的 write 权限会被忽略，upload-artifact / Create Release / issue 诊断都会失败。
# 需要 Read and write 才能真正产出 Artifact(90天)。
permissions:
  contents: write
  actions: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 本地实测：PyInstaller 6.22.3 在 Python 3.10 上构建成功；对齐该环境。
          python-version: '3.10'

      - name: Enable long paths (Windows MAX_PATH=260 workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
            Write-Host "LongPathsEnabled=1 applied"
          } catch { Write-Host "LongPathsEnabled set skipped: $_" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Build obfuscated onefile EXE
        id: build
        shell: bash
        run: |
          # 整个构建块的输出（含 set -x 跟踪 + PyInstaller 全部输出）重定向到 build.log，
          # 避免此前 `| tee` 在 headless runner 上 SIGPIPE 导致 build.log 为空、报错丢失。
          {
            set -x
            set +e  # 关闭 GitHub 自动加的 errexit：任何命令非 0 退出都不中断脚本，
                    # 由末尾 `exit $rc` 依据 PyInstaller 真实返回码决定构建成败。
            # 防御性 add-data：只打包真实存在的资源。
            # 用 if 块确保函数始终返回 0 —— GitHub Actions 给 bash 步骤自动加 set -e，
            # 若用 `[ -e x ] && ARGS+=(...)` 这种写法，目录缺失时函数返回非 0 会触发
            # set -e 直接终止整个脚本（跑不到 PyInstaller），这是此前 11 次构建秒失败的真正根因。
            add_data() { if [ -e "$1" ]; then ARGS+=(--add-data "$1;$2"); fi; }
            # 使用极短的工作/输出路径（C:/_wb、C:/_wd）规避 windows-2022 runner
            # 未开启长路径支持时 PyInstaller --collect-all 产生的深路径超过 MAX_PATH(260)
            # 导致 FileNotFoundError / WinError 206 的构建失败（本地 Win11 默认支持长路径故不报错）。
            ARGS=(--name WeAuto --onefile --noupx --paths vendor
                  --workpath C:/_wb --distpath C:/_wd
                  --hidden-import bot --hidden-import wechat_compat --hidden-import wechatauto
                  # 单 EXE 全功能：WebUI / bot / CLI / MCP 四种形态共用同一个 exe，
                  # 靠命令行参数（默认 / --bot / --cli / --mcp）在 __main__ 派发。
                  # 这几个入口是运行时动态 import，必须显式 hidden-import 才会被打进包。
                  --hidden-import cli --hidden-import weauto_mcp
                  # License 门禁（Creem 卡密，仅与自有 CF Worker 通信，不持密钥）：
                  # weauto_license 包是运行期动态 import，必须显式 hidden-import 才会打进包。
                  --hidden-import weauto_license --hidden-import weauto_license.guard
                  # MCP 协议栈（FastMCP 基于 mcp<2）：显式收集，避免动态 import 漏模块。
                  # 注意 requirements.txt 里必须是 mcp[cli]，否则 mcp.cli 需要 typer 会构建失败。
                  --hidden-import mcp --collect-all mcp
                  # vendor/wechatauto 顶层硬依赖（__init__/logger/uia_driver 直接 import），
                  # 显式 hidden-import 兜底，避免 --collect-all 在某些子模块导入失败时被漏掉。
                  --hidden-import uiautomation --hidden-import comtypes --hidden-import colorama
                  --collect-all wechatauto
                  # 写入合法的版本信息资源 + 显式 manifest（asInvoker，不请求管理员）：
                  # 降低杀软对「无数字签名 + 未知发布者」的启发式误报评分。根治仍需 EV 代码签名证书。
                  --version-file version_info.txt --manifest manifest.xml)
            add_data config.py "."
            add_data templates templates
            add_data emojis emojis
            add_data prompts prompts
            add_data static static
            add_data Demo_Image Demo_Image
            # PyInstaller 6.x 已移除 --key 字节码加密（v6.0 起）；用 python -m 规避 PATH 问题。
            python -m PyInstaller --noconfirm --clean "${ARGS[@]}" config_editor.py
          } > build.log 2>&1
          rc=$?
          echo "BUILD_RC=$rc"
          exit $rc

      - name: Report build failure (publish build.log to issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把真实报错（build.log 尾部 60k + pip list）写进公开 Issue 正文，
          # 这样即使没有 token 也能通过公开 API/网页读到 CI 真实报错。
          {
            echo "===== build.log (tail 60k) ====="
            tail -c 60000 build.log 2>/dev/null || echo "(build.log missing/empty)"

            echo "===== pip list ====="
            pip list 2>/dev/null
          } > _diag.txt
          gh issue create --repo samcaicn/gloai \
            --title "WeAuto CI Build Failure (run ${{ github.run_number }})" \
            --body-file _diag.txt || true

      - name: Verify EXE
        shell: bash
        run: |
          ls -lh C:/_wd/WeAuto.exe
          if [ ! -s C:/_wd/WeAuto.exe ]; then echo "WeAuto.exe missing"; exit 1; fi
          echo "WeAuto.exe built (single all-in-one): $(stat -c%s C:/_wd/WeAuto.exe) bytes"

      - name: Upload Artifact (90d)
        uses: actions/upload-artifact@v4
        with:
          name: weauto-windows-exe
          path: C:/_wd/WeAuto.exe
          retention-days: 90

      - name: Create Release (gh CLI)
        # 改用 runner 自带的 gh：GITHUB_TOKEN 自动可用，且对 Windows 绝对路径更稳。
        # 去掉 continue-on-error，让发版失败直接暴露（不再被伪装成绿）。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "weauto-build-${{ github.run_number }}" \
            --repo samcaicn/gloai \
            --title "WeAuto Build ${{ github.run_number }}" \
            --notes "Automated WeAuto EXE build (single all-in-one)." \
            "C:/_wd/WeAuto.exe"
