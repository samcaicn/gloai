name: Build WeAuto EXE (obfuscated)

"on":
  push:
    branches: [weauto]
  workflow_dispatch:

# 若仓库 Settings → Actions → General → Workflow permissions 被设为 Read-only，
# 则下面的 write 权限会被忽略，upload-artifact / Create Release / issue 诊断都会失败。
# 需要 Read and write 才能真正产出 Artifact(90天)。
permissions:
  contents: write
  actions: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 本地实测：PyInstaller 6.22.3 在 Python 3.10 上构建成功；对齐该环境。
          python-version: '3.10'

      - name: Enable long paths (Windows MAX_PATH=260 workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
            Write-Host "LongPathsEnabled=1 applied"
          } catch { Write-Host "LongPathsEnabled set skipped: $_" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Build obfuscated onefile EXE
        id: build
        shell: bash
        run: |
          set -o pipefail
          # 防御性 add-data：只打包真实存在的资源，避免缺失目录导致构建中断
          add_data() { [ -e "$1" ] && ARGS+=(--add-data "$1;$2"); }
          # 使用极短的工作/输出路径（C:/_wb、C:/_wd）规避 windows-2022 runner
          # 未开启长路径支持时 PyInstaller --collect-all 产生的深路径超过 MAX_PATH(260)
          # 导致 FileNotFoundError / WinError 206 的构建失败（本地 Win11 默认支持长路径故不报错）。
          ARGS=(--name WeAuto --onefile --noupx --paths vendor
                --workpath C:/_wb --distpath C:/_wd
                --hidden-import bot --hidden-import wxauto_compat --hidden-import wechatauto
                --collect-all wechatauto)
          add_data config.py "."
          add_data templates templates
          add_data emojis emojis
          add_data prompts prompts
          add_data static static
          add_data Demo_Image Demo_Image
          # PyInstaller 6.x 已移除 --key 字节码加密（v6.0 起）；用 python -m 规避 PATH 问题。
          python -m PyInstaller --noconfirm --clean "${ARGS[@]}" config_editor.py 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "BUILD_RC=$rc"
          exit $rc

      - name: Report build failure (echo full log + open issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== FULL build.log (tail 400) ====="
          tail -n 400 build.log 2>/dev/null || echo "(no build.log captured)"
          { tail -n 400 build.log 2>/dev/null; echo; echo "===== pip list ====="; pip list; } > _diag.txt
          gh issue create --repo samcaicn/gloai --title "WeAuto CI Build Failure (run ${{ github.run_number }})" --body-file _diag.txt || true

      - name: Verify EXE
        shell: bash
        run: |
          ls -lh C:/_wd/WeAuto.exe
          if [ ! -s C:/_wd/WeAuto.exe ]; then echo "EXE missing"; exit 1; fi
          echo "exe built: $(stat -c%s C:/_wd/WeAuto.exe) bytes"

      - name: Upload Artifact (90d)
        uses: actions/upload-artifact@v4
        with:
          name: weauto-windows-exe
          path: C:/_wd/WeAuto.exe
          retention-days: 90

      - name: Create Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weauto-build-${{ github.run_number }}
          name: WeAuto Build ${{ github.run_number }}
          files: C:/_wd/WeAuto.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
