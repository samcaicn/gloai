name: Build WeAuto EXE (obfuscated)

"on":
  push:
    branches: [weauto]
  workflow_dispatch:

# 若仓库 Settings → Actions → General → Workflow permissions 被设为 Read-only，
# 则下面的 write 权限会被忽略，upload-artifact / Create Release / issue 诊断都会失败。
# 需要 Read and write 才能真正产出 Artifact(90天)。
# 【2026-10-14 安全收紧】构建后仅保留只读权限：artifact 上传无需 write（upload-artifact@v4
# 走内部端点），失败诊断改为输出日志（不再 gh issue create，避免需要 issues:write）。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 本地实测：PyInstaller 6.22.3 在 Python 3.10 上构建成功；对齐该环境。
          python-version: '3.10'

      - name: Enable long paths (Windows MAX_PATH=260 workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
            Write-Host "LongPathsEnabled=1 applied"
          } catch { Write-Host "LongPathsEnabled set skipped: $_" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3
          pip install pyarmor

      # 防破解整改（2026-10-14）：构建统一走 tools/build_release.py ——
      #   1. 生成/读取构建密钥（CI 用 Secret pc_build_key，首次需固化）
      #   2. 写 _release.py（发行版门禁强制）
      #   3. 生成加密密钥 blob（release_secrets.enc，主密钥 _build_key.py 随后被混淆）
      #   4. 生成净化版 config.py + config.py.sig（篡改即强制走网关）
      #   5. PyArmor 混淆核心模块（weauto_license 包 / jev_guard / scriptpack / device_id）
      #   6. PyInstaller 构建
      #   7. Ed25519 签名 WeAuto.exe → WeAuto.exe.sig（updater 验签防投毒）
      - name: Build release EXE (obfuscated + signed)
        id: build
        shell: pwsh
        env:
          pc_build_key: ${{ secrets.pc_build_key }}
          PYTHONIOENCODING: utf-8   # Windows runner 默认 cp1252，打印中文会 UnicodeEncodeError
        run: |
          python tools/build_release.py
          if (Test-Path _pybuild_dist\WeAuto.exe) { Write-Host "BUILD_OK $((Get-Item _pybuild_dist\WeAuto.exe).Length) bytes" } else { exit 1 }

      - name: Report build failure (print build.log tail to logs)
        if: failure()
        shell: bash
        run: |
          # 权限已收紧为只读（不再建 issue）：真实报错输出到 Actions 日志，
          # 需要排障时在 run 页面直接看。
          tail -c 60000 build.log 2>/dev/null || echo "(build.log missing/empty)"
          echo "===== pip list ====="
          pip list 2>/dev/null

      - name: Verify EXE
        shell: bash
        run: |
          ls -lh _pybuild_dist/WeAuto.exe _pybuild_dist/WeAuto.exe.sig
          if [ ! -s _pybuild_dist/WeAuto.exe ]; then echo "WeAuto.exe missing"; exit 1; fi
          if [ ! -s _pybuild_dist/WeAuto.exe.sig ]; then echo "WeAuto.exe.sig missing"; exit 1; fi
          echo "WeAuto.exe built (single all-in-one): $(stat -c%s _pybuild_dist/WeAuto.exe) bytes"

      - name: Verify EXE is a GUI (no console) build
        shell: bash
        run: |
          # GUI-only 防回归：noconsole 构建的 EXE，其 PE OptionalHeader.Subsystem
          # 必须是 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI)；console 形态是 3
          # (IMAGE_SUBSYSTEM_WINDOWS_CUI)，那会双击就弹 cmd 黑框。
          # 用 PE 头直接读，不启动程序（headless runner 上没有桌面会话）。
          #
          # 偏移：e_lfanew -> PE签名(4) + COFF头(20) = OptionalHeader 起点；
          #       Subsystem 位于 OptionalHeader + 68（PE32 与 PE32+ 同）。
          # 对照值实测：notepad.exe=2(GUI)，cmd.exe=3(CUI)。
          python - <<'PY'
          import struct, sys
          p = r'_pybuild_dist/WeAuto.exe'
          with open(p, 'rb') as f:
              dos = f.read(64)
              if dos[:2] != b'MZ':
                  sys.exit('FAIL: not a PE file')
              e_lfanew = struct.unpack_from('<I', dos, 0x3C)[0]
              f.seek(e_lfanew)
              if f.read(4) != b'PE\0\0':
                  sys.exit('FAIL: bad PE signature')
              f.seek(e_lfanew + 4 + 20 + 68)
              subsystem = struct.unpack('<H', f.read(2))[0]
          print('PE subsystem =', subsystem, '(2=GUI, 3=CUI)')
          if subsystem != 2:
              sys.exit('FAIL: EXE is a console build (subsystem=3) -> would show a cmd black box')
          print('OK: GUI build, no console window on launch')
          PY

      - name: Upload Artifact (90d)
        uses: actions/upload-artifact@v4
        with:
          name: weauto-windows-exe
          # 防破解整改：EXE + Ed25519 签名一起上传。
          # GitHub 会把二者打包进同一个 artifact zip，Worker updateProxy 原样转发，
          # 客户端 updater 解压后先验签（WeAuto.exe.sig）再安装，防下载投毒。
          path: |
            _pybuild_dist/WeAuto.exe
            _pybuild_dist/WeAuto.exe.sig
          retention-days: 90

      # 不再发布公开 Release：EXE 分发改由 GitHub Actions Artifact（保留 90 天）承担，
      # 客户端 updater.py 以 Artifact 为首选升级通道（见 updater.py 注释）。
      # 这样去掉了「公开 Release 托着 EXE」这一暴露面；源码私有化另见仓库可见性设置。
      - name: Skip public Release (rely on Actions Artifact)
        shell: bash
        run: echo "Public Release skipped; distribution via Actions Artifact (90d)."
