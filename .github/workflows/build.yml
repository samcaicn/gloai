name: Build APK

on:
  push:
    branches: [main, jev-chat-jarvis]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 failed on this runner; ubuntu-latest
      # ships a preinstalled Android SDK instead. Just make sure every license
      # is accepted so AGP can pull missing platforms/build-tools on demand.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Decode the signing keystore from the GitHub secret (base64) when present.
      # Without SIGNING_KEY the release build stays unsigned — CI still succeeds.
      # NOTE: the guard lives INSIDE the shell (not in `if:`) because the
      # `secrets` context is not reliably available in `if:` at workflow startup.
      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/keystore.p12"
            if [ ! -s "$RUNNER_TEMP/keystore.p12" ]; then
              echo "::error::SIGNING_KEY decoded to an empty/invalid keystore"
              exit 1
            fi
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/keystore.p12"
              echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
              echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signing keystore decoded"
          else
            echo "no SIGNING_KEY secret — release build will be unsigned"
          fi

      - name: Build debug APK (installable)
        run: ./gradlew :app:assembleDebug --stacktrace > build_debug.log 2>&1

      - name: Build release APK (signed if keystore secret set, else unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace > build_release.log 2>&1

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist/

      # Safety net: a "successful" release build that is actually unsigned must
      # never ship. v1 signing is enabled in build.gradle, so a signed release
      # APK carries a META-INF/*.RSA (or .EC/.DSA) entry. Fail the job if absent.
      - name: Verify release APK is signed
        run: |
          python3 - <<'PY'
          import zipfile, sys
          apk = 'dist/app-release.apk'
          try:
              z = zipfile.ZipFile(apk)
          except FileNotFoundError:
              print('::error::dist/app-release.apk not found')
              sys.exit(1)
          sigs = [n for n in z.namelist()
                  if n.startswith('META-INF/') and (
                     n.endswith('.RSA') or n.endswith('.EC') or n.endswith('.DSA'))]
          print('signature entries:', sigs)
          if not sigs:
              print('::error::release APK is NOT signed (no META-INF signature)')
              sys.exit(1)
          print('release APK is signed OK')
          PY

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-jarvis-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Report failure log to public issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(mktemp)
          {
            echo "## jev-chat-jarvis APK build failure (run ${{ github.run_number }})"
            echo "Commit: ${{ github.sha }}"
            echo '### key lines'
            grep -nE "FAILURE:|What went wrong|Caused by:|error:|Error:|FAILED" build_debug.log build_release.log 2>/dev/null | head -40 || true
            echo '### Kotlin compiler errors'
            grep -hE "^e: " build_debug.log build_release.log 2>/dev/null | head -40 || true
            echo '### What went wrong section'
            L=$(grep -n "What went wrong" build_debug.log 2>/dev/null | head -1 | cut -d: -f1)
            [ -n "$L" ] && sed -n "${L},$((L+30))p" build_debug.log
            echo '### last 60 lines'
            tail -60 build_debug.log 2>/dev/null || true
          } > "$BODY"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "jev-chat-jarvis APK build failure (run ${{ github.run_number }})" \
            --body-file "$BODY" || true

      - name: Release APK (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
