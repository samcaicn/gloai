name: Build WeAuto EXE (obfuscated)

"on":
  push:
    branches: [weauto]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 本地实测：PyInstaller 6.22.3 在 Python 3.10 上构建成功，在 3.11/3.12 上失败
          # （6.22.3 要求 Python <3.13，且与 ≥3.11 的导入机制不兼容）。
          # 对齐本地已验证成功的 3.10 环境；产物为自包含 exe，运行不依赖宿主机 Python 版本。
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Build obfuscated onefile EXE
        id: build
        shell: bash
        run: |
          set -o pipefail
          # 防御性 add-data：只打包真实存在的资源，避免缺失目录导致构建中断
          add_data() { [ -e "$1" ] && ARGS+=(--add-data "$1;$2"); }
          ARGS=(--name WeAuto --onefile --paths vendor
                --hidden-import bot --hidden-import wxauto_compat --hidden-import wechatauto)
          add_data config.py "."
          add_data templates templates
          add_data emojis emojis
          add_data prompts prompts
          add_data static static
          add_data Demo_Image Demo_Image
          # 注意：PyInstaller 6.x 已移除 --key 字节码加密（v6.0 起），传 --key 会直接报错；
          # 若需强加密请改用 pyarmor 等方案，此处不再使用 --key。
          pyinstaller --noconfirm --clean "${ARGS[@]}" config_editor.py 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "BUILD_RC=$rc"
          exit $rc

      - name: Report build failure (diagnostics → GitHub Issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { tail -n 300 build.log 2>/dev/null || echo "(no build.log captured)"; } > diag.txt
          echo "=== diag.txt head ==="
          head -c 1500 diag.txt
          gh issue create --repo samcaicn/gloai --title "WeAuto CI Build Failure (run ${{ github.run_number }})" --body-file diag.txt || true

      - name: Verify EXE
        shell: bash
        run: |
          ls -lh dist/WeAuto.exe
          if [ ! -s dist/WeAuto.exe ]; then echo "EXE missing"; exit 1; fi
          echo "exe built: $(stat -c%s dist/WeAuto.exe) bytes"

      - name: Upload Artifact (90d)
        uses: actions/upload-artifact@v4
        with:
          name: weauto-windows-exe
          path: dist/WeAuto.exe
          retention-days: 90

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weauto-build-${{ github.run_number }}
          name: WeAuto Build ${{ github.run_number }}
          files: dist/WeAuto.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete release / tag / weauto branch (keep artifact 90d)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: weauto-build-${{ github.run_number }}
        run: |
          gh release delete "$TAG" --yes || true
          gh api -X DELETE "repos/samcaicn/gloai/git/refs/tags/$TAG" || true
          gh api -X DELETE "repos/samcaicn/gloai/git/refs/heads/weauto" || true
          echo "已删除 release 与 weauto 分支；Actions Artifact(weauto-windows-exe) 保留 90 天用于下载/自动更新"
