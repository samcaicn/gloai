name: Build APK

on:
  push:
    branches: [main, jev-chat-jarvis]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# 构建后经 cleanup job 删除同步镜像分支与任何残留 release，
# 仅保留 Actions artifact 作为只读升级通道（参考 pc-ref/build.yml 的「不发布 Release」思路）。
# 需要 contents: write 才能删除分支/Release；不再需要 issues: write
# （失败诊断改为打印日志，对齐 pc-ref 的只读收紧策略）。
permissions:
  contents: write

# 同一分支连续推送时只保留最新一次构建，避免排队烧分钟数
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Gradle 卡死（SDK 下载/守护进程）时不设上限会一直占着 runner 到 6h 硬超时
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 failed on this runner; ubuntu-latest
      # ships a preinstalled Android SDK instead. Just make sure every license
      # is accepted so AGP can pull missing platforms/build-tools on demand.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # L2：native 完整性模块（libintegrity.so）需要 NDK 编译。ubuntu-latest 的预装
      # Android SDK 不含 NDK，这里显式装上；CMake 由 AGP 自带版本处理，无需单独装。
      - name: Install NDK for libintegrity
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null 2>&1 || true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # 签名密钥（release 唯一产物，必须签名）
      #
      # 需要的仓库密钥（Settings → Secrets → Actions）：
      #   SIGNING_KEY            = base64(keystore.p12 全文)，PKCS12
      #   SIGNING_KEY_ALIAS      = 密钥别名
      #   SIGNING_KEY_PASSWORD   = 别名口令
      #   SIGNING_STORE_PASSWORD = 仓库口令
      #
      # 为什么必须是 release：debug 包用的是 Android 自动生成的
      # ~/.android/debug.keystore，GitHub 托管 runner 每次都是新 VM、
      # 每次随机生成，签名互不相同 → 覆盖安装必然报
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装，而卸载会连带
      # 丢掉无障碍绑定（ColorOS 上还得走 UI 手动重开，非常折腾）。
      # 用固定 keystore 后 install -r 直接覆盖，权限与配置全部保留。
      #
      # 守卫写在 shell 内部而非 `if:`——secrets 上下文在 workflow 启动阶段
      # 的 `if:` 里并不可靠（见 7fe66bd 之前的踩坑）。
      - name: Decode and validate signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::仓库密钥 SIGNING_KEY 未配置，无法产出已签名的 release 包（本工作流只出 release，故直接失败）"
            exit 1
          fi
          KS="$RUNNER_TEMP/keystore.p12"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::SIGNING_KEY base64 解码后为空或损坏，secret 内容不是合法的 base64"
            exit 1
          fi
          # 提前用 keytool 验一次：口令错/ 别名不存在 / 不是 PKCS12 都在这里暴露，
          # 比等 Gradle 报一屏stacktrace 更快定位。签名方案由 build.gradle
          # 的 enableV1/V2/V3 决定，这里只确认「密钥本身可用」。
          if ! keytool -list -v \
                -keystore "$KS" -storetype PKCS12 \
                -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
                > keytool_check.log 2>&1; then
            echo "::error::keystore 校验失败（口令错、别名不存在或格式非 PKCS12），详见下方 keytool 输出"
            cat keytool_check.log
            exit 1
          fi
          echo "keystore 校验通过："
          grep -E "Alias name|Entry type|Certificate fingerprint" keytool_check.log || true
          {
            echo "SIGNING_STORE_FILE=$KS"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
          } >> "$GITHUB_ENV"
          {
            echo "### 签名密钥"
            echo ""
            echo "keystore 校验通过，别名 \`$SIGNING_KEY_ALIAS\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK (keystore-signed)
        run: ./gradlew :app:assembleRelease -PciRun=${{ github.run_number }} --stacktrace > build_release.log 2>&1

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist/

      # 双重保险：build.gradle 配了签名但万一配置没生效（环境变量名写错、
      # storeType 不匹配等），会「构建成功但包是未签名的」，装到手机上才发现。
      # 这里用官方 apksigner 校验，并打印证书指纹+ SHA-256 供比对，
      # 绝不允许未签名的包流到 artifact。
      - name: Verify release APK signature
        run: |
          set -eu
          APK=dist/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK 不存在，release 构建没有产出"
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，无法校验签名"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk_verify.log
          if ! "$APKSIGNER" verify "$APK" > /dev/null 2>&1; then
            echo "::error::apksigner 校验不通过，APK 签名无效"
            exit 1
          fi
          {
            echo ""
            echo "### 签名校验"
            echo ""
            echo '```'
            grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" apk_verify.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release APK 签名校验通过"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-jarvis-apk-${{ github.run_number }}
          path: dist/app-release.apk
          retention-days: 30

      # ------------------------------------------------------------------
      # DEBUG 包（复用 release keystore 签名，install -r 可覆盖已装 release 不丢权限）：
      # 仅用于真机 E2E 验证 DEBUG-only 的可注入入口（ACTION_TEST_WX_MSG），
      # 驱动 enqueueNotif→flushNotifBatch→回复 整条生产线测多消息/群发送人。
      # 出现在本仓库 CI（有 SIGNING_* secret）时即为 release 同证书签名；release 产物流程不受影响。
      - name: Build debug APK (release-keystore signed, for on-device E2E)
        run: ./gradlew :app:assembleDebug -PciRun=${{ github.run_number }} --stacktrace > build_debug.log 2>&1 || true

      - name: Collect & upload debug APK
        if: always()
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/debug -name 'app-debug.apk' 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::warning::debug APK 未产出（可能 signingConfig 缺失），跳过 debug 产物上传"
            exit 0
          fi
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          echo "debug APK: $(ls -la dist/app-debug.apk)"

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-jarvis-debug-apk-${{ github.run_number }}
          path: dist/app-debug.apk
          retention-days: 30

      # 失败诊断改为打印日志（2026-10-17 对齐 pc-ref 只读收紧策略）：
      # 不再 gh issue create，避免需要 issues:write 权限，报错直接在 Actions 日志看。
      - name: Report build failure (print logs, no issue)
        if: failure()
        run: |
          echo "===== build_release.log (key lines) ====="
          grep -nE "FAILURE:|What went wrong|Caused by:|error:|Error:|FAILED" build_release.log 2>/dev/null | head -40 || true
          echo "===== Kotlin compiler errors ====="
          grep -hE "^e: " build_release.log 2>/dev/null | head -40 || true
          echo "===== What went wrong section ====="
          L=$(grep -n "What went wrong" build_release.log 2>/dev/null | head -1 | cut -d: -f1)
          [ -n "$L" ] && sed -n "${L},$((L+30))p" build_release.log
          echo "===== last 60 lines ====="
          tail -60 build_release.log 2>/dev/null || true

      # 产物策略：只保留 Actions artifact（人工去 Actions 页下载安装），
      # 刻意**不**发 GitHub Release、不打自动更新推送。App 侧「升级」只是只读提示：
      # 有新版本时在设置里告诉用户「有新版本，去装」，不自动下载、不自动安装。
      # 这样收银台/授权相关的一切都只经 Actions 一条路，避免多条升级通道打架。
      - name: Summary (artifact only, no auto-update)
        run: |
          {
            echo ""
            echo "### 安装包（只放这儿，不会自动更新）"
            echo ""
            echo "构建完成。安装包在本次 Actions 的 artifacts 里，名字："
            echo '`jev-chat-jarvis-apk-'"${{ github.run_number }}"'`，下载 `app-release.apk` 手动安装。'
            echo "本工作流不发布 GitHub Release、不做自动更新推送——App 只会在设置里提示有新版，由你决定什么时候装。"
            echo "构建结束后 cleanup job 会删除同步镜像分支 \`jev-chat-jarvis\` 与任何残留 Release，"
            echo "GitHub 仓库只保留 Actions artifact 作为只读升级通道。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 清理：构建（成功/失败）后删除同步镜像分支 jev-chat-jarvis 与任何残留
  # Release，只留 Actions artifact 作为 App 侧的「只读升级」通道。
  # 参考 pc-ref/build.yml 的「不发布 Release、靠 Artifact 分发」思路，
  # 但 Android 这边因 工蜂→GitHub 同步会落一个临时分支，故构建后顺手清掉它。
  #   - 只删 jev-chat-jarvis（同步镜像分支），绝不碰 main 等常驻分支；
  #   - Release 本工作流从不创建，删除步骤仅为兜底历史残留；
  #   - artifact 与分支/Release 解耦，删分支不影响 App 经 worker 拉取构件。
  cleanup:
    name: Cleanup (keep Actions artifacts only)
    needs: build
    # build 真跑过（成功/失败/取消）才清理；paths-ignore 跳过的 .md 提交不删分支
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete transient sync branch & stray release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          set -u
          # ① 只删同步镜像分支，绝不误删 main / 其他常驻分支
          if [ "$BRANCH" = "jev-chat-jarvis" ]; then
            echo "deleting transient sync branch: $BRANCH"
            gh api -X DELETE "/repos/$REPO/git/refs/heads/$BRANCH" \
              || git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" --delete "$BRANCH" \
              || echo "::warning::branch deletion failed (may be branch-protected), ignoring"
          else
            echo "skip: ref_name=$BRANCH is not the sync mirror branch, leaving it intact"
          fi

          # ② 防御性清 release（本工作流不发布 Release，这里兜底历史残留）
          TAG="v${RUN}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "deleting stray release: $TAG"
            gh release delete "$TAG" -y || echo "::warning::release deletion failed, ignoring"
          else
            echo "no release $TAG (expected — distribution is via Actions artifacts only)"
          fi

          echo "✅ cleanup done: only Actions artifacts (jev-chat-jarvis-apk-${RUN} / debug) remain as the read-only upgrade channel"
