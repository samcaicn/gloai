name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ["v*"]
    branches: [safeopc, aim, pks]
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand to build (tupai / safeopc)"
        required: false
        default: "tupai"
        type: choice
        options:
          - tupai
          - safeopc

permissions:
  contents: write

env:
  # workflow_dispatch 鈫?use input; push to safeopc/aim branch 鈫?safeopc (AIMarketing OEM); tag push 鈫?tupai
  BRAND: ${{ inputs.brand || ((github.ref == 'refs/heads/safeopc' || github.ref == 'refs/heads/aim' || github.ref == 'refs/heads/pks') && 'safeopc') || 'tupai' }}
  # Only create a GitHub release for tag pushes; empty for branch pushes
  TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # Job: Windows NSIS build
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/web-ui install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir src/web-ui/src/web-ui build

      # 鈹€鈹€ Windows code signing 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
      # Code signing is the single most effective measure against
      # SmartScreen "Windows protected your PC" warnings and Windows
      # Defender false positives. Without a valid signature, Windows
      # treats the executable as "from an unknown publisher" and applies
      # aggressive heuristic scanning.
      #
      # To enable signing, configure these GitHub Secrets:
      #   WINDOWS_CERT_BASE64  鈥?Base64-encoded .pfx/.p12 certificate
      #   WINDOWS_CERT_PASSWORD 鈥?Certificate private key password
      #
      # Without these secrets, the build proceeds unsigned (for dev/testing).
      - name: Decode code-signing certificate
        if: env.TAG_NAME != '' && env.WINDOWS_CERT_BASE64 != ''
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          echo "$WINDOWS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"

      # Branch push: build only (no release)
      - name: Build (CI)
        if: env.TAG_NAME == ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set +e
          pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.${BRAND}.conf.json --bundles nsis --verbose 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Build Failed (exit $code)"
              echo ""
              echo "### Last 250 lines of build log:"
              echo '```'
              tail -250 "$RUNNER_TEMP/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      # Tag push: build with code signing
      - name: Build with signing (release)
        if: env.TAG_NAME != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set +e
          pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.${BRAND}.conf.json --bundles nsis --verbose 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Build Failed (exit $code)"
              echo ""
              echo "### Last 250 lines of build log:"
              echo '```'
              tail -250 "$RUNNER_TEMP/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      # 鈹€鈹€ Sign the NSIS installer with signtool 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
      # This signs the .exe installer so SmartScreen doesn't show
      # "Unknown Publisher" warnings. Requires WINDOWS_CERT_BASE64
      # and WINDOWS_CERT_PASSWORD secrets to be configured.
      - name: Sign NSIS installer
        if: env.TAG_NAME != '' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $nsisDir = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $setupExe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setupExe) {
            Write-Host "[warn] No NSIS installer found to sign" -ForegroundColor Yellow
            return
          }
          Write-Host "[sign] Signing: $($setupExe.FullName)"
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          if (-not (Test-Path $certPath)) {
            Write-Host "[warn] Certificate file not found, skipping signing" -ForegroundColor Yellow
            return
          }
          # Find signtool from Windows SDK
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "[warn] signtool.exe not found, skipping signing" -ForegroundColor Yellow
            return
          }
          & $signtool.FullName sign /fd SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $setupExe.FullName
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[sign] Successfully signed: $($setupExe.Name)" -ForegroundColor Green
          } else {
            Write-Host "[warn] Signing failed (exit $LASTEXITCODE), continuing with unsigned build" -ForegroundColor Yellow
          }

      # 鈹€鈹€ Generate sha256 checksums 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
      # Produces a SHA256 checksum file alongside the installer so
      # users can verify download integrity. Also helps with antivirus
      # whitelisting 鈥?some orgs require checksums for allowlisting.
      - name: Generate SHA256 checksums
        if: always()
        shell: bash
        run: |
          nsis_dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if [ -d "$nsis_dir" ]; then
            cd "$nsis_dir"
            for f in *-setup.exe; do
              if [ -f "$f" ]; then
                sha256sum "$f" > "${f}.sha256"
                echo "SHA256 checksum for ${f}:"
                cat "${f}.sha256"
              fi
            done
          fi

      # ── Generate latest.yml (hot-update feed) ─────────────────────────────
      # 更新渠道（2026-10-23 起，COS 渠道已废弃）：
      #   CI 只留 Actions artifact -> 服务端 (tupaisaasmcp update_server) 只读解析
      #   本 yml -> download_url 吐 Azure 签名直链 -> app 边下边算 sha256 后静默安装。
      # 服务端按 <BRAND>-<platform>-latest-yml 精确查找，platform 用
      # TAURI_TO_BRAND_KEY 的 key（windows / macosintel / macosarm）。
      # sha256 是给 app 侧 updater_client 校验的，必须是 sha256 而不是 sha512。
      - name: Generate latest.yml (hot-update feed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          nsis_dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          exe=$(ls -1 "$nsis_dir"/*-setup.exe 2>/dev/null | head -1 || true)
          if [ -z "$exe" ]; then
            echo "no NSIS installer found, skipping latest.yml"
            exit 0
          fi
          name=$(basename "$exe")
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          sha256=$(sha256sum "$exe" | cut -d' ' -f1)
          sha512=$(sha512sum "$exe" | cut -d' ' -f1)
          size=$(stat -c%s "$exe")
          {
            echo "version: $ver"
            echo "platform: windows"
            echo "filename: $name"
            echo "sha256: $sha256"
            echo "sha512: $sha512"
            echo "size: $size"
            echo "artifact: ${{ env.BRAND }}-windows-x64"
            echo "notes: build ${{ github.sha }}"
          } > "$nsis_dir/latest.yml"
          echo "--- latest.yml ---"
          cat "$nsis_dir/latest.yml"

      - name: Upload NSIS installer (CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          retention-days: 90
          if-no-files-found: warn

      - name: Upload latest.yml (hot-update feed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-windows-latest-yml
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.yml
          retention-days: 90
          if-no-files-found: warn

      # Tag push: 同样只构建 + 留 artifact，不再创建 GitHub Release
      # （渠道已是 artifact-only；release/tag 只会和 wipe 策略打架）。
      - name: Build and release
        if: env.TAG_NAME != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.${{ env.BRAND }}.conf.json --bundles nsis

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # Job: macOS DMG build (aarch64 + x86_64 cross-compile)
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch-label: aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            arch-label: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/web-ui install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir src/web-ui/src/web-ui build

      # Branch push: build only (no release). Only build dmg to save CI time.
      - name: Build (CI)
        if: env.TAG_NAME == ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set +e
          pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.${BRAND}.conf.json --bundles dmg --verbose 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Build Failed (exit $code)"
              echo ""
              echo "### Last 250 lines of build log:"
              echo '```'
              tail -250 "$RUNNER_TEMP/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      # 鈹€鈹€ Generate sha256 checksums for DMG 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
      - name: Generate SHA256 checksums
        if: always()
        shell: bash
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          if [ -d "$dmg_dir" ]; then
            cd "$dmg_dir"
            for f in *.dmg; do
              if [ -f "$f" ]; then
                shasum -a 256 "$f" > "${f}.sha256"
                echo "SHA256 checksum for ${f}:"
                cat "${f}.sha256"
              fi
            done
          fi

      # ── Generate latest.yml (hot-update feed) ─────────────────────────────
      # 同 Windows job：服务端按 <BRAND>-<platform>-latest-yml 查找。
      # arch-label -> platform key: aarch64 -> macosarm, x64 -> macosintel。
      - name: Generate latest.yml (hot-update feed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg=$(ls -1 "$dmg_dir"/*.dmg 2>/dev/null | head -1 || true)
          if [ -z "$dmg" ]; then
            echo "no DMG found, skipping latest.yml"
            exit 0
          fi
          name=$(basename "$dmg")
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          sha512=$(shasum -a 512 "$dmg" | cut -d' ' -f1)
          # macOS uses BSD stat (-f%z); Linux/Windows Git Bash use GNU stat (-c%s)
          size=$(stat -c%s "$dmg" 2>/dev/null || stat -f%z "$dmg")
          if [ "${{ matrix.arch-label }}" = "aarch64" ]; then pf=macosarm; else pf=macosintel; fi
          {
            echo "version: $ver"
            echo "platform: $pf"
            echo "filename: $name"
            echo "sha256: $sha256"
            echo "sha512: $sha512"
            echo "size: $size"
            echo "artifact: ${{ env.BRAND }}-macos-${{ matrix.arch-label }}"
            echo "notes: build ${{ github.sha }}"
          } > "$dmg_dir/latest.yml"
          echo "--- latest.yml ---"
          cat "$dmg_dir/latest.yml"

      - name: Upload DMG (CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-macos-${{ matrix.arch-label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sha256
          retention-days: 90
          if-no-files-found: warn

      - name: Upload latest.yml (hot-update feed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-${{ matrix.arch-label == 'aarch64' && 'macosarm' || 'macosintel' }}-latest-yml
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/latest.yml
          retention-days: 90
          if-no-files-found: warn

      # Tag push: 同样只构建 + 留 artifact，不再创建 GitHub Release
      # （渠道已是 artifact-only）。Only build dmg on macOS.
      - name: Build and release
        if: env.TAG_NAME != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.${{ env.BRAND }}.conf.json --bundles dmg

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # Job: Sync code to Tencent Cloud before cleanup
  # 鏋勫缓鎴愬姛鍚庡皢浠ｇ爜闀滃儚鎺ㄩ€佸埌鑵捐浜?Git锛岀‘淇濅唬鐮佸湪鑵捐浜戞湁澶囦唤銆?  # 闇€瑕?GitHub Secret: TENCENT_GIT_URL锛堝畬鏁?URL 鍚嚟鎹級銆?  # 鏈厤缃?secret 鏃惰烦杩囧悓姝ワ紝cleanup 浠嶄細鎵ц锛堥渶纭繚鏈湴宸?push 鍒拌吘璁簯锛夈€?  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  sync-to-tencent:
    needs: [build-windows, build-macos]
    if: github.ref == 'refs/heads/safeopc'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror push to Tencent Cloud
        env:
          TENCENT_URL: ${{ secrets.TENCENT_GIT_URL }}
        run: |
          if [ -z "$TENCENT_URL" ]; then
            echo "鈿狅笍  TENCENT_GIT_URL secret not configured 鈥?skipping Tencent Cloud sync."
            echo "    Ensure code is pushed to Tencent Cloud locally before CI cleanup."
            exit 0
          fi
          echo "Syncing branch ${{ github.ref_name }} to Tencent Cloud..."
          git push --force "$TENCENT_URL" "refs/heads/${{ github.ref_name }}:refs/heads/${{ github.ref_name }}"
          echo "鉁?Tencent Cloud sync complete."

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # Job: Cleanup GitHub after successful build + sync
  # 鎵€鏈夋瀯寤烘垚鍔?+ 鑵捐浜戝悓姝ュ畬鎴愬悗锛屽垹闄?GitHub 杩滅▼鍒嗘敮鍜屾墍鏈?release銆?  # 鍒跺搧锛坋xe/dmg锛変繚鐣欏湪 workflow run artifacts 涓紙30 澶╀繚鐣欐湡锛夈€?  # 浠ｇ爜浠呬繚鐣欏湪鑵捐浜?Git銆?  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  cleanup-github:
    needs: [build-windows, build-macos]
    if: github.ref == 'refs/heads/safeopc'
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub remote branch
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "馃棏锔? Deleting GitHub remote branch: $BRANCH"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$BRANCH")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "鉁?Branch '$BRANCH' deleted from GitHub."
          else
            echo "鈿狅笍  Branch deletion returned $HTTP_CODE (may already be deleted or protected)."
            echo "   Response: $BODY"
          fi

      - name: Delete all GitHub releases
        run: |
          echo "馃棏锔? Deleting all GitHub releases..."
          RELEASES=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          RELEASE_COUNT=$(echo "$RELEASES" | jq 'length')
          echo "Found $RELEASE_COUNT release(s) to delete."
          if [ "$RELEASE_COUNT" -gt 0 ]; then
            echo "$RELEASES" | jq -r '.[].id' | while read -r RELEASE_ID; do
              echo "  Deleting release ID: $RELEASE_ID"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" -o /dev/null -w "  HTTP %{http_code}\n"
            done
          fi
          echo "鉁?Release cleanup complete."

      - name: Summary
        run: |
          echo "## 馃Ч GitHub Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch deleted:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Releases:** All deleted" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** Available in this workflow run (30-day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- **Code preserved:** Tencent Cloud Git" >> $GITHUB_STEP_SUMMARY
