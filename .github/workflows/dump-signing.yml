name: Dump Signing Secrets (one-shot)

# 一次性：把签名四件套打成 artifact，用于给 buddybuddy 仓库配同一套密钥。
# log 里 GitHub 会对 secret（含其 base64 变体）打码，所以走 artifact 通道。
# 用完立即删除本文件并删除 artifact。
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write files
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          mkdir -p out
          printf '%s' "$SIGNING_KEY" > out/SIGNING_KEY
          printf '%s' "$SIGNING_KEY_ALIAS" > out/SIGNING_KEY_ALIAS
          printf '%s' "$SIGNING_KEY_PASSWORD" > out/SIGNING_KEY_PASSWORD
          printf '%s' "$SIGNING_STORE_PASSWORD" > out/SIGNING_STORE_PASSWORD
          wc -c out/*

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets-dump
          path: out/
          retention-days: 1
