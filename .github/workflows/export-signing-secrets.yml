name: Export Signing Secrets

# 一次性工具：把仓库 secrets 里的 Android 签名材料导成 artifact，
# 供迁移到其他仓库（如 samcaicn/carlive）使用。
# GitHub 出于安全设计不提供读取 secret 的 API，只能在 workflow 内
# 把它还原成 jks 文件再作为 artifact 下发。
#
# 安全约束：
#   - 仅手动触发（workflow_dispatch），不会随 push/cron 自动跑
#   - artifact 设置 1 天过期
#   - 用完请立刻删除本 workflow（见 PR 描述）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export signing keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -u
          if [ -z "${SIGNING_KEY:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ]; then
            echo "::error::SIGNING_KEY / SIGNING_STORE_PASSWORD 未配置"
            exit 1
          fi
          echo "secrets 存在"

      - name: Restore keystore and export
        id: restore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p _export
          KS=_export/tuptup-release.jks

          # SIGNING_KEY 可能是纯 base64，也可能已是二进制：两种都试，
          # 判据交给 keytool —— 解出来的必须能当 keystore 打开。
          ok=0
          if printf '%s' "$SIGNING_KEY" | base64 -d > "$KS" 2>/dev/null && [ -s "$KS" ]; then
            if keytool -list -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" >/tmp/ks.txt 2>&1; then
              echo "SIGNING_KEY 是 base64 编码"
              ok=1
            else
              echo "base64 解出来不是有效 keystore，改试原始字节"
            fi
          fi
          if [ "$ok" = "0" ]; then
            printf '%s' "$SIGNING_KEY" > "$KS"
            keytool -list -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" >/tmp/ks.txt 2>&1
            echo "SIGNING_KEY 是原始字节"
            ok=1
          fi

          grep -q 'PrivateKeyEntry' /tmp/ks.txt || { echo "::error::keystore 内无 PrivateKeyEntry"; cat /tmp/ks.txt; exit 1; }

          ALIAS=""
          while IFS= read -r a; do
            [ -n "$a" ] && ALIAS="$a" && break
          done < <(grep 'PrivateKeyEntry' /tmp/ks.txt | awk -F', ' '{print $1}')
          [ -n "$ALIAS" ] || { echo "::error::解析 alias 失败"; exit 1; }

          # 把实际解析到的口径写成文件，迁移时直接照抄
          cat > _export/signing-meta.txt <<EOF
          SIGNING_KEY_ALIAS=$ALIAS
          SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}
          EOF

          {
            echo "keystore 已还原: $(stat -c%s "$KS") B"
            echo "alias=$ALIAS"
            echo "---keytool -list---"
            cat /tmp/ks.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: _export/
          retention-days: 1
          if-no-files-found: error
