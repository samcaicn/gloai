version: '3'

tasks:
  test:
    desc: Run all tests (PG + SQLite + integration)
    env:
      TEST_DATABASE_URL: "postgres://ceoadmin:ceoadmin@localhost:15432/ceoadmin_test?sslmode=disable"
    cmds:
      - task: test-up
      - defer: { task: test-down }
      - go test -p 1 ./... -v -count=1

  test-up:
    desc: Start test dependencies
    cmds:
      - docker compose -f docker-compose.test.yml up -d --wait

  test-down:
    desc: Stop and remove test dependencies
    cmds:
      - docker compose -f docker-compose.test.yml down -v

  build:
    desc: Build the hub (includes the Parquet cold-tier codec)
    cmds:
      - go build -o oih .

  build-slim:
    desc: >-
      Build without the Parquet codec (~10MB smaller). The cold tier then
      defaults to JSONL and cannot read datasets that already contain
      .parquet parts.
    cmds:
      - go build -tags noparquet -o oih .

  test-slim:
    desc: Run cold-tier tests for the slim (-tags noparquet) build
    cmds:
      - go test -tags noparquet ./internal/cosexport/
