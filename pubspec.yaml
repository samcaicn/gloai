name: camhub_store
description: 店长 APK —— 用店里已有摄像头做「打开即自查」的 AI 合规巡检工具（Android + HarmonyOS 双端）。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  xml: ^6.3.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  image: ^4.1.7            # 抓图压缩到 ≤1080P 再上传
  intl: ^0.19.0
  # OpenHarmony Flutter 适配版需对应引擎；在 ohos 环境下由 flutter_flutter 提供。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 多语言资源（自查项/整改建议文案）
  assets:
    - assets/

  # 仅声明图标，不强制依赖原生图标库
  # fonts: []

